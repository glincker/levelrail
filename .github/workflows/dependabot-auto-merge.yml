name: Dependabot auto-merge

# Auto-merges once CI passes: patch updates, github-actions bumps, and
# minor bumps on non-security-relevant deps. Holds for review: any major
# bump, and any bump at all on a security-relevant dependency.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    steps:
      - name: Fetch dependency metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify security relevance
        id: classify
        run: |
          names="${{ steps.meta.outputs.dependency-names }}"
          security_relevant=false
          for pattern in \
            "filippo.io/" \
            "golang.org/x/crypto" \
            "github.com/caddyserver/" \
            "golang.zx2c4.com/wireguard" \
            "google.golang.org/grpc" \
            "github.com/go-jose/go-jose" \
            "github.com/coreos/go-oidc" \
            "go.step.sm/crypto" \
            "github.com/smallstep/" \
            "github.com/google/go-tpm" \
            "github.com/docker/docker" \
            "github.com/moby/"; do
            if [[ "$names" == *"$pattern"* ]]; then
              security_relevant=true
              break
            fi
          done
          echo "security-relevant=$security_relevant" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge on safe updates
        if: |
          steps.meta.outputs.package-ecosystem == 'github_actions' ||
          steps.meta.outputs.package-ecosystem == 'github-actions' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           steps.classify.outputs.security-relevant == 'false')
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major or security-relevant bumps for manual review
        if: |
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          steps.meta.outputs.package-ecosystem != 'github-actions' &&
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          (steps.meta.outputs.update-type == 'version-update:semver-major' ||
           steps.classify.outputs.security-relevant == 'true')
        run: |
          gh pr edit "$PR_URL" --add-label "needs-review"
          if [ "${{ steps.meta.outputs.update-type }}" = "version-update:semver-major" ]; then
            reason="a major version bump; breaking changes are expected and CI passing doesn't guarantee nothing else broke"
          else
            reason="a security-relevant dependency (TLS/ACME, crypto, agent transport, secrets, WireGuard, or the Docker/Moby container client)"
          fi
          gh pr comment "$PR_URL" --body "This is $reason. Not auto-merging, read the release notes before shipping it."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
