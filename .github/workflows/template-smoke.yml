name: Template smoke

# Starts catalog templates under real Docker and reports which stay up.
# Informational only: not a required check, never gates a merge.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated template ids (empty: every template)'
        required: false
        type: string
        default: ''
      category:
        description: 'Only this catalog category (empty: all)'
        required: false
        type: string
        default: ''
      settle:
        description: 'How long every service must stay up'
        required: false
        type: string
        default: '30s'

permissions:
  contents: read

concurrency:
  group: template-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run template smoke
        env:
          SMOKE_ONLY: ${{ inputs.only }}
          SMOKE_CATEGORY: ${{ inputs.category }}
          SMOKE_SETTLE: ${{ inputs.settle || '30s' }}
          SMOKE_SHARD: ${{ matrix.shard }}/8
        run: |
          args=(-pull -parallel 2 -max-image-gb 2 -settle "$SMOKE_SETTLE" -shard "$SMOKE_SHARD"
            -json "smoke-${{ matrix.shard }}.json" -md "smoke-${{ matrix.shard }}.md")
          [ -n "$SMOKE_ONLY" ] && args+=(-only "$SMOKE_ONLY")
          [ -n "$SMOKE_CATEGORY" ] && args+=(-category "$SMOKE_CATEGORY")
          # A failing template is the report's content, not a broken job.
          go run ./scripts/template-smoke "${args[@]}" || [ $? -eq 1 ]

      - name: Free disk between shards
        if: always()
        run: docker system prune -af --volumes >/dev/null

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: template-smoke-${{ matrix.shard }}
          path: smoke-${{ matrix.shard }}.*
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: template-smoke-*
          merge-multiple: true

      - name: Summarize
        run: |
          shopt -s nullglob
          for f in smoke-*.md; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
