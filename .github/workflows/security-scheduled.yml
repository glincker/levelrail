name: security-scheduled

# Advisory scanners: weekly, plus govulncheck on release tags. None of them
# is a required check or a `needs` of `CI required`; findings land in the
# job summary and the Security tab.
on:
  schedule:
    - cron: "30 6 * * 1"
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: security-scheduled-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go (cached)
        uses: ./.github/actions/setup-go-cached
        with:
          cache-prefix: go-build

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Text mode lists only vulnerabilities whose code is reachable.
      - name: Scan (reachable only)
        run: |
          {
            echo '## govulncheck'
            echo '```'
            govulncheck ./... || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan (SARIF)
        run: govulncheck -format sarif ./... > govulncheck.sarif || true

      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  scorecard:
    name: OpenSSF Scorecard
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  osv-scanner:
    name: OSV-Scanner
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan lockfiles
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=go.mod
            --lockfile=kit/go.mod
            --lockfile=tools/go.mod
            --lockfile=web/package-lock.json
            --format=sarif
            --output=osv.sarif

      - name: Upload SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv.sarif
          category: osv-scanner
