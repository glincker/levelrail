name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'adr/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'adr/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gates every other job on which areas actually changed, so a
  # frontend-only PR doesn't wait on the Go suite and vice versa.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'scripts/**'
              - '.github/workflows/**'
            frontend:
              - 'web/**'
              - '.github/workflows/**'

  build-vet:
    name: Build, vet
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  # internal/api gets its own parallel job since it was the module's
  # slowest package by far. PR/push runs skip -race and use -short (the
  # thorough run lives in nightly.yml instead), which is faster and
  # avoids the timing-sensitive tests flaking under runner load.
  test-api:
    name: Test (internal/api)
    runs-on: ubuntu-latest
    needs: [changes, build-vet]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # See test-rest's identical step below for why this is here.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test (short, coverage profile)
        run: go test ./internal/api/... -short -timeout=10m -coverprofile=coverage-api.out

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage-api.out
          retention-days: 1

  test-rest:
    name: Test (everything else)
    runs-on: ubuntu-latest
    needs: [changes, build-vet]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # BuildKit's docker exporter needs the daemon on containerd-backed
      # storage, off by default on the runner's stock Docker install.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test (short, coverage profile)
        run: |
          PACKAGES=$(go list ./... | grep -v '^github.com/GLINCKER/levelrail/internal/api$')
          go test $PACKAGES -short -coverprofile=coverage-rest.out

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rest
          path: coverage-rest.out
          retention-days: 1

  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [changes, test-api, test-rest]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      # Disjoint package sets and the same covermode, so concatenating
      # statement lines under one mode header is the whole merge.
      - name: Merge coverage profiles
        run: |
          head -n1 coverage-artifacts/coverage-api.out > coverage.out
          tail -n +2 coverage-artifacts/coverage-api.out >> coverage.out
          tail -n +2 coverage-artifacts/coverage-rest.out >> coverage.out

      - name: Coverage gate (70% for /internal)
        run: scripts/check-coverage.sh coverage.out internal/ 70

      # TODO: changed-file coverage check on PRs (new code can still lower
      # the bar today, only the overall 70%/internal gate above runs).
      # Needs a main-branch coverage baseline artifact plus a diff tool
      # like vladopajic/go-test-coverage; not built yet.

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  web-check:
    name: Web (tsc, eslint)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: tsc
        working-directory: web
        run: npm exec --no -- tsc --noEmit

      # eslint on the full tree still has a pre-existing backlog (mostly
      # routeTree.gen.ts-related no-unsafe-* noise, not this PR's doing),
      # so scope to changed files only, same as the pre-commit hook does.
      - name: eslint (changed files)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            files=$(git -C web ls-files '*.ts' '*.tsx')
          else
            # merge-base, not base directly: a PR branch that hasn't
            # rebased since other work landed on main must not pick up
            # those unrelated files as "changed".
            merge_base=$(git merge-base "$base" HEAD)
            files=$(git diff --name-only --diff-filter=ACM "$merge_base" HEAD -- 'web/*.ts' 'web/*.tsx' | sed 's#^web/##')
          fi
          if [ -n "$files" ]; then
            cd web && echo "$files" | xargs npm exec --no -- eslint
          else
            echo "no changed web/*.ts(x) files"
          fi
