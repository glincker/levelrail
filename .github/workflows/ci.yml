name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'adr/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'adr/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-vet:
    name: Build, vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  # internal/api alone (over 20 test files, each spinning a real SQLite
  # store and a real httptest server) used to take longer than every
  # other package in the module combined, serialized into one job: that
  # single package was the module's actual critical path. Splitting it
  # into its own parallel job, rather than trying to make any individual
  # test faster, is what actually shortens wall-clock time: the two test
  # jobs below run concurrently, so total CI time is bounded by whichever
  # one is slower, not their sum.
  test-api:
    name: Test (internal/api)
    runs-on: ubuntu-latest
    needs: build-vet
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # See test-rest's identical step below for why this is here.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test (race detector, coverage profile)
        run: go test ./internal/api/... -race -coverprofile=coverage-api.out

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage-api.out
          retention-days: 1

  test-rest:
    name: Test (everything else)
    runs-on: ubuntu-latest
    needs: build-vet
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # internal/build (see its own doc comment) reaches BuildKit through
      # dockerd's hijacked connection, the same path `docker buildx
      # build` uses with the default driver. That path's "docker"
      # exporter (load the result straight into the local image store)
      # needs the daemon on containerd-backed storage; the runner's stock
      # Docker install doesn't have that on by default. Without this, the
      # BuildKit-dependent tests below fail with `exporter "docker" could
      # not be found`, not a code problem, a daemon config one.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test (race detector, coverage profile)
        run: |
          PACKAGES=$(go list ./... | grep -v '^github.com/GLINCKER/levelrail/internal/api$')
          go test $PACKAGES -race -coverprofile=coverage-rest.out

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rest
          path: coverage-rest.out
          retention-days: 1

  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [test-api, test-rest]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      # Both profiles share the same "mode: atomic" header (-race forces
      # atomic mode regardless of what's requested), and the two test
      # jobs above cover strictly disjoint package sets, so there is no
      # overlapping coverage data to sum the way a tool like gocovmerge
      # would need to for two profiles of the *same* packages. Keeping
      # one mode line and concatenating every statement-block line from
      # both is the whole merge.
      - name: Merge coverage profiles
        run: |
          head -n1 coverage-artifacts/coverage-api.out > coverage.out
          tail -n +2 coverage-artifacts/coverage-api.out >> coverage.out
          tail -n +2 coverage-artifacts/coverage-rest.out >> coverage.out

      - name: Coverage gate (70% for /internal)
        run: scripts/check-coverage.sh coverage.out internal/ 70

      # --------------------------------------------------------------------
      # TODO: changed-file coverage check on PRs, so new code cannot lower
      # the bar even if overall coverage passes. NOT implemented yet.
      #
      # Deliberately left as a documented gap rather than a step that runs
      # and always reports green: it needs a real PR run to build and
      # verify against, not something to guess at blind.
      #
      # What building it for real requires:
      #   1. A coverage baseline from `main`. A PR run only has the PR's
      #      own coverage.out, so `main`'s must be produced by this same
      #      job on every push to main and published as a build artifact
      #      (actions/upload-artifact) for PR runs to pull down.
      #   2. On pull_request events, fetch that baseline (e.g. via
      #      dawidd6/action-download-artifact filtered to the latest
      #      successful run on main), and diff the PR's coverage.out
      #      against it for the files in
      #      `git diff --name-only origin/${{ github.base_ref }}...HEAD`.
      #   3. A tool to do the diffing instead of hand-rolling it, most
      #      plausibly vladopajic/go-test-coverage (supports this via its
      #      diff-base-breakdown-file-name input) or a comparable
      #      diff-coverage action. Either has enough moving parts (artifact
      #      naming, workflow_conclusion timing, permissions for cross-run
      #      artifact downloads, PR comment posting) that it needs to be
      #      built and tested against a real PR once main is pushed, not
      #      guessed at without one.
      #   4. Until then, the /internal 70% gate above is the only coverage
      #      check enforced on PRs.
      # --------------------------------------------------------------------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
