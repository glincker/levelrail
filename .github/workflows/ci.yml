name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'adr/**'
      - 'LICENSE'
  # No paths-ignore here: required checks must report on docs-only PRs or
  # auto-merge waits forever. The `changes` job skips the heavy jobs instead.
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTESTSUM_VERSION: v1.13.0

jobs:
  # No `needs`, no path filter: runs immediately alongside `changes` so a
  # migration version collision fails in seconds, not after the full
  # build/test matrix.
  migration-versions:
    name: Migration version check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for duplicate migration versions
        run: scripts/check-migration-versions.sh

  # Gates every other job on which areas actually changed, so a
  # frontend-only PR doesn't wait on the Go suite and vice versa.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/flaky-tests.txt'
            frontend:
              - 'web/**'
              - '.github/workflows/**'
            installer:
              - 'install.sh'
              - 'scripts/test-install-sh.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'

  build-vet:
    name: Build, vet
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Quarantine list (.github/flaky-tests.txt)
        env:
          QUARANTINE_AGE: warn
        run: scripts/check-flaky-tests.sh

  # Go tests are split into lanes by scripts/go-test-groups.sh: internal/api
  # (sharded by test name, it is the slowest package by far), Docker-backed
  # packages (own job, bounded -p so live containers can't OOM each other),
  # and everything else. PR/push runs use -short without -race; nightly.yml
  # has the thorough run. scripts/ci-go-test.sh reruns failed tests at most
  # twice and lists any test that passed only on retry in the job summary.
  test-go:
    name: Test (${{ matrix.lane }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, build-vet]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: api-1
            group: api
            shard: 1/2
            flags: -short -timeout=10m
          - lane: api-2
            group: api
            shard: 2/2
            flags: -short -timeout=10m
          - lane: docker
            group: docker
            flags: -short -p 2 -timeout=12m
          - lane: rest
            group: rest
            flags: -short -timeout=10m
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"

      # BuildKit's docker exporter needs the daemon on containerd-backed
      # storage, off by default on the runner's stock Docker install.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test
        env:
          GO_TEST_FLAGS: ${{ matrix.flags }}
          SHARD: ${{ matrix.shard }}
          COVERPROFILE: coverage-${{ matrix.lane }}.out
        run: |
          pkgs="$(scripts/go-test-groups.sh '${{ matrix.group }}')"
          mapfile -t packages <<<"$pkgs"
          scripts/ci-go-test.sh '${{ matrix.lane }}' "${packages[@]}"

      # overwrite: a re-run of this job replaces its own artifact instead of
      # failing on the name. 7 days: "re-run failed jobs" reuses sibling
      # jobs' artifacts from the first attempt, which a 1-day retention lost.
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.lane }}
          path: coverage-${{ matrix.lane }}.out
          retention-days: 7
          overwrite: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.lane }}
          path: test-results/
          retention-days: 7
          overwrite: true

  # Non-blocking: runs only the tests in .github/flaky-tests.txt, so a
  # quarantined test keeps producing signal without gating merges.
  test-quarantined:
    name: Test (quarantined, non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, build-vet]
    if: needs.changes.outputs.backend == 'true'
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"

      - name: go test (quarantined only)
        env:
          GO_TEST_FLAGS: -short -timeout=10m
          QUARANTINE: only
          RERUNS: '0'
        run: scripts/ci-go-test.sh quarantined ./...

  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes, test-go]
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, not just this job's default shallow clone:
          # the changed-line coverage step below needs a real merge-base
          # against the PR's base branch, which a shallow fetch can't
          # resolve. Only this one lightweight job pays for it.
          fetch-depth: 0

      - name: Download coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Merge coverage profiles
        run: |
          missing=0
          for lane in api-1 api-2 docker rest; do
            if [ ! -f "coverage-artifacts/coverage-$lane.out" ]; then
              echo "::error::coverage-$lane.out missing (artifact expired or its job never uploaded); re-run all jobs"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          scripts/merge-coverprofiles.sh coverage.out coverage-artifacts/coverage-*.out

      - name: Coverage gate (70% for /internal)
        run: scripts/check-coverage.sh coverage.out internal/ 70

      # PR-only: the aggregate gate above can pass while a PR's own new
      # code is barely tested, diluted by the rest of internal/ already
      # being well covered. This scopes the same 70% bar to only the
      # statements this PR actually added or changed.
      - name: Changed-line coverage gate (70% for /internal, PRs only)
        if: github.event_name == 'pull_request'
        run: scripts/check-changed-file-coverage.sh coverage.out "origin/${{ github.event.pull_request.base.ref }}" internal/ 70

  # Push to main only: PR flakes may be the PR's own doing, main's are not.
  flake-report:
    name: File flaky-test issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: [changes, test-go]
    if: always() && github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Open or update flaky-test issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(test-results/*/flaky.txt)
          [ "${#files[@]}" -gt 0 ] || exit 0
          scripts/report-flaky-tests.sh "${files[@]}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  web-check:
    name: Web (tsc, eslint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # Same command release.yml runs: vite build (which also generates
      # routeTree.gen.ts) then `tsc -b`, which type-checks test files too.
      - name: Build (vite build && tsc -b)
        working-directory: web
        run: npm run build

      - name: Bundle size budget
        working-directory: web
        run: npm run check-bundle-size

      # eslint on the full tree still has a pre-existing backlog (mostly
      # routeTree.gen.ts-related no-unsafe-* noise, not this PR's doing),
      # so scope to changed files only, same as the pre-commit hook does.
      - name: eslint (changed files)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          [ -z "$base" ] && base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            files=$(git -C web ls-files '*.ts' '*.tsx')
          else
            # merge-base, not base directly: a PR branch that hasn't
            # rebased since other work landed on main must not pick up
            # those unrelated files as "changed".
            merge_base=$(git merge-base "$base" HEAD)
            files=$(git diff --name-only --diff-filter=ACM "$merge_base" HEAD -- 'web/*.ts' 'web/*.tsx' | sed 's#^web/##')
          fi
          if [ -n "$files" ]; then
            cd web && echo "$files" | xargs npm exec --no -- eslint
          else
            echo "no changed web/*.ts(x) files"
          fi

      - name: vitest
        working-directory: web
        run: npm test

  # Runs install.sh end to end (install, re-run, upgrade, uninstall) in
  # systemd containers against a binary built from this commit.
  install-sh:
    name: install.sh (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build control plane binary
        run: CGO_ENABLED=0 go build -o levelrail-linux-amd64 ./cmd/levelrail

      - name: shellcheck
        run: shellcheck -s sh install.sh scripts/test-install-sh.sh

      - name: Run install.sh in a systemd container
        run: scripts/test-install-sh.sh '${{ matrix.image }}' ./levelrail-linux-amd64

  # The one check branch protection requires: a skipped job can't be
  # required directly (blocks forever), so this always runs and passes
  # only if every job that was supposed to run for this PR did.
  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [migration-versions, changes, build-vet, test-go, coverage-gate, lint, web-check, install-sh]
    if: always()
    timeout-minutes: 3
    steps:
      - name: Evaluate required jobs
        run: |
          if [ "${{ needs.migration-versions.result }}" != "success" ]; then
            echo "migration-versions: ${{ needs.migration-versions.result }} (required)"
            exit 1
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes: ${{ needs.changes.result }} (required)"
            exit 1
          fi
          backend="${{ needs.changes.outputs.backend }}"
          frontend="${{ needs.changes.outputs.frontend }}"
          installer="${{ needs.changes.outputs.installer }}"
          fail=0
          check() {
            if [ "$3" = "true" ] && [ "$2" != "success" ]; then
              echo "$1: $2 (required)"
              fail=1
            fi
          }
          check "build-vet" "${{ needs.build-vet.result }}" "$backend"
          check "test-go" "${{ needs.test-go.result }}" "$backend"
          check "coverage-gate" "${{ needs.coverage-gate.result }}" "$backend"
          check "lint" "${{ needs.lint.result }}" "$backend"
          check "web-check" "${{ needs.web-check.result }}" "$frontend"
          check "install-sh" "${{ needs.install-sh.result }}" "$installer"
          [ "$fail" -eq 0 ] || exit 1
          echo "all required jobs for this PR passed"
