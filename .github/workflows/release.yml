name: Release

on:
  # Tag push only: fires once per real release, not once per PR merge.
  # Dispatch manually against main for an ad hoc :edge build.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0). Only needed when dispatching manually against a ref that is not the tag itself, such as main.'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A push to main has no release tag: RELEASE_TAG resolves to "main"
  # (github.ref_name), which is fine as a checkout ref but not a real
  # version, so the image build-arg gets a distinct value for that case.
  IMAGE_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('main-{0}', github.sha) }}

jobs:
  build-web:
    name: Build frontend
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: web
        run: npm run build && test -s dist/index.html

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-binaries:
    name: Build (linux/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -tags embedweb -ldflags "-X github.com/GLINCKER/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-linux-${{ matrix.goarch }}" ./cmd/levelrail

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goarch }}
          path: levelrail-linux-${{ matrix.goarch }}
          retention-days: 1

  build-cli-binaries:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - goos: windows
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # levelrail-cli is a pure API client: no embedded frontend, no CGO,
      # so unlike build-binaries above it needs neither web/dist nor the
      # embedweb build tag, and cross-compiles for macOS as cheaply as
      # for Linux, worth doing since this is the one binary a real local
      # developer runs day to day, not just a CI runner.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/GLINCKER/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/levelrail-cli

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: levelrail-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  build-agent-binaries:
    name: Build agent (linux/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/GLINCKER/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-agent-linux-${{ matrix.goarch }}" ./cmd/levelrail-agent

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: agent-binary-${{ matrix.goarch }}
          path: levelrail-agent-linux-${{ matrix.goarch }}
          retention-days: 1

  build-agent-packages:
    name: Package agent (linux/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-agent-binaries
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download agent binary
        uses: actions/download-artifact@v8
        with:
          name: agent-binary-${{ matrix.goarch }}
          path: agent-bin

      # nfpm turns a prerelease like 0.2.0-beta.16 into 0.2.0~beta.16, so
      # a beta sorts before its final release in apt and dnf. The output
      # files get stable names like the other release assets, so their
      # names match the entries in checksums.txt.
      - name: Build deb and rpm
        env:
          ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          mkdir -p pkg out
          cp "agent-bin/levelrail-agent-linux-${ARCH}" pkg/levelrail-agent
          export VERSION="${RELEASE_TAG#v}"
          for fmt in deb rpm; do
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm/agent.yaml --packager "$fmt" --target "out/levelrail-agent-linux-${ARCH}.${fmt}"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: agent-package-${{ matrix.goarch }}
          path: out/*
          retention-days: 1

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build-binaries, build-cli-binaries, build-agent-binaries, build-agent-packages]
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-binary-*
          path: dist
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@v8
        with:
          pattern: agent-binary-*
          path: dist
          merge-multiple: true

      - name: Download agent packages
        uses: actions/download-artifact@v8
        with:
          pattern: agent-package-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums.txt (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please already creates the GitHub Release itself (with
          # changelog notes) when it tags a version, before this workflow
          # ever runs. Attach the built binaries to that existing release
          # instead of trying to create a second one for the same tag; fall
          # back to a fresh create for a tag pushed some other way.
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ env.RELEASE_TAG }}" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "${{ env.RELEASE_TAG }}" dist/* \
              --repo "${{ github.repository }}" \
              --generate-notes
          fi

  publish-homebrew:
    name: Publish CLI to Homebrew
    needs: release
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern checksums.txt --dir dist

      # Skipped, not failed, until the owner adds the deploy key: the
      # release itself must not depend on package-manager credentials.
      # A deploy key is scoped to the tap repo alone, unlike a user token.
      - name: Update Homebrew tap
        if: env.HAS_TAP_KEY == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:glincker/homebrew-tap.git tap
          mkdir -p tap/Formula
          scripts/render-homebrew-formula.sh "${{ env.RELEASE_TAG }}" dist/checksums.txt > tap/Formula/levelrail-cli.rb
          cd tap
          git config user.name "levelrail release"
          git config user.email "support@levelrail.com"
          git add Formula/levelrail-cli.rb
          git diff --cached --quiet || git commit -m "levelrail-cli ${{ env.RELEASE_TAG }}"
          git push
          rm -f ~/.ssh/tap_key

  publish-npm:
    name: Publish CLI to npm
    needs: release
    # Off until trusted publishing is set up for each package on npmjs.com
    # and the NPM_PUBLISH_ENABLED repo variable is "true" (see docs/ci.md).
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern 'levelrail-cli-*' --dir dist

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. No token is
      # used: an NPM_TOKEN left in the organization is deliberately ignored.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@11.18.0

      # A prerelease takes the latest dist-tag only while no stable version
      # exists on npm, so `npm install levelrail-cli` gets the newest build
      # instead of a stale one; after the first stable release, prereleases
      # go to beta. A package version that is already on the registry is
      # skipped, so a re-run after a partial failure finishes the rest.
      - name: Publish npm packages
        run: |
          set -euo pipefail
          scripts/build-npm-packages.sh "${{ env.RELEASE_TAG }}" dist npm-out
          dist_tag=latest
          case "${{ env.RELEASE_TAG }}" in
            *-*)
              has_stable=$(npm view levelrail-cli versions --json 2>/dev/null | node -e 'const v=[].concat(JSON.parse(require("fs").readFileSync(0,"utf8")||"[]")); console.log(v.some((x) => !x.includes("-")))')
              [ "$has_stable" = "true" ] && dist_tag=beta
              ;;
          esac
          for dir in npm-out/levelrail-cli-*/ npm-out/levelrail-cli/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$dist_tag")
          done

  image-channel:
    name: Resolve image tags
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      primary_tag: ${{ steps.resolve.outputs.primary_tag }}
    steps:
      # Shared by both merge-image-* jobs: dispatching against main gets
      # :edge, a prerelease tag gets :beta, a stable tag gets :vX.Y.Z,
      # :vX.Y, and :latest.
      - name: Resolve
        id: resolve
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            tags="edge"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            tags="$RELEASE_TAG beta"
          else
            major_minor="$(echo "$RELEASE_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
            tags="$RELEASE_TAG latest $major_minor"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$(echo "$tags" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-image-levelrail:
    name: Build levelrail image (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native per-arch runners instead of QEMU emulation: each leg
      # compiles Go for its own real CPU, not an emulated one, which is
      # the difference between this taking single-digit minutes and
      # timing out (a QEMU-emulated arm64 build of this image was
      # cancelled at the 20-minute job limit on a cold cache). Each leg
      # pushes its own image by digest; the merge job below assembles
      # the final multi-arch manifest from those digests.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.levelrail
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/glincker/levelrail,push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.IMAGE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=levelrail-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=levelrail-${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-cp-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge-image-levelrail:
    name: Merge and tag levelrail image
    runs-on: ubuntu-latest
    needs: [build-image-levelrail, image-channel]
    if: needs.build-image-levelrail.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-cp-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          for t in ${{ needs.image-channel.outputs.tags }}; do
            tag_args+=(-t "ghcr.io/glincker/levelrail:$t")
          done
          # shellcheck disable=SC2046 # deliberate: each digest file becomes its own argument
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/glincker/levelrail@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the manifest-list digest, not a tag: tags are mutable
      # (:latest and :edge move), the digest is the exact content that
      # was just pushed. The digest is the sha256 of the raw manifest
      # list itself, per the OCI content-addressable convention.
      - name: Sign image
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "ghcr.io/glincker/levelrail@${digest}"

  build-image-levelrail-agent:
    name: Build levelrail-agent image (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.levelrail-agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/glincker/levelrail-agent,push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.IMAGE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=levelrail-agent-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=levelrail-agent-${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-agent-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge-image-levelrail-agent:
    name: Merge and tag levelrail-agent image
    runs-on: ubuntu-latest
    needs: [build-image-levelrail-agent, image-channel]
    if: needs.build-image-levelrail-agent.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-agent-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          for t in ${{ needs.image-channel.outputs.tags }}; do
            tag_args+=(-t "ghcr.io/glincker/levelrail-agent:$t")
          done
          # shellcheck disable=SC2046 # deliberate: each digest file becomes its own argument
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/glincker/levelrail-agent@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/glincker/levelrail-agent:${{ needs.image-channel.outputs.primary_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail-agent:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "ghcr.io/glincker/levelrail-agent@${digest}"

  release-notes:
    name: Write release notes
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [release, merge-image-levelrail, merge-image-levelrail-agent]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      discussions: write
      actions: write
    steps:
      # Default ref (main) on purpose: the generator is tooling, not part of
      # the release being built, and older tags predate it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Generate and publish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-notes.sh "$RELEASE_TAG"

      - name: Rebuild docs changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-docs.yml --repo "${{ github.repository }}" --ref main
