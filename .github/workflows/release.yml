name: Release

# release-verify, package-managers and release-npm-verify read this title to
# skip dry runs and to find the tag of a run dispatched against main.
run-name: ${{ inputs.dry_run && format('Dry run {0}', inputs.tag) || format('Release {0}', inputs.tag || github.ref_name) }}

on:
  # Tag push only: fires once per real release, not once per PR merge.
  # Dispatch manually against main for an ad hoc :edge build.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0). Only needed when dispatching manually against a ref that is not the tag itself, such as main.'
        required: true
        type: string
      dry_run:
        description: 'Build, gate and build images without pushing them, then stop before anything is published.'
        required: false
        type: boolean
        default: false
      publish_all:
        description: 'Publish every optional channel even when its inputs did not change (repair or backfill).'
        required: false
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A push to main has no release tag: RELEASE_TAG resolves to "main"
  # (github.ref_name), which is fine as a checkout ref but not a real
  # version, so the image build-arg gets a distinct value for that case.
  IMAGE_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('main-{0}', github.sha) }}

jobs:
  # Decides which optional channels have anything new to ship. It fails open:
  # a missing script, a lookup error or a failed job all mean publish.
  changes:
    name: Detect changed components
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mcp: ${{ steps.detect.outputs.mcp }}
      terraform: ${{ steps.detect.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        continue-on-error: true
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        continue-on-error: true
        with:
          go-version-file: go.mod

      # The MCP baseline is the version npm serves, so a publish that failed
      # on an earlier release is retried; the CLI and agent rows are report only.
      - name: Detect
        id: detect
        env:
          PUBLISH_ALL: ${{ inputs.publish_all && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -uo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_TAG}^" 2>/dev/null || true)"
          mcp_base=""
          if v="$(npm view levelrail-mcp version 2>/dev/null)" && [ -n "$v" ]; then
            mcp_base="v${v}"
          fi
          detect() {
            if [ "$PUBLISH_ALL" = "true" ] || [ ! -x scripts/release/changed-components.sh ]; then
              echo true
              return
            fi
            scripts/release/changed-components.sh "$1" "$2" "$RELEASE_TAG" || echo true
          }
          {
            echo "### Changed components for ${RELEASE_TAG}"
            echo
            [ "$DRY_RUN" = "true" ] && echo "Dry run: nothing is published." && echo
            echo "| Component | Baseline | Changed | Gates |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "mcp:${mcp_base}:npm MCP server and MCP Registry" "terraform:${prev}:Terraform mirror sync" "cli:${prev}:report only" "agent:${prev}:report only"; do
            IFS=: read -r name base gates <<<"$row"
            changed="$(detect "$name" "$base" | tail -1)"
            echo "${name}=${changed}" >> "$GITHUB_OUTPUT"
            echo "| ${name} | ${base:-none} | ${changed} | ${gates} |" >> "$GITHUB_STEP_SUMMARY"
          done

  build-web:
    name: Build frontend
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # Older tags predate the shared script, so a re-run of one still builds.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          if [ -x scripts/release/web-build.sh ]; then
            scripts/release/web-build.sh
          else
            cd web && npm run build && test -s dist/index.html
          fi

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-binaries:
    name: Build (linux/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -tags embedweb -ldflags "-X github.com/glincker/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-linux-${{ matrix.goarch }}" ./cmd/levelrail

      - name: Write release manifest
        if: matrix.goarch == 'amd64'
        run: ./levelrail-linux-amd64 version --json > release-manifest.json

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.goarch }}
          path: |
            levelrail-linux-${{ matrix.goarch }}
            release-manifest.json
          if-no-files-found: ignore
          retention-days: 1

  build-cli-binaries:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - goos: windows
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      # levelrail-cli is a pure API client: no embedded frontend, no CGO,
      # so unlike build-binaries above it needs neither web/dist nor the
      # embedweb build tag, and cross-compiles for macOS as cheaply as
      # for Linux, worth doing since this is the one binary a real local
      # developer runs day to day, not just a CI runner.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/glincker/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/levelrail-cli

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: levelrail-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  build-agent-binaries:
    name: Build agent (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/glincker/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-agent-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/levelrail-agent

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: levelrail-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  build-agent-packages:
    name: Package agent (linux/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-agent-binaries
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Download agent binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: agent-binary-linux-${{ matrix.goarch }}
          path: agent-bin

      # nfpm turns a prerelease like 0.2.0-beta.16 into 0.2.0~beta.16, so
      # a beta sorts before its final release in apt and dnf. The output
      # files get stable names like the other release assets, so their
      # names match the entries in checksums.txt.
      - name: Build deb and rpm
        env:
          ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          mkdir -p pkg out
          cp "agent-bin/levelrail-agent-linux-${ARCH}" pkg/levelrail-agent
          export VERSION="${RELEASE_TAG#v}"
          for fmt in deb rpm; do
            "$(go env GOPATH)/bin/nfpm" package --config deploy/packaging/nfpm/agent.yaml --packager "$fmt" --target "out/levelrail-agent-linux-${ARCH}.${fmt}"
          done

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-package-${{ matrix.goarch }}
          path: out/*
          retention-days: 1

  # Runs before any asset or image is published. The schema and smoke gates are
  # warnings, not failures, while no previous release can be compared (first release).
  release-gate:
    name: Release gate
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-binaries
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Download candidate binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binary-amd64
          path: candidate

      # The newest published release that carries a control plane binary. Kit
      # module releases and the release being built have none, so they are skipped.
      - name: Download previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p previous
          for tag in $(gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 20 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$RELEASE_TAG" ] && continue
            if gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx 'levelrail-linux-amd64'; then
              gh release download "$tag" --repo "${{ github.repository }}" --dir previous \
                --pattern levelrail-linux-amd64 --pattern checksums.txt --pattern release-manifest.json
              (cd previous && grep ' levelrail-linux-amd64$' checksums.txt | sha256sum -c -)
              chmod +x previous/levelrail-linux-amd64
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::warning::no previous release with a control plane binary was found, so the monotonic schema and upgrade smoke gates are skipped"

      - name: Run release gate
        env:
          PREV_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x candidate/levelrail-linux-amd64
          args=(--candidate candidate/levelrail-linux-amd64 --tag "$RELEASE_TAG" --manifest candidate/release-manifest.json)
          if [ -n "$PREV_TAG" ]; then
            args+=(--prev-binary previous/levelrail-linux-amd64 --prev-tag "$PREV_TAG")
            if [ -f previous/release-manifest.json ]; then
              args+=(--prev-schema "$(jq -er '.schema_version' previous/release-manifest.json)")
            fi
          fi
          scripts/release-gate.sh "${args[@]}"

  release:
    name: Publish release
    # Every later publish job needs this one, so a dry run stops here.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && !inputs.dry_run
    runs-on: ubuntu-latest
    needs: [release-gate, build-binaries, build-cli-binaries, build-agent-binaries, build-agent-packages]
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Download CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-binary-*
          path: dist
          merge-multiple: true

      - name: Download agent binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-binary-*
          path: dist
          merge-multiple: true

      - name: Download agent packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-package-*
          path: dist
          merge-multiple: true

      - name: Add install scripts from the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            install.sh
            install-cli.sh
            install-cli.ps1
          sparse-checkout-cone-mode: false
          path: src
          persist-credentials: false

      - name: Copy install scripts into dist
        run: cp src/install.sh src/install-cli.sh src/install-cli.ps1 dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          # The release manifest carries the schema version the Updates page checks before offering this release.
          grep -q ' release-manifest.json$' checksums.txt || { echo "::error::release-manifest.json is missing, so this release would publish no schema version"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign checksums.txt (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please already creates the GitHub Release itself (with
          # changelog notes) when it tags a version, before this workflow
          # ever runs. Attach the built binaries to that existing release
          # instead of trying to create a second one for the same tag; fall
          # back to a fresh create for a tag pushed some other way.
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ env.RELEASE_TAG }}" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "${{ env.RELEASE_TAG }}" dist/* \
              --repo "${{ github.repository }}" \
              --generate-notes
          fi

  publish-homebrew:
    name: Publish CLI and agent to Homebrew
    needs: release
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern checksums.txt --dir dist

      # Skipped, not failed, until the owner adds the deploy key: the
      # release itself must not depend on package-manager credentials.
      # A deploy key is scoped to the tap repo alone, unlike a user token.
      - name: Update Homebrew tap
        if: env.HAS_TAP_KEY == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:glincker/homebrew-tap.git tap
          mkdir -p tap/Formula
          scripts/render-homebrew-formula.sh "${{ env.RELEASE_TAG }}" dist/checksums.txt > tap/Formula/levelrail-cli.rb
          scripts/render-homebrew-agent-formula.sh "${{ env.RELEASE_TAG }}" dist/checksums.txt > tap/Formula/levelrail-agent.rb
          cd tap
          git config user.name "levelrail release"
          git config user.email "support@levelrail.com"
          git add Formula/levelrail-cli.rb Formula/levelrail-agent.rb
          git diff --cached --quiet || git commit -m "levelrail-cli and levelrail-agent ${{ env.RELEASE_TAG }}"
          git push
          rm -f ~/.ssh/tap_key

  publish-windows-packages:
    name: Publish winget and Scoop manifests
    needs: release
    # Off until WINDOWS_PACKAGES_ENABLED is set; prereleases never go to winget.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && vars.WINDOWS_PACKAGES_ENABLED == 'true' && !contains(github.event.inputs.tag || github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
      HAS_SCOOP_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern checksums.txt --dir dist

      - name: Render manifests
        run: scripts/release/gen-windows-manifests.sh "${{ env.RELEASE_TAG }}" dist/checksums.txt rendered

      # Needs no credentials, so a maintainer can submit by hand when the
      # token or key below is missing.
      - name: Attach manifests to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cp rendered/scoop/levelrail-cli.json assets/levelrail-cli.scoop.json
          for f in rendered/winget/manifests/g/Glincker/LevelrailCli/*/*.yaml; do
            cp "$f" "assets/winget-$(basename "$f")"
          done
          gh release upload "${{ env.RELEASE_TAG }}" assets/* --repo "${{ github.repository }}" --clobber

      # The package must already exist in winget-pkgs; the first submission is by hand.
      - name: Open the winget PR
        if: env.HAS_WINGET_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: Glincker.LevelrailCli
          version: ${{ env.RELEASE_TAG }}
          release-tag: ${{ env.RELEASE_TAG }}
          installers-regex: 'levelrail-cli-windows-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Update Scoop bucket
        if: env.HAS_SCOOP_KEY == 'true'
        env:
          BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$BUCKET_DEPLOY_KEY" > ~/.ssh/bucket_key
          chmod 600 ~/.ssh/bucket_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/bucket_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:glincker/scoop-bucket.git bucket
          mkdir -p bucket/bucket
          cp rendered/scoop/levelrail-cli.json bucket/bucket/levelrail-cli.json
          cd bucket
          git config user.name "levelrail release"
          git config user.email "support@levelrail.com"
          git add bucket/levelrail-cli.json
          git diff --cached --quiet || git commit -m "levelrail-cli ${{ env.RELEASE_TAG }}"
          git push
          rm -f ~/.ssh/bucket_key

  publish-aur-nix:
    name: Attach AUR and Nix files
    needs: release
    # Off until AUR_NIX_ENABLED is set. Output is release assets only.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && vars.AUR_NIX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern checksums.txt --dir dist

      - name: Render PKGBUILD and flake
        run: scripts/release/gen-aur-nix.sh "${{ env.RELEASE_TAG }}" dist/checksums.txt rendered

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cp rendered/aur/PKGBUILD assets/levelrail-cli-bin.PKGBUILD
          cp rendered/nix/flake.nix assets/levelrail-cli.flake.nix
          gh release upload "${{ env.RELEASE_TAG }}" assets/* --repo "${{ github.repository }}" --clobber

  publish-terraform-mirror:
    name: Sync Terraform provider mirror
    needs: [release, changes]
    # !cancelled() keeps a failed change detection from skipping the sync; it then publishes.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && !cancelled() && needs.release.result == 'success' && needs.changes.outputs.terraform != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HAS_MIRROR_KEY: ${{ secrets.TF_MIRROR_DEPLOY_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # Skipped, not failed, until the owner adds the deploy key. The mirror
      # only gets a new version when the provider changed since the last tag,
      # unless publish_all asks for a repair sync.
      - name: Sync the provider into the mirror and tag it
        if: env.HAS_MIRROR_KEY == 'true'
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.TF_MIRROR_DEPLOY_KEY }}
          PUBLISH_ALL: ${{ inputs.publish_all && 'true' || 'false' }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${{ env.RELEASE_TAG }}^" 2>/dev/null || true)"
          if [ "$PUBLISH_ALL" != "true" ] && [ -n "$prev" ] && git diff --quiet "$prev" "${{ env.RELEASE_TAG }}" -- integrations/terraform-provider; then
            echo "provider unchanged since $prev, nothing to sync"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/mirror_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:glincker/terraform-provider-levelrail.git mirror
          git -C mirror config user.name "levelrail release"
          git -C mirror config user.email "support@levelrail.com"
          integrations/terraform-provider/release/mirror-sync.sh --clone mirror --yes
          rm -f ~/.ssh/mirror_key

  publish-npm:
    name: Publish CLI to npm
    needs: release
    # Off until trusted publishing is set up for each package on npmjs.com
    # and the NPM_PUBLISH_ENABLED repo variable is "true" (see docs/release-process.md).
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" --pattern 'levelrail-cli-*' --dir dist

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer. No token is
      # used: an NPM_TOKEN left in the organization is deliberately ignored.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@11.18.0

      # A prerelease takes the latest dist-tag only while no stable version
      # exists on npm, so `npm install levelrail-cli` gets the newest build
      # instead of a stale one; after the first stable release, prereleases
      # go to beta. A package version that is already on the registry is
      # skipped, so a re-run after a partial failure finishes the rest.
      - name: Publish npm packages
        run: |
          set -euo pipefail
          scripts/build-npm-packages.sh "${{ env.RELEASE_TAG }}" dist npm-out
          dist_tag=latest
          case "${{ env.RELEASE_TAG }}" in
            *-*)
              has_stable=$(npm view levelrail-cli versions --json 2>/dev/null | node -e 'const v=[].concat(JSON.parse(require("fs").readFileSync(0,"utf8")||"[]")); console.log(v.some((x) => !x.includes("-")))')
              [ "$has_stable" = "true" ] && dist_tag=beta
              ;;
          esac
          # Order matters: the forwarders depend on levelrail-cli.
          for dir in npm-out/levelrail-cli-*/ npm-out/levelrail-cli/ npm-out/levelrail/ npm-out/levelrail-scoped/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            # Brand-name forwarders may not exist on npm yet (first publish needs a
            # manual step), so their failure warns instead of failing the release.
            case "$name" in
              levelrail-cli|levelrail-cli-*) (cd "$dir" && npm publish --provenance --access public --tag "$dist_tag") ;;
              *) (cd "$dir" && npm publish --provenance --access public --tag "$dist_tag") \
                   || echo "::warning::${name}@${version} was not published; see docs/release-process.md" ;;
            esac
          done

  image-channel:
    name: Resolve image tags
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      primary_tag: ${{ steps.resolve.outputs.primary_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/release

      # Shared by both merge-image-* jobs: dispatching against main gets
      # :edge, a prerelease tag gets :vX.Y.Z-pre and :beta, a stable tag gets
      # vX.Y.Z, X.Y.Z, vX.Y, X.Y, vX, X and :latest.
      - name: Resolve
        id: resolve
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -f scripts/release/image-tags.sh ]; then
            tags="$(scripts/release/image-tags.sh "$RELEASE_TAG" "$IS_MAIN_PUSH")"
          elif [ "$IS_MAIN_PUSH" = "true" ]; then
            tags="edge"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            tags="$RELEASE_TAG beta"
          else
            major_minor="$(echo "$RELEASE_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
            tags="$RELEASE_TAG latest $major_minor"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$(echo "$tags" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-image-levelrail:
    name: Build levelrail image (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    needs: release-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native per-arch runners instead of QEMU emulation: each leg
      # compiles Go for its own real CPU, not an emulated one, which is
      # the difference between this taking single-digit minutes and
      # timing out (a QEMU-emulated arm64 build of this image was
      # cancelled at the 20-minute job limit on a cold cache). Each leg
      # pushes its own image by digest; the merge job below assembles
      # the final multi-arch manifest from those digests.
      # Tags cut before the Dockerfile set a Node heap limit ran out of memory in tsc.
      - name: Give the image web build enough heap
        run: |
          grep -q '^ENV NODE_OPTIONS=' deploy/docker/Dockerfile.levelrail || \
            sed -i 's|^RUN npm run build|ENV NODE_OPTIONS=--max-old-space-size=8192\nRUN npm run build|' deploy/docker/Dockerfile.levelrail

      # Labels come from a script so the same text is testable offline.
      - name: Image labels
        id: labels
        run: |
          if [ ! -f scripts/release/image-labels.sh ]; then
            echo "::notice::scripts/release missing on this ref, skipping"
            echo 'labels=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'labels<<EOF_LABELS'
            scripts/release/image-labels.sh "levelrail" \
              "Levelrail control plane: a self-hosted deployment platform with git push deploys, automatic HTTPS, logs, metrics and rollback." \
              "$IMAGE_VERSION" "${{ github.sha }}"
            echo 'EOF_LABELS'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.levelrail
          labels: ${{ steps.labels.outputs.labels }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/glincker/levelrail,push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}
          build-args: VERSION=${{ env.IMAGE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=levelrail-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=levelrail-${{ matrix.artifact }}

      - name: Export digest
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-cp-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge-image-levelrail:
    name: Merge and tag levelrail image
    runs-on: ubuntu-latest
    needs: [build-image-levelrail, image-channel]
    if: needs.build-image-levelrail.result == 'success' && !inputs.dry_run
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.report.outputs.digest }}
      mirrored: ${{ steps.report.outputs.mirrored }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/release

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-cp-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          for t in ${{ needs.image-channel.outputs.tags }}; do
            tag_args+=(-t "ghcr.io/glincker/levelrail:$t")
          done
          # shellcheck disable=SC2046 # deliberate: each digest file becomes its own argument
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/glincker/levelrail@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Sign the manifest-list digest, not a tag: tags are mutable
      # (:latest and :edge move), the digest is the exact content that
      # was just pushed. The digest is the sha256 of the raw manifest
      # list itself, per the OCI content-addressable convention.
      - name: Sign image
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "ghcr.io/glincker/levelrail@${digest}"

      # Off until the owner sets DOCKERHUB_PUBLISH_ENABLED and both secrets;
      # a missing secret skips the mirror and never fails the release.
      - name: Log in to Docker Hub
        id: dockerhub-login
        if: vars.DOCKERHUB_PUBLISH_ENABLED == 'true' && env.HAS_DOCKERHUB == 'true'
        continue-on-error: true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Copies the already pushed multi-arch index, so Docker Hub gets the
      # same digest and the cosign signature below covers both registries.
      - name: Mirror image to Docker Hub
        id: mirror
        if: vars.DOCKERHUB_PUBLISH_ENABLED == 'true' && env.HAS_DOCKERHUB == 'true' && steps.dockerhub-login.outcome == 'success'
        continue-on-error: true
        run: |
          src="ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }}"
          tag_args=()
          for t in ${{ needs.image-channel.outputs.tags }}; do
            tag_args+=(-t "docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'levelrail' }}/levelrail:$t")
          done
          docker buildx imagetools create "${tag_args[@]}" "$src"
          digest="sha256:$(docker buildx imagetools inspect "$src" --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'levelrail' }}/levelrail@${digest}"

      # Best effort: the script warns and exits 0 on any Docker Hub API error.
      - name: Update Docker Hub description
        if: steps.mirror.outcome == 'success' && needs.image-channel.outputs.primary_tag != 'edge'
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'levelrail' }}
        run: |
          if [ ! -f scripts/release/dockerhub-describe.sh ]; then
            echo "::notice::scripts/release missing on this ref, skipping"
            exit 0
          fi
          scripts/release/dockerhub-describe.sh levelrail "$RELEASE_TAG"

      # GHCR is the source of truth, so a Docker Hub failure must not skip the release notes.
      - name: Warn when the Docker Hub mirror failed
        if: steps.dockerhub-login.outcome == 'failure' || steps.mirror.outcome == 'failure'
        run: echo "::warning::Docker Hub mirror of levelrail failed; run dockerhub-mirror.yml with tag $RELEASE_TAG once the credentials work"

      # Feeds the release notes block; mirrored is true only when the mirror step ran.
      - name: Report digest
        id: report
        if: always()
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)" || digest=""
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "mirrored=${{ steps.mirror.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

