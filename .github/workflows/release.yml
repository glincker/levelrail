name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.1.0). Only needed when dispatching manually against a ref that is not the tag itself, such as main.'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A push to main has no release tag: RELEASE_TAG resolves to "main"
  # (github.ref_name), which is fine as a checkout ref but not a real
  # version, so the image build-arg gets a distinct value for that case.
  IMAGE_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('main-{0}', github.sha) }}

jobs:
  build-web:
    name: Build frontend
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build-binaries:
    name: Build (linux/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-web
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -tags embedweb -ldflags "-X github.com/GLINCKER/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-linux-${{ matrix.goarch }}" ./cmd/levelrail

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goarch }}
          path: levelrail-linux-${{ matrix.goarch }}
          retention-days: 1

  build-cli-binaries:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # levelrail-cli is a pure API client: no embedded frontend, no CGO,
      # so unlike build-binaries above it needs neither web/dist nor the
      # embedweb build tag, and cross-compiles for macOS as cheaply as
      # for Linux, worth doing since this is the one binary a real local
      # developer runs day to day, not just a CI runner.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/GLINCKER/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-cli-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/levelrail-cli

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: levelrail-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 1

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [build-binaries, build-cli-binaries]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Download CLI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: cli-binary-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # release-please already creates the GitHub Release itself (with
          # changelog notes) when it tags a version, before this workflow
          # ever runs. Attach the built binaries to that existing release
          # instead of trying to create a second one for the same tag; fall
          # back to a fresh create for a tag pushed some other way.
          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ env.RELEASE_TAG }}" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "${{ env.RELEASE_TAG }}" dist/* \
              --repo "${{ github.repository }}" \
              --generate-notes
          fi

  image-channel:
    name: Resolve image tags
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tags: ${{ steps.resolve.outputs.tags }}
      primary_tag: ${{ steps.resolve.outputs.primary_tag }}
    steps:
      # One place decides which tags a build gets, shared by both
      # merge-image-* jobs below: a main push only ever gets :edge, a
      # prerelease tag (a hyphen in the SemVer sense, e.g.
      # v1.2.3-beta.1) gets :beta, and a stable tag gets its own
      # :vX.Y.Z (unchanged), plus :vX.Y and :latest.
      - name: Resolve
        id: resolve
        env:
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            tags="edge"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            tags="$RELEASE_TAG beta"
          else
            major_minor="$(echo "$RELEASE_TAG" | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/')"
            tags="$RELEASE_TAG latest $major_minor"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$(echo "$tags" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build-image-levelrail:
    name: Build levelrail image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native per-arch runners instead of QEMU emulation: each leg
      # compiles Go for its own real CPU, not an emulated one, which is
      # the difference between this taking single-digit minutes and
      # timing out (a QEMU-emulated arm64 build of this image was
      # cancelled at the 20-minute job limit on a cold cache). Each leg
      # pushes its own image by digest; the merge job below assembles
      # the final multi-arch manifest from those digests.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.levelrail
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/glincker/levelrail,push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.IMAGE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=levelrail-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=levelrail-${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-cp-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge-image-levelrail:
    name: Merge and tag levelrail image
    runs-on: ubuntu-latest
    needs: [build-image-levelrail, image-channel]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-cp-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          for t in ${{ needs.image-channel.outputs.tags }}; do
            tag_args+=(-t "ghcr.io/glincker/levelrail:$t")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/glincker/levelrail@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the manifest-list digest, not a tag: tags are mutable
      # (:latest and :edge move), the digest is the exact content that
      # was just pushed. The digest is the sha256 of the raw manifest
      # list itself, per the OCI content-addressable convention.
      - name: Sign image
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "ghcr.io/glincker/levelrail@${digest}"

  build-image-levelrail-agent:
    name: Build levelrail-agent image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.levelrail-agent
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/glincker/levelrail-agent,push-by-digest=true,name-canonical=true,push=true
          build-args: VERSION=${{ env.IMAGE_VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=levelrail-agent-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=levelrail-agent-${{ matrix.artifact }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-agent-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge-image-levelrail-agent:
    name: Merge and tag levelrail-agent image
    runs-on: ubuntu-latest
    needs: [build-image-levelrail-agent, image-channel]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-agent-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag_args=()
          for t in ${{ needs.image-channel.outputs.tags }}; do
            tag_args+=(-t "ghcr.io/glincker/levelrail-agent:$t")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/glincker/levelrail-agent@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/glincker/levelrail-agent:${{ needs.image-channel.outputs.primary_tag }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail-agent:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)"
          cosign sign --yes "ghcr.io/glincker/levelrail-agent@${digest}"

  release-notes:
    name: Write release notes
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [release, merge-image-levelrail, merge-image-levelrail-agent]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      discussions: write
      actions: write
    steps:
      # Default ref (main) on purpose: the generator is tooling, not part of
      # the release being built, and older tags predate it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Generate and publish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-notes.sh "$RELEASE_TAG"

      - name: Rebuild docs changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-docs.yml --repo "${{ github.repository }}" --ref main
