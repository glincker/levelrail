        run: |
          if [ ! -f scripts/release/dockerhub-describe.sh ]; then
            echo "::notice::scripts/release missing on this ref, skipping"
            exit 0
          fi
          scripts/release/dockerhub-describe.sh levelrail-agent "$RELEASE_TAG"

      # GHCR is the source of truth, so a Docker Hub failure must not skip the release notes.
      - name: Warn when the Docker Hub mirror failed
        if: steps.dockerhub-login.outcome == 'failure' || steps.mirror.outcome == 'failure'
        run: echo "::warning::Docker Hub mirror of levelrail-agent failed; the GHCR image is published, mirror it by hand once the Docker Hub credentials work"

      # Feeds the release notes block; mirrored is true only when the mirror step ran.
      - name: Report digest
        id: report
        if: always()
        run: |
          digest="sha256:$(docker buildx imagetools inspect ghcr.io/glincker/levelrail-agent:${{ needs.image-channel.outputs.primary_tag }} --raw | sha256sum | cut -d' ' -f1)" || digest=""
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "mirrored=${{ steps.mirror.outcome == 'success' }}" >> "$GITHUB_OUTPUT"

  release-notes:
    name: Write release notes
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [release, image-channel, merge-image-levelrail, merge-image-levelrail-agent]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      discussions: write
      actions: write
    steps:
      # Default ref (main) on purpose: the generator is tooling, not part of
      # the release being built, and older tags predate it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Builds the release body (header, notes, footer); the Announcements
      # discussion is linked after the edit, so it carries the same body.
      - name: Generate and publish notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PRIMARY_TAG: ${{ needs.image-channel.outputs.primary_tag }}
          IMAGE_TAGS: ${{ needs.image-channel.outputs.tags }}
          CP_MIRRORED: ${{ needs.merge-image-levelrail.outputs.mirrored }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'levelrail' }}
        run: scripts/release-notes.sh "$RELEASE_TAG"

      # Never fails the release: the script only warns when it cannot edit notes.
      - name: Add image pull commands to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PRIMARY_TAG: ${{ needs.image-channel.outputs.primary_tag }}
          IMAGE_TAGS: ${{ needs.image-channel.outputs.tags }}
          CP_DIGEST: ${{ needs.merge-image-levelrail.outputs.digest }}
          AGENT_DIGEST: ${{ needs.merge-image-levelrail-agent.outputs.digest }}
          CP_MIRRORED: ${{ needs.merge-image-levelrail.outputs.mirrored }}
          AGENT_MIRRORED: ${{ needs.merge-image-levelrail-agent.outputs.mirrored }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'levelrail' }}
        run: |
          if [ ! -f scripts/release/image-notes.sh ]; then
            echo "::notice::scripts/release missing on this ref, skipping"
            exit 0
          fi
          scripts/release/image-notes.sh "$RELEASE_TAG"

  # The three MCP jobs below are optional extras: no other job needs them, so a
  # failure here can never block or delay the release. The MCP Registry entry
  # follows the npm publish, so it skips with it.
  build-mcp-binaries:
    name: Build MCP server (${{ matrix.goos }}/${{ matrix.goarch }})
    # Skipped when no MCP input changed since the version npm serves; a dry run still builds.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && vars.NPM_PUBLISH_ENABLED == 'true' && !cancelled() && needs.release-gate.result == 'success' && (needs.changes.outputs.mcp != 'false' || inputs.dry_run)
    needs: [release-gate, changes]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - goos: windows
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      # Pure API client like levelrail-cli: no CGO, no embedded frontend.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags "-X github.com/glincker/levelrail/internal/version.Version=${{ env.RELEASE_TAG }}" -o "levelrail-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/levelrail-mcp

      # Not named cli-binary-*, so the release job never attaches these.
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: levelrail-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 1

  publish-npm-mcp:
    name: Publish MCP server to npm
    needs: [release, build-mcp-binaries]
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && vars.NPM_PUBLISH_ENABLED == 'true' && needs.build-mcp-binaries.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download MCP binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mcp-binary-*
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC
        run: npm install -g npm@11.18.0

      # Same dist-tag rule and skip-if-published rule as the CLI packages.
      - name: Publish npm packages
        run: |
          set -euo pipefail
          scripts/build-mcp-npm-packages.sh "${{ env.RELEASE_TAG }}" dist npm-out
          dist_tag=latest
          case "${{ env.RELEASE_TAG }}" in
            *-*)
              has_stable=$(npm view levelrail-mcp versions --json 2>/dev/null | node -e 'const v=[].concat(JSON.parse(require("fs").readFileSync(0,"utf8")||"[]")); console.log(v.some((x) => !x.includes("-")))')
              [ "$has_stable" = "true" ] && dist_tag=beta
              ;;
          esac
          # Order matters: the launcher depends on the per-platform packages.
          for dir in npm-out/levelrail-mcp-*/ npm-out/levelrail-mcp/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} (already published)"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$dist_tag")
          done

  publish-mcp-registry:
    name: Publish to the MCP Registry
    needs: publish-npm-mcp
    if: needs.publish-npm-mcp.result == 'success' && !contains(github.event.inputs.tag || github.ref_name, '-')
    runs-on: ubuntu-latest
    # A registry problem must never fail the release.
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      # sha256 of mcp-publisher_linux_amd64.tar.gz from the release's checksums file.
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          sparse-checkout: |
            server.json
            scripts/render-mcp-server-json.mjs
          sparse-checkout-cone-mode: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"

      - name: Render server.json for the tag
        run: node scripts/render-mcp-server-json.mjs "$RELEASE_TAG" server.json

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          set -uo pipefail
          version="${RELEASE_TAG#v}"
          pkg=$(node -p "require('./server.json').packages[0].identifier")
          # The registry validates against npm, which can lag the publish by minutes.
          for _ in $(seq 1 18); do
            if npm view "${pkg}@${version}" version >/dev/null 2>&1; then break; fi
            sleep 10
          done
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Publish attempt ${attempt} failed, retrying in 30s" >&2
            sleep 30
          done
          exit 1

  # The publish jobs assemble their npm packages only after the release job,
  # which a dry run never reaches, so a dry run assembles them here instead.
  dry-run-npm-packages:
    name: Assemble npm packages (dry run)
    needs: [build-cli-binaries, build-mcp-binaries]
    if: inputs.dry_run && !cancelled() && needs.build-cli-binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Download CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-binary-*
          path: dist
          merge-multiple: true

      - name: Download MCP binaries
        if: needs.build-mcp-binaries.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mcp-binary-*
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # npm pack --dry-run validates each package.json and lists the files a
      # publish would upload, without contacting the registry.
      - name: Build and pack the packages without publishing
        env:
          HAS_MCP: ${{ needs.build-mcp-binaries.result == 'success' }}
        run: |
          set -euo pipefail
          scripts/build-npm-packages.sh "$RELEASE_TAG" dist npm-out/cli
          if [ "$HAS_MCP" = "true" ]; then
            scripts/build-mcp-npm-packages.sh "$RELEASE_TAG" dist npm-out/mcp
          else
            echo "::notice::MCP binaries were not built (NPM_PUBLISH_ENABLED off), MCP packages not assembled"
          fi
          {
            echo "### npm packages a publish would upload (dry run)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Each builder resets its own output directory, so they get one each.
          for dir in npm-out/*/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            (cd "$dir" && npm pack --dry-run >/dev/null)
            echo "- ${name}@${version}" >> "$GITHUB_STEP_SUMMARY"
          done

  # Extra registries. Each job below is skipped when its variable or secret is
  # missing and can never fail the release (continue-on-error).
  publish-pypi:
    name: Publish Python SDK to PyPI
    needs: release
    # Stable tags only. Trusted publishing (OIDC) needs the project and its
    # publisher configured on pypi.org first; no token is stored here.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && !inputs.dry_run && vars.PYPI_PUBLISH_ENABLED == 'true' && !contains(github.event.inputs.tag || github.ref_name, '-')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      # The tree keeps version 0.0.0, so the release stamps it on a copy.
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          rm -rf sdk-build dist
          cp -r sdk/python sdk-build
          sed -i "s/^version = .*/version = \"${RELEASE_TAG#v}\"/" sdk-build/pyproject.toml
          python -m pip install build==1.2.2.post1
          python -m build --outdir dist sdk-build

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: dist
          skip-existing: true

  mirror-quay:
    name: Mirror images to Quay.io
    needs: [image-channel, merge-image-levelrail, merge-image-levelrail-agent]
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && !inputs.dry_run && !cancelled() && needs.merge-image-levelrail.result == 'success' && needs.merge-image-levelrail-agent.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      HAS_QUAY: ${{ secrets.QUAY_USERNAME != '' && secrets.QUAY_PASSWORD != '' }}
      QUAY_NAMESPACE: ${{ vars.QUAY_NAMESPACE || 'levelrail' }}
      TAGS: ${{ needs.image-channel.outputs.tags }}
      PRIMARY_TAG: ${{ needs.image-channel.outputs.primary_tag }}
    steps:
      - name: Skip notice
        if: env.HAS_QUAY != 'true'
        run: echo "::notice::QUAY_USERNAME and QUAY_PASSWORD are not both set, skipping the Quay mirror"

      - name: Set up Buildx
        if: env.HAS_QUAY == 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Log in to GHCR
        if: env.HAS_QUAY == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Quay.io
        if: env.HAS_QUAY == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Install cosign
        if: env.HAS_QUAY == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Copies the pushed multi-arch index, so Quay gets the same digest and
      # the cosign signature covers it, as with the Docker Hub mirror.
      - name: Mirror images and sign
        if: env.HAS_QUAY == 'true'
        run: |
          set -euo pipefail
          for image in levelrail levelrail-agent; do
            src="ghcr.io/glincker/${image}:${PRIMARY_TAG}"
            tag_args=()
            for t in $TAGS; do
              tag_args+=(-t "quay.io/${QUAY_NAMESPACE}/${image}:${t}")
            done
            docker buildx imagetools create "${tag_args[@]}" "$src"
            digest="sha256:$(docker buildx imagetools inspect "$src" --raw | sha256sum | cut -d' ' -f1)"
            cosign sign --yes "quay.io/${QUAY_NAMESPACE}/${image}@${digest}"
          done

  publish-cloudsmith:
    name: Publish deb and rpm to Cloudsmith
    needs: [release, build-cli-binaries, build-agent-packages]
    # Stable tags only so apt and dnf users never get a prerelease by default.
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && !inputs.dry_run && vars.CLOUDSMITH_REPO != '' && !contains(github.event.inputs.tag || github.ref_name, '-')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HAS_CLOUDSMITH: ${{ secrets.CLOUDSMITH_API_KEY != '' }}
      CLOUDSMITH_REPO: ${{ vars.CLOUDSMITH_REPO }}
    steps:
      - name: Skip notice
        if: env.HAS_CLOUDSMITH != 'true'
        run: echo "::notice::CLOUDSMITH_API_KEY is not set, skipping the Cloudsmith upload"

      - name: Checkout
        if: env.HAS_CLOUDSMITH == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Go
        if: env.HAS_CLOUDSMITH == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        if: env.HAS_CLOUDSMITH == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Download CLI binaries
        if: env.HAS_CLOUDSMITH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-binary-linux-*
          path: cli-bin
          merge-multiple: true

      - name: Download agent packages
        if: env.HAS_CLOUDSMITH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: agent-package-*
          path: packages
          merge-multiple: true

      # The CLI packages are built here from the same binaries as the release.
      - name: Build CLI deb and rpm
        if: env.HAS_CLOUDSMITH == 'true'
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          NFPM="$(go env GOPATH)/bin/nfpm" scripts/release/build-cli-packages.sh "$RELEASE_TAG" cli-bin packages

      - name: Upload to Cloudsmith
        if: env.HAS_CLOUDSMITH == 'true'
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          set -euo pipefail
          python -m pip install cloudsmith-cli==1.32.0
          for f in packages/*.deb; do
            cloudsmith push deb "${CLOUDSMITH_REPO}/any-distro/any-version" "$f" --republish
          done
          for f in packages/*.rpm; do
            cloudsmith push rpm "${CLOUDSMITH_REPO}/any-distro/any-version" "$f" --republish
          done

  publish-helm-chart:
    name: Publish Helm chart to GHCR
    needs: release
    if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && !inputs.dry_run && vars.HELM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      ARTIFACTHUB_REPOSITORY_ID: ${{ vars.ARTIFACTHUB_REPOSITORY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The chart version is the release version; appVersion is the image tag.
      - name: Lint and package
        run: |
          set -euo pipefail
          helm lint deploy/helm/levelrail
          helm package deploy/helm/levelrail --version "${RELEASE_TAG#v}" --app-version "$RELEASE_TAG" --destination chart-out

      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "chart-out/levelrail-${RELEASE_TAG#v}.tgz" oci://ghcr.io/glincker/charts

      - name: Set up oras
        if: env.ARTIFACTHUB_REPOSITORY_ID != ''
        uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: 1.2.0

      # Artifact Hub reads this metadata artifact from the chart repository to
      # verify ownership; it is skipped until the repository id is set.
      - name: Push Artifact Hub metadata
        if: env.ARTIFACTHUB_REPOSITORY_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          envsubst < deploy/helm/artifacthub-repo.yml > artifacthub-repo.yml
          oras push ghcr.io/glincker/charts/levelrail:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
