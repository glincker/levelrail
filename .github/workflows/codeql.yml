name: codeql

# Path filtering moved to the trigger itself (paths/paths-ignore below)
# instead of a runtime dorny/paths-filter job: ci.yml already computes
# the identical backend/frontend split for every push/PR, so a second
# job re-deriving the same answer on a second runner was pure waste, not
# a real gate. Trigger-level filtering also means an irrelevant PR (e.g.
# workflow-only) never even queues a runner for the job below, rather
# than queuing one just to decide to skip. Workflow-file changes
# deliberately do NOT re-trigger a scan here (unlike ci.yml's own build/
# test jobs): CodeQL analyzes source, not YAML, so a workflow edit alone
# has nothing new for it to find.
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

jobs:
  # A path-scoped trigger can't distinguish "which language changed",
  # only "did anything relevant change", so both languages run whenever
  # this workflow runs at all (including the weekly schedule and manual
  # dispatch, which have no diff to scope in the first place).
  analyze-go:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  analyze-js:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
