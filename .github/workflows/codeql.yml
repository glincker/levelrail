name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

jobs:
  # Only meaningful for pull_request/push (a real diff to scope);
  # schedule/workflow_dispatch skip this and both languages run below.
  # Workflow-only changes deliberately don't force a rescan here (unlike
  # ci.yml): CodeQL analyzes source, not YAML.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'web/**'

  analyze-go:
    name: analyze (go)
    runs-on: ubuntu-latest
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.backend == 'true')
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  analyze-js:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    needs: changes
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.frontend == 'true')
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
