name: PR hygiene

# One job (one line in the PR checks list) instead of three: labels, size
# label, and the anti-slop description/commit check. Runs on
# pull_request_target so it can label fork PRs; it never checks out PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - uses: pascalgn/size-label-action@56b489b027932ec0cf60438a1a5f1a19c8fc71ff # v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The description and commit rules only need checking once, when the
      # PR opens, not on every push.
      # release-please bodies are generated changelogs, far over the length cap
      # and without the template sections, so the check closed every release PR.
      - if: github.event.action != 'synchronize' && !startsWith(github.head_ref, 'release-please--')
        uses: peakoss/anti-slop@57858eead489d08b255fab2af45a506c2ca6eab2 # v0.3.0
        with:
          max-failures: 4
          require-conventional-title: true
          require-description: true
          max-description-length: 2500
          max-emoji-count: 2
          max-code-references: 5
          require-linked-issue: false
          require-pr-template: true
          strict-pr-template-sections: "What changed,What this doesn't do,Test plan"
          max-commit-message-length: 500
          require-conventional-commits: true
          require-commit-author-match: true
          blocked-terms: |
            Generated with Claude Code
            🤖 Generated with Claude Code
            Co-Authored-By: Claude
            Claude-Session:
