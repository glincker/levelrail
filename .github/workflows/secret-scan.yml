name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # The free gitleaks binary, pinned. gitleaks/gitleaks-action needs a
      # paid license for organization repos, the CLI does not.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan the commits in this change
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in
            0000000000000000000000000000000000000000..*) RANGE="-1" ;;
          esac
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --redact --verbose --log-opts="$RANGE"
