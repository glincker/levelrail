name: Nightly full suite

# The thorough run ci.yml's PR/push lane skips (-race, no -short): the
# safety net for concurrency bugs and the flaky-under-load tests, without
# blocking every PR on it.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  full-test:
    name: Full test suite (race, no -short)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Same reasoning as ci.yml's identical step: the BuildKit-dependent
      # tests need the daemon on containerd-backed storage.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test (race detector, full suite)
        run: go test ./... -race -timeout=40m
