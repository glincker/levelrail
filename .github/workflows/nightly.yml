name: Nightly full suite

# The thorough run ci.yml's PR/push lane skips (no -short, shuffled): Monday
# to Saturday it runs the scoped cheap lanes, Sunday the full sweep with
# -race and the docker lane. Every lane records its outcome instead of
# failing the run, so a red lane can never put a red mark on a main commit;
# the summary job reports once and keeps one open issue. See docs/ci.md.
on:
  schedule:
    - cron: '0 4 * * 1-6'
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-activity:
    name: Scope to changed code
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      has-commits: ${{ steps.scope.outputs.has-commits }}
      matrix: ${{ steps.scope.outputs.matrix }}
      kit: ${{ steps.scope.outputs.kit }}
      install: ${{ steps.scope.outputs.install }}
      sweep: ${{ steps.scope.outputs.sweep }}
      full: ${{ steps.mode.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Pick daily or full sweep
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          full=false
          if [ "$EVENT" != schedule ] || [ "$CRON" = '0 4 * * 0' ]; then full=true; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

      # Daily runs diff against the commit of the last all-green run (its
      # nightly-green artifact), so a lane that failed is retried until it
      # passes. The full sweep and a missing marker run everything.
      - name: Pick lanes from changes since the last green run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ steps.mode.outputs.full }}
        run: |
          base=ALL
          if [ "$FULL" != true ]; then
            base="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=nightly-green&per_page=20" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.head_sha // "ALL"')"
          fi
          NIGHTLY_FULL="$FULL" NIGHTLY_LIVE_ALWAYS="$FULL" scripts/nightly-scope.sh "$base" | tee scope.out >> "$GITHUB_OUTPUT"
          if grep -q '^matrix=\[\]$' scope.out && grep -q '^kit=false$' scope.out && grep -q '^install=false$' scope.out && grep -q '^sweep=false$' scope.out; then
            echo "has-commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-commits=true" >> "$GITHUB_OUTPUT"
          fi

  # Same lanes as ci.yml plus -shuffle=on (order dependence) and no -short.
  # -race and the docker lane run in the Sunday sweep only; see
  # scripts/nightly-scope.sh. The test step records its outcome instead of
  # failing the job, so the run stays green and the summary job reports.
  full-test:
    name: Full test suite (${{ matrix.lane }})
    needs: check-activity
    if: needs.check-activity.outputs.matrix != '[]'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-activity.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Version and checksums locked by tools/go.mod and tools/go.sum.
      - name: Install gotestsum
        run: go -C tools install gotest.tools/gotestsum

      # Same reasoning as ci.yml's identical step: the BuildKit-dependent
      # tests need the daemon on containerd-backed storage.
      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Pre-pull live-test images (retry, tolerate upstream drift)
        if: matrix.lane == 'docker'
        run: scripts/prepull-test-images.sh

      - name: go test
        id: run
        continue-on-error: true
        timeout-minutes: 95
        env:
          GO_TEST_FLAGS: ${{ matrix.flags }}
          SHARD: ${{ matrix.shard }}
        run: |
          pkgs="$(scripts/go-test-groups.sh '${{ matrix.group }}')"
          mapfile -t packages <<<"$pkgs"
          scripts/ci-go-test.sh '${{ matrix.lane }}' "${packages[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.lane }}
          path: test-results/
          retention-days: 14
          overwrite: true

      - name: Record result
        if: always()
        env:
          RESULT_ID: full-${{ matrix.lane }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p status
          echo "$RESULT_ID $OUTCOME" > "status/$RESULT_ID.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: status-full-${{ matrix.lane }}
          path: status/
          retention-days: 7
          overwrite: true

  kit-full:
    name: Kit full suite
    needs: check-activity
    if: needs.check-activity.outputs.kit == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: go test (kit, race, shuffled)
        id: run
        continue-on-error: true
        run: go -C kit test -race -shuffle=on -timeout=10m ./...

      - name: Record result
        if: always()
        env:
          RESULT_ID: kit
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p status
          echo "$RESULT_ID $OUTCOME" > "status/$RESULT_ID.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: status-kit
          path: status/
          retention-days: 7
          overwrite: true

  # Known-vulnerability scan of the dependency graph (reachable symbols only).
  # Nightly, not per PR: new advisories land independent of any diff.
  vuln-scan:
    name: Go vulnerability scan
    needs: check-activity
    if: needs.check-activity.outputs.has-commits == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Fails on reachable findings that have a fixed version. Findings with
      # no upstream fix are listed in the log but do not turn the job red.
      - name: govulncheck
        id: run
        continue-on-error: true
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format=json ./... > govulncheck.json
          fixable="$(jq -s '[.[] | select(.finding) | .finding | select((.fixed_version // "") != "" and (.trace[0].function // "") != "") | .osv] | unique' govulncheck.json)"
          unfixable="$(jq -s '[.[] | select(.finding) | .finding | select((.fixed_version // "") == "" and (.trace[0].function // "") != "") | .osv] | unique' govulncheck.json)"
          echo "no fix available: $unfixable"
          echo "fixable: $fixable"
          [ "$(echo "$fixable" | jq length)" -eq 0 ]

      - name: Record result
        if: always()
        env:
          RESULT_ID: vuln
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p status
          echo "$RESULT_ID $OUTCOME" > "status/$RESULT_ID.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: status-vuln
          path: status/
          retention-days: 7
          overwrite: true

  # Repeats the packages with a flake history, shuffled, with no reruns, so
  # an intermittent failure shows up here before it shows up on a PR.
  # Non-blocking: its job is to file issues, not to go red.
  flake-sweep:
    name: Flake sweep (-count=3)
    needs: check-activity
    if: needs.check-activity.outputs.sweep == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 40
    env:
      FLAKE_SWEEP_PACKAGES: ./internal/agent/ ./internal/backup/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Version and checksums locked by tools/go.mod and tools/go.sum.
      - name: Install gotestsum
        run: go -C tools install gotest.tools/gotestsum

      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: go test (repeated, shuffled)
        env:
          GO_TEST_FLAGS: -shuffle=on -count=3 -p 1 -timeout=35m
          RERUNS: '0'
        run: |
          read -r -a packages <<<"$FLAKE_SWEEP_PACKAGES"
          scripts/ci-go-test.sh sweep "${packages[@]}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-sweep
          path: test-results/
          retention-days: 14
          overwrite: true

  quarantined:
    name: Quarantined tests (non-blocking)
    needs: check-activity
    if: needs.check-activity.outputs.has-commits == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      # Version and checksums locked by tools/go.mod and tools/go.sum.
      - name: Install gotestsum
        run: go -C tools install gotest.tools/gotestsum

      - name: Enable containerd image store for BuildKit's docker exporter
        run: |
          sudo mkdir -p /etc/docker
          echo '{"features":{"containerd-snapshotter":true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Quarantine list, entries past 14 days fail here
        run: scripts/check-flaky-tests.sh

      - name: go test (quarantined only)
        if: always()
        env:
          GO_TEST_FLAGS: -race -timeout=20m
          QUARANTINE: only
          RERUNS: '0'
        run: scripts/ci-go-test.sh quarantined ./...

  flake-report:
    name: File flaky-test issues
    needs: [check-activity, full-test, flake-sweep]
    if: always() && needs.check-activity.outputs.has-commits == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true

      - name: Open or update flaky-test issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(test-results/*/flaky.txt)
          [ "${#files[@]}" -gt 0 ] || exit 0
          scripts/report-flaky-tests.sh "${files[@]}"

  install-sh:
    name: install.sh (${{ matrix.image }})
    needs: check-activity
    if: needs.check-activity.outputs.install == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build control plane binary
        run: CGO_ENABLED=0 go build -o levelrail-linux-amd64 ./cmd/levelrail

      - name: Run install.sh in a systemd container
        id: run
        continue-on-error: true
        run: scripts/test-install-sh.sh '${{ matrix.image }}' ./levelrail-linux-amd64

      - name: Record result
        if: always()
        env:
          RESULT_ID: install-${{ strategy.job-index }}
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          mkdir -p status
          echo "$RESULT_ID $OUTCOME" > "status/$RESULT_ID.txt"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: status-install-${{ strategy.job-index }}
          path: status/
          retention-days: 7
          overwrite: true


  # One report for the whole run: a job summary table plus a single open
  # issue that is updated while red and closed when green. Only an all-green
  # run leaves the nightly-green marker the next daily scope diffs against.
  summary:
    name: Nightly summary
    needs: [check-activity, full-test, kit-full, vuln-scan, install-sh, flake-sweep, quarantined, flake-report]
    if: always() && needs.check-activity.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.check-activity.outputs.matrix }}
      KIT: ${{ needs.check-activity.outputs.kit }}
      INSTALL: ${{ needs.check-activity.outputs.install }}
      HAS_COMMITS: ${{ needs.check-activity.outputs.has-commits }}
      FULL: ${{ needs.check-activity.outputs.full }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download lane results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*'
          path: results
          merge-multiple: false

      - name: Build the report
        id: report
        run: |
          expected=()
          while read -r lane; do
            [ -n "$lane" ] && expected+=("full-$lane")
          done < <(echo "$MATRIX" | jq -r '.[].lane')
          [ "$KIT" = true ] && expected+=(kit)
          [ "$HAS_COMMITS" = true ] && expected+=(vuln)
          [ "$INSTALL" = true ] && expected+=(install-0 install-1)
          failed=0
          {
            mode='daily, scoped'
            [ "$FULL" = true ] && mode='full sweep'
            echo "## Nightly ($mode)"
            echo
            echo "| Lane | Result |"
            echo "| --- | --- |"
            for id in "${expected[@]}"; do
              f="results/status-$id/$id.txt"
              outcome="no result (job did not finish)"
              [ -f "$f" ] && outcome="$(cut -d' ' -f2- "$f")"
              echo "| \`$id\` | $outcome |"
              [ "$outcome" = success ] || failed=$((failed + 1))
            done
            echo
            echo "Advisory, never fails the nightly: flake sweep, quarantined tests."
            if [ "$failed" -gt 0 ]; then
              echo
              echo "### Failing tests"
              for d in results/test-results-*; do
                [ -s "$d/failed.txt" ] || continue
                echo "**${d#results/test-results-}**"
                head -n 20 "$d/failed.txt" | awk '{printf "- `%s` `%s`\n", $1, $2}'
              done
            fi
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the single nightly issue
        if: env.EVENT == 'schedule'
        env:
          FAILED: ${{ steps.report.outputs.failed }}
        run: |
          label="nightly-failure"
          gh label create "$label" --color b60205 --description "The scheduled nightly suite has a failing lane" 2>/dev/null || true
          num="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"
          if [ "$FAILED" -gt 0 ]; then
            { cat report.md; echo; echo "Run: $RUN_URL"; } > body.md
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file body.md
            else
              gh issue create --title "Nightly suite failing" --label "$label" --body-file body.md
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Nightly is green again: $RUN_URL"
          fi

      - name: Write the green marker
        if: steps.report.outputs.failed == '0'
        run: echo "$GITHUB_SHA" > nightly-green.txt

      - name: Upload green marker
        if: steps.report.outputs.failed == '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-green
          path: nightly-green.txt
          retention-days: 14
          overwrite: true
