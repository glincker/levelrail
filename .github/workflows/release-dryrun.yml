name: Release dry run

# Runs the exact release frontend build before the release PR merges, so a
# heap or tsc failure shows up on the PR instead of on the tag.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dryrun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Release web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        run: scripts/release/web-build.sh

      - name: Release asset verifier self test
        run: scripts/test-release-verify.sh
