name: commit-semver

# Report-only: compares each commit type with its diff. Flip SEMVER_ENFORCE
# and remove continue-on-error only after the owner approves enforcement.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-semver:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Check commit types against diffs
        env:
          SEMVER_ENFORCE: '0'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/check-commit-semver.test.mjs
          node scripts/check-commit-semver.mjs "$BASE_SHA" "$HEAD_SHA"
