name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed by this action's own GITHUB_TOKEN does not trigger
      # release.yml's "on: push: tags" event (GitHub blocks a token from
      # triggering further workflow runs, to prevent recursive loops).
      # An explicit workflow_dispatch call is exempt from that block, so
      # this is the documented way to chain the two workflows together.
      - name: Trigger release build
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"
