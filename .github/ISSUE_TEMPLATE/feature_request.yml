name: Feature request
description: Suggest an addition or change to Levelrail
title: "feat: "
labels: ["type/feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, check the [open issues](https://github.com/glincker/levelrail/issues) and the [roadmap](https://github.com/glincker/levelrail/blob/main/docs/roadmap.md) to confirm this is not already requested or planned. Questions belong in [Discussions](https://github.com/glincker/levelrail/discussions).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limit you hit. Start here, before the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: What Levelrail should do, as concretely as you can. Describe the behavior first and implementation details second.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fit less well.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant, such as links, prior art in other tools, or screenshots.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I am willing to open a pull request for this once the approach is agreed in this issue.
          required: false
