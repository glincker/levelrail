name: Set up Go with build cache
description: setup-go plus the day-keyed ~/.cache/go-build and ~/go/pkg/mod restore/save this repo's CI jobs all share.

inputs:
  cache-prefix:
    description: Cache key prefix, e.g. go-build or go-test-api.
    required: true
  save:
    description: Save a fresh cache on a miss (callers gate this to push events; a job that only restores, like install-sh, leaves it false).
    required: false
    default: 'false'

  remote-cache-bucket:
    description: S3-compatible bucket for a shared GOCACHEPROG build and test cache (gobuildcache). Empty keeps the actions/cache path below. Callers pass vars.GOCACHE_BUCKET.
    required: false
    default: ''
  remote-cache-region:
    description: Region for remote-cache-bucket.
    required: false
    default: 'us-east-1'
  remote-cache-key-id:
    description: Access key id for the bucket (secrets.GOCACHE_KEY_ID).
    required: false
    default: ''
  remote-cache-secret:
    description: Secret access key for the bucket (secrets.GOCACHE_SECRET).
    required: false
    default: ''
  remote-cache-endpoint:
    description: Optional S3 endpoint for R2, Tigris or MinIO.
    required: false
    default: ''

outputs:
  go-version:
    description: Resolved Go version, from setup-go.
    value: ${{ steps.go.outputs.go-version }}
  cache-hit:
    description: Exact match on the day-keyed cache.
    value: ${{ steps.cache.outputs.cache-hit || steps.cache-ro.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Go
      id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    # Content-addressed and shared by every job, branch, laptop and agent
    # worktree: a package whose inputs hash the same is a cache hit (build
    # and test result), which is the Go-native form of "affected only".
    - name: Remote Go cache (GOCACHEPROG)
      if: inputs.remote-cache-bucket != '' && inputs.remote-cache-key-id != ''
      shell: bash
      env:
        BUCKET: ${{ inputs.remote-cache-bucket }}
        REGION: ${{ inputs.remote-cache-region }}
        KEY_ID: ${{ inputs.remote-cache-key-id }}
        SECRET: ${{ inputs.remote-cache-secret }}
        ENDPOINT: ${{ inputs.remote-cache-endpoint }}
      run: |
        GOBIN="$RUNNER_TEMP/gocacheprog" go install github.com/richardartoul/gobuildcache@v1.4.0
        {
          echo "GOCACHEPROG=$RUNNER_TEMP/gocacheprog/gobuildcache"
          echo "GOBUILDCACHE_BACKEND_TYPE=s3"
          echo "GOBUILDCACHE_S3_BUCKET=$BUCKET"
          echo "GOBUILDCACHE_AWS_REGION=$REGION"
          echo "GOBUILDCACHE_AWS_ACCESS_KEY_ID=$KEY_ID"
          echo "GOBUILDCACHE_AWS_SECRET_ACCESS_KEY=$SECRET"
          echo "GOBUILDCACHE_S3_PREFIX=levelrail-go"
          [ -z "$ENDPOINT" ] || echo "GOBUILDCACHE_S3_ENDPOINT=$ENDPOINT"
        } >> "$GITHUB_ENV"

    - name: Cache key
      id: day
      shell: bash
      run: echo "day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

    # actions/cache saves in its post step, at the end of the job, so the
    # saved cache holds what the job actually compiled. A split restore
    # followed by an inline save ran before any go command and saved an
    # empty cache every day.
    - name: Go cache (restore and save at job end)
      id: cache
      if: inputs.save == 'true' && (inputs.remote-cache-bucket == '' || inputs.remote-cache-key-id == '')
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ steps.day.outputs.day }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
          ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.go.outputs.go-version }}-

    - name: Go cache (restore only)
      id: cache-ro
      if: inputs.save != 'true' && (inputs.remote-cache-bucket == '' || inputs.remote-cache-key-id == '')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-${{ steps.day.outputs.day }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'tools/go.sum') }}-
          ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
