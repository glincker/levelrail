version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # cel-go 0.29 breaks caddy v2.11.x (interpreter.NewCall signature).
      # Drop this once a caddy release supports it.
      - dependency-name: "github.com/google/cel-go"
        update-types: ["version-update:semver-minor"]
      # saml v0.6.x fails the SAML sign-in tests and sqlite storage v0.3.x needs a newer
      # theauth-go core than main pins. Bump them as their own reviewed changes.
      - dependency-name: "github.com/crewjam/saml"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "github.com/glincker/theauth-go/storage/sqlite"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      go-tools:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/kit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      go-kit:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "chore"
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["type/chore", "area/ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
