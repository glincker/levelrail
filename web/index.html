<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Flash-of-wrong-theme prevention. Runs synchronously, before the app
      bundle (a `type="module"` script, which is deferred by the spec)
      and before first paint, so a dark-preferring visitor never sees a
      light-mode flash while React boots. Mirrors the key and resolution
      rules in src/components/ThemeProvider.tsx exactly: 'levelrail-theme'
      in localStorage wins when present ('light' or 'dark'), otherwise
      falls back to the OS preference via matchMedia. ThemeProvider reads
      the class this script already applied as its initial state instead
      of re-deciding and potentially fighting it.

      External file (not inline) so a strict Content-Security-Policy needs
      no 'unsafe-inline' for script-src. No type="module"/async/defer: it
      must still block parsing and run in document order, before the app
      bundle, to avoid the flash it exists to prevent.
    -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deployment Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
