<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Flash-of-wrong-theme prevention. Runs synchronously, before the app
      bundle (a `type="module"` script, which is deferred by the spec)
      and before first paint, so a dark-preferring visitor never sees a
      light-mode flash while React boots. Mirrors the key and resolution
      rules in src/components/ThemeProvider.tsx exactly: 'levelrail-theme'
      in localStorage wins when present ('light' or 'dark'), otherwise
      falls back to the OS preference via matchMedia. ThemeProvider reads
      the class this script already applied as its initial state instead
      of re-deciding and potentially fighting it.

      External file (not inline) so a strict Content-Security-Policy needs
      no 'unsafe-inline' for script-src. No type="module"/async/defer: it
      must still block parsing and run in document order, before the app
      bundle, to avoid the flash it exists to prevent.
    -->
    <script src="/theme-init.js"></script>
    <!--
      ?v=N cache-busts these: public/ files are served byte-for-byte at a
      fixed path, no content hash, so a browser that cached an old favicon
      keeps showing it across deploys until this query string changes.
      Bump the relevant one whenever that file's actual content changes.
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="description" content="Self-hosted deployment platform" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dashboard" />
    <meta property="og:description" content="Self-hosted deployment platform" />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <title>Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
