- output: docs/assets/screenshots/app-analysis.png
  url: __BASE_URL__/apps/checkout-api/overview
  width: 1280
  height: 900
  wait: 4500
  javascript: "new Promise((done) => { let n = 0; const tick = () => { const h = [...document.querySelectorAll('h2,h3')].find(e => /analysis/i.test((e.textContent || '').trim()) && (e.textContent || '').length < 40); if (h) { h.scrollIntoView({block: 'start'}); window.scrollBy(0, -60); setTimeout(done, 800); } else if (n++ < 40) { setTimeout(tick, 250); } else { done(); } }; tick(); })"

