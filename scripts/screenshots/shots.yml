  url: __BASE_URL__/apps/marketing-site/overview
  width: 1280
  height: 800
  wait: 2000
  javascript: "new Promise(r => { document.dispatchEvent(new KeyboardEvent('keydown', {key: 'k', metaKey: true, bubbles: true})); let n = 0; const t = setInterval(() => { const i = [...document.querySelectorAll('input')].find(x => /search apps/i.test(x.placeholder)); if (i || ++n > 40) { clearInterval(t); if (i) { const set = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set; set.call(i, 'restart'); i.dispatchEvent(new Event('input', {bubbles: true})); } setTimeout(r, 1000); } }, 150); })"

# Not captured in this pass: settings/general, settings/plugins and databases/<db>/access
# never reach the load event in headless capture, so they time out. Re-add them
# once the slow external request on those pages is found.

