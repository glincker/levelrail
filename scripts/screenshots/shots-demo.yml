# shot-scraper multi-shot config for capture-demo.sh (see docs/screenshots.md).
#
# __BASE_URL__ and __CHROME_JS__ are substituted by capture-demo.sh. Output
# paths use the same names as shots.yml so the demo run is a drop-in refresh;
# __OUT_DIR__ is replaced with OUT_DIR. Only pages that render cleanly in demo
# mode are listed. Rejected: databases-list (renders the empty
# state), backups (never leaves its loading skeleton), status-page (a wall of warnings),
# /public/status (every component reads Unknown without a reconciler) and
# settings/account (access denied in the demo).

- output: __OUT_DIR__/dashboard-home.png
  url: __BASE_URL__/?board=start
  width: 1280
  height: 900
  wait: 4000
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/apps-list.png
  url: __BASE_URL__/apps/
  width: 1280
  height: 800
  wait: 2500
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/app-overview.png
  url: __BASE_URL__/apps/marketing-site/metrics
  width: 1280
  height: 900
  wait: 4000
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/deploy-history.png
  url: __BASE_URL__/apps/marketing-site/deploys
  width: 1280
  height: 800
  wait: 2500
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/deployments-all.png
  url: __BASE_URL__/deployments
  width: 1500
  height: 800
  wait: 2500
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/nodes.png
  url: __BASE_URL__/nodes/
  width: 1280
  height: 700
  wait: 2500
  javascript: "__CHROME_JS__; const n = [...document.querySelectorAll('h2,h3,th')].find(e => /^(Name|Nodes? )/.test(e.textContent || '')); if (n) n.scrollIntoView({block: 'start'});"

- output: __OUT_DIR__/alerts.png
  url: __BASE_URL__/alerts
  width: 1280
  height: 800
  wait: 2500
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/inbox.png
  url: __BASE_URL__/inbox
  width: 1280
  height: 800
  wait: 2500
  javascript: "__CHROME_JS__"

- output: __OUT_DIR__/app-releases.png
  url: __BASE_URL__/apps/marketing-site/overview
  width: 1280
  height: 900
  wait: 4500
  javascript: "__CHROME_JS__; new Promise((done) => { let n = 0; const tick = () => { const h = [...document.querySelectorAll('h2,h3')].find(e => /^releases$/i.test((e.textContent || '').trim())); if (h) { h.scrollIntoView({block: 'center'}); setTimeout(done, 800); } else if (n++ < 40) { setTimeout(tick, 250); } else { done(); } }; tick(); })"

- output: __OUT_DIR__/app-analysis.png
  url: __BASE_URL__/apps/marketing-site/overview
  width: 1280
  height: 900
  wait: 4500
  javascript: "__CHROME_JS__; new Promise((done) => { let n = 0; const tick = () => { const h = [...document.querySelectorAll('h2,h3')].find(e => /analysis/i.test((e.textContent || '').trim()) && (e.textContent || '').length < 40); if (h) { h.scrollIntoView({block: 'start'}); window.scrollBy(0, -60); setTimeout(done, 800); } else if (n++ < 40) { setTimeout(tick, 250); } else { done(); } }; tick(); })"

- output: __OUT_DIR__/status-page-public.png
  url: __BASE_URL__/public/status
  width: 1100
  height: 1100
  wait: 2500

- output: __OUT_DIR__/status-page-admin.png
  url: __BASE_URL__/settings/status-page
  width: 1280
  height: 1000
  wait: 3500
  javascript: "__CHROME_JS__"
