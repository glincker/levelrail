# shot-scraper multi-shot config for capture-demo.sh (see docs/screenshots.md).
#
# __BASE_URL__ and __CHROME_JS__ are substituted by capture-demo.sh. Output
# paths use the same names as shots.yml so the demo run is a drop-in refresh;
# __OUT_DIR__ is replaced with OUT_DIR. Only pages that render cleanly in demo
# mode are listed. Full page shots use 1440x900 so the right side panels
# (from about 1088px of content) and the 4 to 5 column grids show.
# Rejected: databases-list and the engine picker (empty in the demo), backups
# (never leaves its loading skeleton), status-page (a wall of warnings),
# settings/account (access denied in the demo) and add-node-dialog (the demo
# blocks the Add node write and shows a read-only toast instead of the dialog).
# status-page-public: the Vite dev server has no /public/status route (404);
# only the demo backend serves it, and components read Unknown there.

- output: __OUT_DIR__/dashboard-home.png
  url: __BASE_URL__/?board=start
  width: 1440
  height: 900
  wait: 4000
  javascript: "__CHROME_JS__"

