<svg xmlns="http://www.w3.org/2000/svg" class="ht__svg" viewBox="0 0 1057 858"><title>Levelrail: edge, control plane and nodes</title><style>.ht__svg{--teal:#00cbaa;--live:#eef35f;--ink:#a1a1aa;--lk:#b6abff;--wl-mix:40%;--r1:#58b1ce;--r2:#107292;--r3:#084f67;--sh:#06232c;--hb-top:#dff1f8;--hb-l:#9fcee0;--hb-r:#5f9db6;--hb-sh:rgba(3,22,29,.32)}
.ht-nodes{--tier:var(--r3)}.ht-ctl{--tier:var(--r2)}.ht-edge{--tier:var(--r1)}
.ht-tier{--wl:color-mix(in srgb,var(--sh),var(--tier) 40%);--wr:color-mix(in srgb,var(--sh),var(--tier) 12%)}
.top{fill:var(--tier)}.rim{fill:none;stroke:rgba(255,255,255,.34);stroke-width:1}
.w0{--c:var(--wr)}.w1{--c:color-mix(in srgb,var(--wr),var(--wl) 14%)}.w2{--c:color-mix(in srgb,var(--wr),var(--wl) 28%)}.w3{--c:color-mix(in srgb,var(--wr),var(--wl) 43%)}.w4{--c:color-mix(in srgb,var(--wr),var(--wl) 57%)}.w5{--c:color-mix(in srgb,var(--wr),var(--wl) 72%)}.w6{--c:color-mix(in srgb,var(--wr),var(--wl) 86%)}.w7{--c:var(--wl)}.w{fill:var(--c)}
.bsh{fill:var(--hb-sh)}.bt{fill:var(--hb-top)}.bl{fill:var(--hb-l)}.br{fill:var(--hb-r)}
.gh,.gs{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.gh{stroke:rgba(3,30,40,.8);stroke-width:3.6}.gs{stroke:#fff;stroke-width:1.5}
.ring{fill:none;stroke:var(--teal)}.ring-a{stroke-width:1.4;stroke-dasharray:3 6;stroke-opacity:.95}.ring-b{stroke-width:1;stroke-opacity:.55}
.mesh{fill:none;stroke:var(--teal);stroke-width:1.3;stroke-dasharray:3 6;stroke-linejoin:round}
.guide{fill:none;stroke:var(--teal);stroke-width:1;stroke-dasharray:2 5;stroke-opacity:.8}
.tl{fill:color-mix(in srgb,var(--live) 66%,#000)}.tr{fill:color-mix(in srgb,var(--live) 40%,#000)}.tt{fill:var(--live);stroke:rgba(3,22,29,.5);stroke-width:.6}
.tokbody{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--live) 60%,transparent))}
.lead{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:1}.leadd{fill:var(--ink);fill-opacity:.7}
