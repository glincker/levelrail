// Wire contract between the control plane and an out-of-process plugin (ADR 034).
// The plugin serves this over a unix socket mounted into its container; the
// control plane is always the client. Contract version 1.
syntax = "proto3";

package levelrail.plugin.v1;

option go_package = "github.com/GLINCKER/levelrail/internal/plugin/pluginpb;pluginpb";

import "google/protobuf/timestamp.proto";

// PluginService is served by every plugin whatever kinds it implements.
service PluginService {
  // Describe is the first call. The host offers the contract versions it
  // speaks; the plugin answers with the one it will use or an error.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

// NotificationChannelService is served by plugins whose kind is notification_channel.
service NotificationChannelService {
  rpc Send(SendRequest) returns (SendResponse);
}

// PanelService is served by plugins that contribute panels or commands.
// The host calls it only for sources and actions the manifest declares and
// only with the abilities the operator approved.
service PanelService {
  rpc PanelData(PanelDataRequest) returns (PanelDataResponse);
  rpc PanelAction(PanelActionRequest) returns (PanelActionResponse);
}

// DnsProviderService is served by plugins whose kind is dns_provider. Every
// request carries the credential for that one call in secret, which the
// plugin must not persist or log.
service DnsProviderService {
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  rpc UpsertRecord(UpsertRecordRequest) returns (UpsertRecordResponse);
  rpc DeleteRecord(DeleteRecordRequest) returns (DeleteRecordResponse);
  rpc VerifyRecord(VerifyRecordRequest) returns (VerifyRecordResponse);
}

message DnsRecord {
  // Name relative to the zone, "@" for the apex.
  string name = 1;
  string type = 2;
  string value = 3;
  uint32 ttl_seconds = 4;
  bool proxied = 5;
}

message DnsOutcome {
  bool ok = 1;
  string detail = 2;
  bool retryable = 3;
}

message ListZonesRequest {
  string config_json = 1;
  string secret = 2;
}

message ListZonesResponse {
  DnsOutcome outcome = 1;
  repeated string zones = 2;
}

message ListRecordsRequest {
  string zone = 1;
  string config_json = 2;
  string secret = 3;
}

message ListRecordsResponse {
  DnsOutcome outcome = 1;
  repeated DnsRecord records = 2;
}

message UpsertRecordRequest {
  string zone = 1;
  DnsRecord record = 2;
  string config_json = 3;
  string secret = 4;
}

message UpsertRecordResponse {
  DnsOutcome outcome = 1;
}

message DeleteRecordRequest {
  string zone = 1;
  DnsRecord record = 2;
  string config_json = 3;
  string secret = 4;
}

message DeleteRecordResponse {
  DnsOutcome outcome = 1;
}

message VerifyRecordRequest {
  string zone = 1;
  DnsRecord record = 2;
  string config_json = 3;
  string secret = 4;
}

message VerifyRecordResponse {
  DnsOutcome outcome = 1;
  // True when the provider now serves exactly the requested record.
  bool present = 2;
}

message DescribeRequest {
  repeated uint32 host_contract_versions = 1;
}

message DescribeResponse {
  uint32 contract_version = 1;
  string name = 2;
  string version = 3;
  // Extension kind, for example "notification_channel".
  string kind = 4;
  // Abilities the plugin asks for, in the platform ability vocabulary.
  repeated string requested_abilities = 5;
  // JSON Schema (as text) for the plugin's own non-secret config.
  string config_schema = 6;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string detail = 2;
}

message Event {
  string id = 1;
  string title = 2;
  string body = 3;
  // "firing" or "resolved".
  string status = 4;
  string severity = 5;
  string resource_id = 6;
  string link = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

message SendRequest {
  Event event = 1;
  // The plugin's own non-secret config (JSON), stored at install.
  string config_json = 2;
  // The credential for this one call (for example a token or webhook URL).
  // It must not be persisted or logged by the plugin.
  string secret = 3;
}

message SendResponse {
  bool delivered = 1;
  string detail = 2;
  bool retryable = 3;
}

message PanelDataRequest {
  string panel_id = 1;
  string source_id = 2;
  // Scope the panel is shown in, for example {"app_id": "web"}.
  map<string, string> context = 3;
  string config_json = 4;
}

message PanelDataResponse {
  // A JSON document the host binds widgets to. The host caps its size.
  string json = 1;
}

message PanelActionRequest {
  string panel_id = 1;
  string action_id = 2;
  map<string, string> context = 3;
  string config_json = 4;
}

message PanelActionResponse {
  bool ok = 1;
  string message = 2;
}
