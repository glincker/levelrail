sonar.organization=glincker
sonar.projectKey=glincker_levelrail
sonar.projectName=levelrail
sonar.sourceEncoding=UTF-8

# Go and web live side by side; test files are carved out by inclusion.
sonar.sources=cmd,internal,kit,web/src,tools
sonar.tests=cmd,internal,kit,web/src,test
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,test/**
sonar.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,internal/store/migrations/**,test/fixtures/**,internal/functions/starters/**,web/src/routeTree.gen.ts,internal/api/openapi_gen.go,**/*.gen.ts,**/*.gen.go,**/*.pb.go,**/vendor/**,**/node_modules/**,**/testdata/**,docs/**,scripts/**,web/public/**,**/*.svg,**/*.png

sonar.coverage.exclusions=internal/store/migrations/**,test/**,internal/functions/starters/**,web/src/routeTree.gen.ts,internal/api/openapi_gen.go,**/*.gen.ts,**/*.gen.go,**/*.pb.go,cmd/**
sonar.cpd.exclusions=internal/store/migrations/**,internal/functions/starters/**,**/*.gen.ts,**/*.gen.go,**/*.pb.go

# coverage.out comes from `go test -short ./internal/...`, absent on release branches.
sonar.go.coverage.reportPaths=coverage.out
