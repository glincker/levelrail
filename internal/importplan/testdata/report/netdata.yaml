services:
  netdata:
    image: netdata/netdata:v1.45.0
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdatalib:/var/lib/netdata
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  netdatalib:
