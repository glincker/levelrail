# Verified publishers: image namespaces a maintainer confirmed are published
# by the upstream project. Each entry needs evidence pinned to a commit, a
# reviewer and an expiry within 400 days of review. Personal accounts also need
# a repos list. An expired entry stops validating, and a test fails until it is
# renewed. Expiries are staggered so renewals do not land on one day.
