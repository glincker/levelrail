services:
  grav:
    image: lscr.io/linuxserver/grav:2.2.21-ls293
    ports: ["80"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
