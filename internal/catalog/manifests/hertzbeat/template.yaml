id: hertzbeat
name: HertzBeat
description: "A real time monitoring system with agentless collection, alerts and a web console, on the embedded database with a data volume. Change the default login after the first sign in."
icon: heartbeat
category: Monitoring
documentation_url: https://hertzbeat.apache.org/docs/
source_repo: https://github.com/apache/hertzbeat
license: Apache-2.0
license_class: permissive
license_url: https://github.com/apache/hertzbeat/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 1073741824
first_run:
  - Sign in as admin with the password hertzbeat and change it right away, because it is public knowledge.
domains:
  - service: hertzbeat
    port: 1157
    description: Public address of the web page.
healthcheck:
  service: hertzbeat
  port: 1157
  path: /
