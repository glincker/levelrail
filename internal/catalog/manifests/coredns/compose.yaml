services:
  coredns:
    image: coredns/coredns:1.15.0
    ports: ["8080", "1053"]
    command: ["-conf", "/etc/coredns/Corefile"]
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /health
      port: 8080
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
