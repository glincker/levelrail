id: upsnap
name: UpSnap
description: Web dashboard to wake, shut down and ping devices on your network, with scheduled wake ups and per device ports.
icon: power
category: Networking
documentation_url: https://github.com/seriousm4x/UpSnap/wiki
source_repo: https://github.com/seriousm4x/UpSnap
license: MIT
license_class: permissive
license_url: https://github.com/seriousm4x/UpSnap/blob/HEAD/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Open the address and create the first admin account. Wake on LAN needs the container on the same network as the devices, so check reachability from a test device.
domains:
  - service: upsnap
    port: 8090
    description: Public address of the dashboard.
healthcheck:
  service: upsnap
  port: 8090
  path: /
