id: authelia
name: Authelia
description: "Single sign-on and two-factor portal. The admin user is created at first boot from a generated password (visible in the service environment settings, never on a process command line); more users go in /data/users.yml. Sessions are scoped to this portal's own host, so widen the cookie domain in /config/configuration.yml before protecting other apps. One-time codes are written to /data/notification.txt."
icon: shield-check
category: Security
documentation_url: https://www.authelia.com/configuration/prologue/introduction/
recommended_memory_bytes: 268435456
domains:
  - service: authelia
    port: 9091
    description: Public address of the Authelia portal.
healthcheck:
  service: authelia
  port: 9091
  path: /api/health
