id: blackbox-exporter
name: Blackbox Exporter
description: A Prometheus exporter that probes endpoints over HTTP, HTTPS, DNS, TCP and ICMP and reports the results as metrics. It ships with the standard probe modules.
icon: radar
category: Monitoring
documentation_url: https://github.com/prometheus/blackbox_exporter
source_repo: https://github.com/prometheus/blackbox_exporter
license: Apache-2.0
license_class: permissive
license_url: https://github.com/prometheus/blackbox_exporter/blob/master/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 67108864
first_run:
  - Probe a target with /probe?target=https://example.org&module=http_2xx and scrape it from Prometheus.
domains:
  - service: blackbox
    port: 9115
    description: Public address of the Blackbox Exporter web interface.
healthcheck:
  service: blackbox
  port: 9115
  path: /-/healthy
