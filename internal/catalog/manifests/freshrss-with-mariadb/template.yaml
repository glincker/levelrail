id: freshrss-with-mariadb
name: Freshrss With Mariadb
description: A free, self-hostable feed aggregator.
icon: check-square
category: Productivity
documentation_url: https://freshrss.org/index.html
recommended_memory_bytes: 536870912
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/freshrss-with-mariadb.yaml
images:
  - service: freshrss
    image: freshrss/freshrss:latest
  - service: freshrss-db
    image: mariadb:11
env:
  - key: MARIADB_USER
    label: Mariadb User
    description: Generated when the app is installed.
    generate: user
  - key: MARIADB_PASSWORD
    label: Mariadb Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: ROOT_PASSWORD
    label: Root Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: freshrss
    port: 80
    description: Public address of freshrss.
healthcheck:
  service: freshrss
  port: 80
  path: /
