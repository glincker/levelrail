id: consul
name: Consul
description: "HashiCorp Consul in single-server mode with the web UI: service discovery, health checks and a key-value store."
icon: hard-drives
category: Infrastructure
documentation_url: https://developer.hashicorp.com/consul/docs
source_repo: https://github.com/hashicorp/consul
license: BUSL-1.1
license_class: source-available
license_url: https://github.com/hashicorp/consul/blob/main/LICENSE
recommended_memory_bytes: 268435456
domains:
  - service: consul
    port: 8500
    description: Public address of the Consul UI and HTTP API. It has no ACLs, so restrict access.
healthcheck:
  service: consul
  port: 8500
  path: /v1/status/leader
