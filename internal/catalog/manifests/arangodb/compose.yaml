services:
  arangodb:
    image: arangodb:3.12.13
    ports: ["8529"]
    environment:
      ARANGO_ROOT_PASSWORD: $SERVICE_PASSWORD_ARANGO
    volumes:
      - arango_data:/var/lib/arangodb3
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8529/_api/version || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
