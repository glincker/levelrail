id: nsq
name: NSQ
description: "A realtime distributed message queue with a lookup daemon, a queue daemon and the nsqadmin web page, run together. Producers and consumers in this project connect to nsqd:4150 and nsqd:4151."
icon: server
category: Infrastructure
documentation_url: https://nsq.io/overview/design.html
source_repo: https://github.com/nsqio/nsq
license: MIT
license_class: permissive
license_url: https://github.com/nsqio/nsq/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Open nsqadmin to watch topics and channels, then publish to nsqd:4151 from a service in this project.
domains:
  - service: nsqadmin
    port: 4171
    description: Public address of the web page.
healthcheck:
  service: nsqadmin
  port: 4171
  path: /
