services:
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.1
    ports: ["8080"]
    environment:
      URL: https://petstore3.swagger.io/api/v3/openapi.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
