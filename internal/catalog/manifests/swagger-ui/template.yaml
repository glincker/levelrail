id: swagger-ui
name: Swagger UI
description: Renders an OpenAPI description as interactive API documentation you can try from the browser. It is static, has no login and no database.
icon: book
category: Developer Tools
documentation_url: https://github.com/swagger-api/swagger-ui
source_repo: https://github.com/swagger-api/swagger-ui
license: Apache-2.0
license_class: permissive
license_url: https://github.com/swagger-api/swagger-ui/blob/master/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 67108864
domains:
  - service: swagger-ui
    port: 8080
    description: Public address of Swagger UI.
healthcheck:
  service: swagger-ui
  port: 8080
  path: /
