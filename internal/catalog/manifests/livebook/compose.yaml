services:
  livebook:
    image: ghcr.io/livebook-dev/livebook:0.19.10
    ports: ["8080"]
    environment:
      LIVEBOOK_PASSWORD: ${LIVEBOOK_PASSWORD}
      LIVEBOOK_IP: 0.0.0.0
    volumes:
      - data:/data
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /public/health
      port: 8080
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
