# Converted from an upstream template catalog (see source in template.yaml).
services:
  plunk:
    image: driaug/plunk:latest
    entrypoint:
      - /app/entry.sh
    ports:
      - "3000"
    environment:
      API_URI: ${SERVICE_URL_PLUNK}/api
      APP_URI: ${SERVICE_URL_PLUNK}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_REGION: ${AWS_REGION}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql/plunk-db?schema=public
      DISABLE_SIGNUPS: "False"
      JWT_SECRET: ${JWTSECRET_PASSWORD}
      NEXT_PUBLIC_API_URI: ${SERVICE_URL_PLUNK}/api
      NODE_OPTIONS: --no-network-family-autoselection
      REDIS_URL: redis://redis:6379
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      interval: 2s
      retries: 15
      test:
        - CMD-SHELL
        - (wget -S --spider http://127.0.0.1:3000/api/health 2>&1 | grep -q "HTTP/1.1 [1-3]")
      timeout: 10s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plunk-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - plunk-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
  redis:
    image: redis:7.4-alpine
    volumes:
      - plunk-redis-data:/data
    healthcheck:
      interval: 5s
      retries: 20
      test:
        - CMD
        - redis-cli
        - PING
      timeout: 10s
