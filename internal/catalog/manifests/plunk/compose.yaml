services:
  plunk:
    image: driaug/plunk:1.3.6
    ports: ["3000"]
    entrypoint: ["/app/entry.sh"]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://plunk:${DB_PASSWORD}@db:5432/plunk?schema=public
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET}
      NEXT_PUBLIC_API_URI: ${SERVICE_FQDN_PLUNK:-http://localhost:3000}/api
      APP_URI: ${SERVICE_FQDN_PLUNK:-http://localhost:3000}
      API_URI: ${SERVICE_FQDN_PLUNK:-http://localhost:3000}/api
      DISABLE_SIGNUPS: "False"
      NODE_OPTIONS: --no-network-family-autoselection
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/api/health || wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: plunk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plunk -d plunk"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
