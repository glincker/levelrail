services:
  kapowarr:
    image: mrcas/kapowarr:v1.3.2
    ports: ["5656"]
    volumes:
      - db:/app/db
      - downloads:/app/temp_downloads
      - comics:/comics-1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5656')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
