services:
  pgweb:
    image: sosedoff/pgweb:0.17.0
    ports: ["8081"]
    environment:
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
