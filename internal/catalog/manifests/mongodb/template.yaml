id: mongodb
name: MongoDB
description: The MongoDB document database on the official image, with a persistent volume and a generated root user and password. It is not published on the host, so reach it from other services in this project at mongodb:27017.
icon: database
category: Database Tools
documentation_url: https://www.mongodb.com/docs/manual/
source_repo: https://github.com/mongodb/mongo
license: LicenseRef-SSPL-1.0
license_class: source-available
license_url: https://github.com/mongodb/mongo/blob/master/LICENSE-Community.txt
hosted_use: restricted
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
first_run:
  - Read the generated root user and password from the app secrets, then connect from a service in the same project with mongodb://USER:PASSWORD@mongodb:27017/?authSource=admin.
domains:
  - service: mongodb
    port: 27017
    description: This is a TCP database with no web page, so leave it empty and connect over the project network.
healthcheck:
  service: mongodb
  port: 27017
  kind: tcp
