services:
  voidauth:
    image: voidauth/voidauth:1.19.1
    ports: ["3000"]
    environment:
      APP_URL: ${SERVICE_URL_VOIDAUTH:-http://localhost:3000}
      DB_ADAPTER: postgres
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_KEY: ${STORAGE_KEY}
    volumes:
      - config:/app/config
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || curl -fsS -o /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
