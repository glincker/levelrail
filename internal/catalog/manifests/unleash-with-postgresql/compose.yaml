# Converted from an upstream template catalog (see source in template.yaml).
services:
  postgres:
    image: postgres:15
    environment:
      GENERATED_POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 2s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - '''pg_isready'' "--username=$GENERATED_POSTGRES_USER" ''--host=127.0.0.1'' ''--port=5432'' ''--dbname=db'''
      timeout: 1m
  unleash:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242"
    environment:
      DATABASE_SSL: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/db
      INIT_CLIENT_API_TOKENS: default:development.unleash-insecure-api-token
      INIT_FRONTEND_API_TOKENS: default:default:development.unleash-insecure-frontend-api-token
      LOG_LEVEL: warn
      UNLEASH_DEFAULT_ADMIN_PASSWORD: ${UNLEASH_PASSWORD}
      UNLEASH_URL: ${SERVICE_URL_UNLEASH}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 1s
      retries: 5
      start_period: 15s
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit 1
      timeout: 1m
