id: metamcp
name: Metamcp
description: MCP Aggregator, Orchestrator, Middleware, Gateway in one app
icon: code
category: Developer Tools
documentation_url: https://github.com/metatool-ai/metamcp
recommended_memory_bytes: 536870912
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/metamcp.yaml
images:
  - service: app
    image: ghcr.io/metatool-ai/metamcp:2.4
  - service: postgres
    image: postgres:16-alpine
env:
  - key: POSTGRES_USER
    label: Postgres User
    description: Generated when the app is installed.
    generate: user
  - key: POSTGRES_PASSWORD
    label: Postgres Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: AUTH_PASSWORD
    label: Auth Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: app
    port: 12008
    description: Public address of app.
healthcheck:
  service: app
  port: 12008
  path: /
