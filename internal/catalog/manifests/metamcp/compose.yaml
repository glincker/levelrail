services:
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:2.4
    ports: ["12008"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metamcp
      DATABASE_URL: postgresql://metamcp:${DB_PASSWORD}@db:5432/metamcp
      APP_URL: ${SERVICE_FQDN_METAMCP:-http://localhost:12008}
      NEXT_PUBLIC_APP_URL: ${SERVICE_FQDN_METAMCP:-http://localhost:12008}
      BETTER_AUTH_SECRET: ${AUTH_SECRET}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:12008/health || wget -q -O /dev/null http://127.0.0.1:12008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metamcp
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metamcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metamcp -d metamcp"]
      interval: 5s
      timeout: 5s
      retries: 10
