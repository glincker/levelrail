# Converted from an upstream template catalog (see source in template.yaml).
services:
  app:
    image: ghcr.io/metatool-ai/metamcp:2.4
    ports:
      - "12008"
    environment:
      APP_URL: ${SERVICE_URL_APP}
      BETTER_AUTH_SECRET: ${AUTH_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/metamcp_db
      NEXT_PUBLIC_APP_URL: ${SERVICE_URL_APP}
      POSTGRES_DB: metamcp_db
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 10s
      retries: 5
      test:
        - CMD
        - curl
        - -f
        - http://localhost:12008/health
      timeout: 5s
  postgres:
    image: postgres:16-alpine
    environment:
      GENERATED_POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: metamcp_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      interval: 10s
      retries: 5
      test:
        - CMD-SHELL
        - pg_isready -U $GENERATED_POSTGRES_USER -d metamcp_db
      timeout: 5s
