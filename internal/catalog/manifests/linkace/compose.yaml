services:
  linkace:
    image: linkace/linkace:v2.6.3
    ports: ["80"]
    # SQLite needs the file to exist before the setup wizard runs.
    command: ["sh", "-c", "touch /app/storage/app/linkace.sqlite && exec /usr/bin/supervisord -c /etc/supervisor.d/supervisord.ini"]
    environment:
      APP_KEY: base64:$SERVICE_BASE64BYTES_32_APPKEY
      APP_URL: ${SERVICE_URL_LINKACE:-http://localhost}
      TRUSTED_PROXIES: "*"
      # The proxy routes by Host; without this, LinkAce answers 400 to the
      # local health probe and to any host that differs from APP_URL.
      TRUSTED_HOSTS: ".*"
      APP_TIMEZONE: ${TZ}
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/storage/app/linkace.sqlite
      LOG_CHANNEL: stderr
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s
