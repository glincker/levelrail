id: slskd
name: slskd
description: A modern web client and server for the Soulseek peer to peer network, with a REST API.
icon: share-network
category: Media
documentation_url: https://github.com/slskd/slskd
source_repo: https://github.com/slskd/slskd
license: AGPL-3.0-only
license_class: network-copyleft
license_url: https://github.com/slskd/slskd/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Sign in as admin with the generated web password.
env:
  - key: SLSK_USERNAME
    label: Soulseek username
    description: Your account name on the Soulseek network.
    required: true
  - key: SLSK_PASSWORD
    label: Soulseek password
    description: Your password on the Soulseek network.
    required: true
    secret: true
  - key: ADMIN_PASSWORD
    label: Web password
    description: Password for the admin user of the web interface.
    generate: password
    length: 24
    secret: true
domains:
  - service: slskd
    port: 5030
    description: Public address of slskd.
healthcheck:
  service: slskd
  port: 5030
  path: /health
