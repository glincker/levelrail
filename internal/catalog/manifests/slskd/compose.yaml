services:
  slskd:
    image: slskd/slskd:0.26.2
    ports: ["5030"]
    environment:
      SLSKD_USERNAME: "admin"
      SLSKD_PASSWORD: ${ADMIN_PASSWORD}
      SLSKD_SLSK_USERNAME: ${SLSK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSK_PASSWORD}
      SLSKD_REMOTE_CONFIGURATION: "true"
    volumes:
      - app:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5030/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
