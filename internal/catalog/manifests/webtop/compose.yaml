services:
  webtop:
    image: lscr.io/linuxserver/webtop:0c46c80a-ls325
    ports: ["3000"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      CUSTOM_USER: "admin"
      PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
