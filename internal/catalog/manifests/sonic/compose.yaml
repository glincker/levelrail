services:
  sonic:
    image: valeriansaliou/sonic:v1.10.2
    ports: ["1491"]
    command: ["sonic", "-c", "/etc/sonic.cfg"]
    volumes:
      - store:/var/lib/sonic/store
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: tcp
      port: 1491
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
