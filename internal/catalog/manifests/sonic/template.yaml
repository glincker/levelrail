id: sonic
name: Sonic
description: Fast, lightweight schema less search index server that stores identifiers instead of documents. The install form carries config.cfg as an editable file and a generated channel password.
icon: magnifying-glass
category: Database Tools
documentation_url: https://github.com/valeriansaliou/sonic#how-to-use-it
source_repo: https://github.com/valeriansaliou/sonic
license: MPL-2.0
license_class: copyleft
license_url: https://github.com/valeriansaliou/sonic/blob/HEAD/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Connect a Sonic client library to port 1491 with the generated channel password shown in the deployment variables.
env:
  - key: SONIC_PASSWORD
    label: Channel password
    description: Password clients send when they open a Sonic channel.
    generate: password
    length: 24
    secret: true
  - key: SONIC_CONFIG
    type: file
    service: sonic
    path: /etc/sonic.cfg
    mode: "0444"
    label: config.cfg
    description: The full Sonic configuration, mounted read-only.
    secret: true
    default: |
      [server]
      log_level = "error"

      [channel]
      inet = "0.0.0.0:1491"
      tcp_timeout = 300
      auth_password = "${SONIC_PASSWORD}"

      [channel.search]
      query_limit_default = 10
      query_limit_maximum = 100
      query_alternates_try = 4
      suggest_limit_default = 5
      suggest_limit_maximum = 20
      list_limit_default = 100
      list_limit_maximum = 500

      [store]

      [store.kv]
      path = "/var/lib/sonic/store/kv/"
      retain_word_objects = 1000

      [store.kv.pool]
      inactive_after = 1800

      [store.kv.database]
      flush_after = 900
      compress = true
      parallelism = 2
      max_files = 100
      max_compactions = 1
      max_flushes = 1
      write_buffer = 16384
      write_ahead_log = true

      [store.fst]
      path = "/var/lib/sonic/store/fst/"

      [store.fst.pool]
      inactive_after = 300

      [store.fst.graph]
      consolidate_after = 180
      max_size = 2048
      max_words = 250000
domains:
  - service: sonic
    port: 1491
    description: Public address of the search channel. Keep it private.
healthcheck:
  service: sonic
  port: 1491
  kind: tcp
  reason: speaks the Sonic channel protocol, not HTTP
