id: openresty
name: OpenResty
description: "The OpenResty web platform, Nginx with LuaJIT, on the Alpine image with a persistent web root. It serves the default page until you add content or configuration."
icon: globe
category: Infrastructure
documentation_url: https://openresty.org/en/
source_repo: https://github.com/openresty/openresty
license: BSD-2-Clause
license_class: permissive
license_url: https://github.com/openresty/openresty/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Open the public address to see the default page, then add content to the web root volume.
domains:
  - service: openresty
    port: 80
    description: Public address of the web page.
healthcheck:
  service: openresty
  port: 80
  path: /
