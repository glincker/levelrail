services:
  openresty:
    image: openresty/openresty:1.27.1.2-13-alpine-fat
    ports: ["80"]
    volumes:
      - openresty_html:/usr/local/openresty/nginx/html
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
