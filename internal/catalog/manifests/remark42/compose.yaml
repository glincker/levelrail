services:
  remark42:
    image: umputun/remark42:v1.18.0
    ports: ["8080"]
    environment:
      REMARK_URL: ${SERVICE_URL_REMARK42:-http://localhost:8080}
      SECRET: $SERVICE_PASSWORD_64_REMARK42
      SITE: main
      AUTH_ANON: "true"
      STORE_BOLT_PATH: /srv/var/db
      BACKUP_PATH: /srv/var/backup
    volumes:
      - data:/srv/var
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
