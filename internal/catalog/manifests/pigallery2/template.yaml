id: pigallery2
name: PiGallery2
description: A directory-first photo gallery that shows your folders as they are on disk, with search, maps and thumbnails. Photos are read from a volume, so you copy them in or mount a folder.
icon: images
category: Media
documentation_url: https://bpatrik.github.io/pigallery2/
source_repo: https://github.com/bpatrik/pigallery2
license: MIT
license_class: permissive
license_url: https://github.com/bpatrik/pigallery2/blob/master/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
first_run:
  - Open the address, create the admin account, then add photos to the images volume and rescan from the settings.
domains:
  - service: pigallery2
    port: 80
    description: Public address of the gallery.
healthcheck:
  service: pigallery2
  port: 80
  path: /
