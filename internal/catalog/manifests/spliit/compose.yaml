services:
  spliit:
    image: ghcr.io/spliit-app/spliit:1.30.0
    ports: ["3000"]
    environment:
      POSTGRES_PRISMA_URL: postgresql://spliit:${DB_PASSWORD}@db:5432/spliit
      POSTGRES_URL_NON_POOLING: postgresql://spliit:${DB_PASSWORD}@db:5432/spliit
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spliit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spliit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spliit -d spliit"]
      interval: 5s
      timeout: 5s
      retries: 10
