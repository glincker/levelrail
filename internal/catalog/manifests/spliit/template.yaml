id: spliit
name: Spliit
description: A free way to split expenses with friends and groups, no accounts needed. Share a group link and everyone adds expenses. MIT licensed, backed by Postgres.
icon: wallet
category: Finance
documentation_url: https://github.com/spliit-app/spliit
recommended_memory_bytes: 402653184
env:
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled Postgres database.
    generate: password
    length: 32
    secret: true
domains:
  - service: spliit
    port: 3000
    description: Public address of Spliit.
healthcheck:
  service: spliit
  port: 3000
  path: /
