services:
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    ports: ["16686", "4317", "4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:14269/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Probed from outside: the admin port 14269 above is not published.
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 16686
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
