# Converted from an upstream template catalog (see source in template.yaml).
services:
  new-api:
    image: calciumion/new-api:v0.9.2.0
    ports:
      - "3000"
    environment:
      ERROR_LOG_ENABLED: "true"
      REDIS_CONN_STRING: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET_BASE64}
      SQL_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/newapi?sslmode=disable&TimeZone=Asia/Shanghai
      TZ: Asia/Shanghai
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD-SHELL
        - 'wget -q -O - http://localhost:3000/api/status | grep -o ''"success":\s*true'' | awk -F: ''{print $2}'''
      timeout: 10s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 20
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d ${POSTGRES_DB:-newapi}
      timeout: 10s
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      interval: 5s
      retries: 20
      test:
        - CMD
        - redis-cli
        - PING
      timeout: 10s
