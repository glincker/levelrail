# Converted from an upstream template catalog (see source in template.yaml).
services:
  docuseal:
    image: docuseal/docuseal:latest
    ports:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      HOST: ${SERVICE_URL_DOCUSEAL}
    volumes:
      - docuseal-data:/data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:3000
      timeout: 20s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
