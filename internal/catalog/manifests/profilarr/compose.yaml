services:
  profilarr:
    image: santiagosayshey/profilarr:v1.1.5
    ports: ["6868"]
    environment:
      TZ: ${TZ}
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6868 || wget -q -O /dev/null http://127.0.0.1:6868"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
