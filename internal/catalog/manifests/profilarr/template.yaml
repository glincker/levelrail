id: profilarr
name: Profilarr
description: Manages and syncs quality profiles and custom formats for Sonarr and Radarr from a shared database.
icon: sliders
category: Media
documentation_url: https://github.com/Dictionarry-Hub/profilarr
source_repo: https://github.com/Dictionarry-Hub/profilarr
license: AGPL-3.0-only
license_class: network-copyleft
license_url: https://github.com/Dictionarry-Hub/profilarr/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Open the address, add your Sonarr and Radarr instances, then link a profile database.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
domains:
  - service: profilarr
    port: 6868
    description: Public address of Profilarr.
healthcheck:
  service: profilarr
  port: 6868
  path: /
