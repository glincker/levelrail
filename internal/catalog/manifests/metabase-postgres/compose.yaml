services:
  metabase:
    image: metabase/metabase:v0.65.4.1
    ports: ["3000"]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${DB_PASSWORD}
      JAVA_OPTS: -Xmx1g
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/api/health || wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: metabase
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 10
