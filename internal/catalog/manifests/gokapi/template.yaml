id: gokapi
name: Gokapi
description: A lightweight self-hosted file sharing server with expiring links and download limits. Runs in one container on a small data folder. The first-run setup page lets whoever opens it first create the admin login, so leave the domain empty until setup is finished.
icon: share
category: Storage
documentation_url: https://gokapi.readthedocs.io/
source_repo: https://github.com/Forceu/Gokapi
license: AGPL-3.0-only
license_class: network-copyleft
license_url: https://github.com/Forceu/Gokapi/blob/master/LICENSE
hosted_use: unknown
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Finish the setup page first, choosing the admin login, and only then add the public domain.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for dates and logs.
    default: Etc/UTC
domains:
  - service: gokapi
    port: 53842
    description: Leave empty until the setup page is finished, because whoever opens it first becomes admin. Then add the public address.
healthcheck:
  service: gokapi
  port: 53842
  path: /
