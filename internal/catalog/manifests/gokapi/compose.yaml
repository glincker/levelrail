services:
  gokapi:
    image: ghcr.io/forceu/gokapi:v1.9.6
    ports: ["53842"]
    environment:
      TZ: ${TZ}
    volumes:
      - gokapi_data:/app/data
      - gokapi_config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:53842/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
