services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:v4.0.8
    ports: ["8083"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
      - ingest:/cwa-book-ingest
      - library:/calibre-library
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8083"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
