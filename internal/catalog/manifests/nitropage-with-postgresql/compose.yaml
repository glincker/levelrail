# Converted from an upstream template catalog (see source in template.yaml).
services:
  nitropage:
    image: nitropage/nitropage:latest
    ports:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@postgresql:5432/nitropage
      NP_AUTH_PASSWORD: ${SESSION_PASSWORD}
      NP_AUTH_SALT: ${SALT_BASE64}
    volumes:
      - nitropage-data:/app/.data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      interval: 2s
      retries: 15
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000/admin
      timeout: 10s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nitropage
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_USER: ${POSTGRESQL_USER}
    volumes:
      - nitropage-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
