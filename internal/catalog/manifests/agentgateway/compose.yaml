services:
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:v1.7.0
    ports: ["3000"]
    command: ["-f", "/etc/agentgateway/config.yaml"]
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 3000
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
