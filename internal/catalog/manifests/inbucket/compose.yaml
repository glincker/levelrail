services:
  inbucket:
    image: inbucket/inbucket:3.2.0
    ports: ["9000", "2500"]
    volumes:
      - data:/storage
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 9000
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
