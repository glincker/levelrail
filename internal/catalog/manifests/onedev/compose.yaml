services:
  onedev:
    image: 1dev/server:16.9.0
    ports: ["6610"]
    volumes:
      - data:/opt/onedev
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6610/ || wget -q -O /dev/null http://127.0.0.1:6610/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
