# Converted from an upstream template catalog (see source in template.yaml).
services:
  n8n:
    image: n8nio/n8n:2.10.4
    ports:
      - "5678"
    environment:
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_TYPE: postgresdb
      EXECUTIONS_MODE: queue
      GENERIC_TIMEZONE: UTC
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_EDITOR_BASE_URL: ${SERVICE_URL_N8N}
      N8N_ENCRYPTION_KEY: ${ENCRYPTION_PASSWORD}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_HOST: ${SERVICE_URL_N8N}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_PASSWORD}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_RUNNERS_MODE: external
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: "false"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      TZ: UTC
      WEBHOOK_URL: ${SERVICE_URL_N8N}
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5678/healthz
      timeout: 20s
  n8n-worker:
    image: n8nio/n8n:2.10.4
    command: worker
    environment:
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_HOST: postgresql
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_TYPE: postgresdb
      EXECUTIONS_MODE: queue
      GENERIC_TIMEZONE: UTC
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENCRYPTION_KEY: ${ENCRYPTION_PASSWORD}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_NATIVE_PYTHON_RUNNER: "true"
      N8N_PROXY_HOPS: "1"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_PASSWORD}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_BROKER_PORT: "5679"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_RUNNERS_MODE: external
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: "false"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_HEALTH_CHECK_ACTIVE: "true"
      TZ: UTC
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5678/healthz
      timeout: 20s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
  redis:
    image: redis:6-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
  task-runners:
    image: n8nio/runners:2.10.4
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_PASSWORD}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "15"
      N8N_RUNNERS_MAX_CONCURRENCY: "5"
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
    depends_on:
      - n8n
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5680/healthz
      timeout: 20s
