id: cassandra
name: Apache Cassandra
description: A single node Apache Cassandra wide-column database on the official image, with a persistent volume. It is not published on the host and starts without authentication, so reach it only from other services in this project at cassandra:9042. A node needs about 2 GB of memory.
icon: database
category: Database Tools
documentation_url: https://cassandra.apache.org/doc/latest/
source_repo: https://github.com/apache/cassandra
license: Apache-2.0
license_class: permissive
license_url: https://github.com/apache/cassandra/blob/trunk/LICENSE.txt
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 2147483648
first_run:
  - The first start takes a few minutes. Connect from a service in the same project at cassandra:9042 with the CQL native protocol.
env:
  - key: CASSANDRA_CLUSTER_NAME
    label: Cluster name
    description: Name of the Cassandra cluster.
    default: levelrail
  - key: MAX_HEAP_SIZE
    label: Maximum heap
    description: JVM maximum heap, for example 1G. Set it together with the young generation size below.
    default: 1G
  - key: HEAP_NEWSIZE
    label: Young generation size
    description: JVM young generation size, for example 256M.
    default: 256M
domains:
  - service: cassandra
    port: 9042
    description: This is a TCP database with no web page, so leave it empty and connect over the project network.
healthcheck:
  service: cassandra
  port: 9042
  kind: tcp
