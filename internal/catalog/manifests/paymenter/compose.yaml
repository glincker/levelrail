# Converted from an upstream template catalog (see source in template.yaml).
services:
  mariadb:
    image: mariadb:11.8
    environment:
      MYSQL_DATABASE: paymenter-db
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQLROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - paymenter_mariadb_data:/var/lib/mysql
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      timeout: 20s
  paymenter:
    image: ghcr.io/paymenter/paymenter:v1.4.5
    ports:
      - "80"
    environment:
      APP_ENV: production
      APP_KEY: ${KEY_BASE64}
      CACHE_STORE: redis
      DB_CONNECTION: mariadb
      DB_DATABASE: paymenter-db
      DB_HOST: mariadb
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_PORT: "3306"
      DB_USERNAME: ${MYSQL_USER}
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: default
      SESSION_DRIVER: redis
    volumes:
      - app_logs:/app/storage/logs
      - extenstions:/app/extensions
      - themes:/app/themes
      - app_storage:/app/storage/app
      - app_public_storage:/app/storage/app/public
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      interval: 10s
      retries: 3
      test:
        - CMD-SHELL
        - curl -sf http://localhost:80 || exit 1
      timeout: 1s
  redis:
    image: redis:alpine
    healthcheck:
      interval: 10s
      retries: 3
      test:
        - CMD-SHELL
        - redis-cli ping || exit 1
      timeout: 1s
