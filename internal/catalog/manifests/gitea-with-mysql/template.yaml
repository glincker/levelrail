id: gitea-with-mysql
name: Gitea With Mysql
description: Gitea is a self-hosted, lightweight Git service, offering version control, collaboration, and code hosting.
icon: code
category: Developer Tools
documentation_url: https://docs.gitea.com
recommended_memory_bytes: 805306368
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/gitea-with-mysql.yaml
images:
  - service: gitea
    image: gitea/gitea:latest
  - service: mysql
    image: mysql:8.0
env:
  - key: MYSQL_USER
    label: Mysql User
    description: Generated when the app is installed.
    generate: user
  - key: MYSQL_PASSWORD
    label: Mysql Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: MYSQLROOT_PASSWORD
    label: Mysqlroot Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: MYSQL_DATABASE
    label: Mysql Database
    description: Defaults to gitea.
    default: gitea
domains:
  - service: gitea
    port: 3000
    description: Public address of gitea.
healthcheck:
  service: gitea
  port: 3000
  path: /
