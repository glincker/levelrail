services:
  krakend:
    image: krakend:3.0.3
    ports: ["8080"]
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /__health
      port: 8080
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
