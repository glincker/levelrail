services:
  ubooquity:
    image: lscr.io/linuxserver/ubooquity:3.1.0-ls98
    ports: ["2202", "2203"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
      - books:/books
      - comics:/comics
      - files:/files
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:2202/"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s
