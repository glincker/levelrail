id: greptimedb
name: GreptimeDB
description: A time series database for metrics, logs and traces with SQL, PromQL and OpenTelemetry ingest. This runs a single standalone node with no login on the HTTP port.
icon: database
category: Databases
documentation_url: https://docs.greptime.com/getting-started/installation/greptimedb-standalone/
source_repo: https://github.com/GreptimeTeam/greptimedb
license: Apache-2.0
license_class: permissive
license_url: https://github.com/GreptimeTeam/greptimedb/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
domains:
  - service: greptimedb
    port: 4000
    description: HTTP API and dashboard of GreptimeDB.
healthcheck:
  service: greptimedb
  port: 4000
  path: /health
