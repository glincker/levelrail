id: zwave-js-ui
name: Z-Wave JS UI
description: A control panel and MQTT gateway for Z-Wave networks that pairs with Home Assistant.
icon: wifi-high
category: Applications
documentation_url: https://zwave-js.github.io/zwave-js-ui/
source_repo: https://github.com/zwave-js/zwave-js-ui
license: MIT
license_class: permissive
license_url: https://github.com/zwave-js/zwave-js-ui/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Open the address and pick your Z-Wave serial adapter in Settings.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
  - key: SESSION_SECRET
    label: Session secret
    description: Secret used to sign login sessions.
    generate: hex
    length: 32
    secret: true
domains:
  - service: zwave-js-ui
    port: 8091
    description: Public address of Z-Wave JS UI.
healthcheck:
  service: zwave-js-ui
  port: 8091
  path: /health
