services:
  smokeping:
    image: lscr.io/linuxserver/smokeping:2.9.0
    ports: ["80"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
