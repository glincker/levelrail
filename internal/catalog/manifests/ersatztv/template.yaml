id: ersatztv
name: ErsatzTV
description: Turns your media library into live TV channels with schedules, streamed to any IPTV or Plex style client.
icon: television
category: Media
documentation_url: https://ersatztv.org/docs/
source_repo: https://github.com/ErsatzTV/ErsatzTV
license: Zlib
license_class: permissive
license_url: https://github.com/ErsatzTV/ErsatzTV/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
first_run:
  - Add a local library that points at /media, then build channels and schedules.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
domains:
  - service: ersatztv
    port: 8409
    description: Public address of ErsatzTV.
healthcheck:
  service: ersatztv
  port: 8409
  path: /
