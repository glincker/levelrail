services:
  dkron:
    image: dkron/dkron:4.2.1
    ports: ["8080"]
    command: ["agent", "--server", "--bootstrap-expect=1", "--data-dir=/dkron/data"]
    volumes:
      - data:/dkron/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
