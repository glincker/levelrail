services:
  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    ports: ["11800", "12800"]
    environment:
      SW_STORAGE: h2
      JAVA_OPTS: -Xms512m -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/11800'"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s
  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    ports: ["8080"]
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      skywalking-oap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
