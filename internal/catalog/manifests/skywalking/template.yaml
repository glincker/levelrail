id: skywalking
name: Apache SkyWalking
description: "An application performance monitoring platform with the OAP server and its web UI, using the built-in H2 store. H2 keeps data in memory, so telemetry is lost on restart. Agents send to skywalking-oap:11800."
icon: chart-line
category: Monitoring
documentation_url: https://skywalking.apache.org/docs/
source_repo: https://github.com/apache/skywalking
license: Apache-2.0
license_class: permissive
license_url: https://github.com/apache/skywalking/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 2147483648
first_run:
  - Open the UI, then point SkyWalking agents in this project at skywalking-oap:11800.
domains:
  - service: skywalking-ui
    port: 8080
    description: Public address of the SkyWalking UI.
healthcheck:
  service: skywalking-ui
  port: 8080
  path: /
