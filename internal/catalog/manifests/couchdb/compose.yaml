services:
  couchdb:
    image: couchdb:3.4
    ports: ["5984"]
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
