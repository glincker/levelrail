services:
  statping-ng:
    image: adamboutcher/statping-ng:v0.90.78
    ports: ["8080"]
    environment:
      DB_CONN: "sqlite"
      NAME: "Status"
      DESCRIPTION: "Service status"
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - app:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
