services:
  syncthing-discovery:
    image: syncthing/discosrv:2.1.7
    ports: ["8443"]
    command: ["--http", "--listen=:8443", "--db-dir=/var/stdiscosrv"]
    volumes:
      - data:/var/stdiscosrv
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: tcp
      port: 8443
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
