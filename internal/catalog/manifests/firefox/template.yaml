id: firefox
name: Firefox
description: Fast, private, and self-hosted secure browser for browsing without limits.
icon: check-square
category: Productivity
documentation_url: https://github.com/jlesage/docker-firefox
recommended_memory_bytes: 268435456
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/firefox.yaml
images:
  - service: firefox
    image: jlesage/firefox:latest
domains:
  - service: firefox
    port: 5800
    description: Public address of firefox.
healthcheck:
  service: firefox
  port: 5800
  path: /
