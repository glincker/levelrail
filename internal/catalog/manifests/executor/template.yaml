id: executor
name: Executor
description: Self-hosted AI agent integrations and code execution server.
icon: code
category: Developer Tools
documentation_url: https://executor.sh/docs/hosted/docker
recommended_memory_bytes: 268435456
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/executor.yaml
images:
  - service: executor
    image: ghcr.io/rhyssullivan/executor-selfhost:latest
domains:
  - service: executor
    port: 4788
    description: Public address of executor.
healthcheck:
  service: executor
  port: 4788
  path: /
