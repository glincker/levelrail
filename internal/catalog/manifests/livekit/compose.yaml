services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    ports: ["7880", "7881"]
    command: ["--config", "/etc/livekit.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/ || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 10s
