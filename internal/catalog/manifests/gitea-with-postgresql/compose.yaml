# Converted from an upstream template catalog (see source in template.yaml).
services:
  gitea:
    image: gitea/gitea:latest
    ports:
      - "3000"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgresql
      GITEA__database__NAME: ${POSTGRESQL_DATABASE}
      GITEA__database__PASSWD: ${POSTGRESQL_PASSWORD}
      GITEA__database__USER: ${POSTGRESQL_USER}
      USER_GID: "1000"
      USER_UID: "1000"
    volumes:
      - gitea-data:/data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      interval: 2s
      retries: 15
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000
      timeout: 10s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_USER: ${POSTGRESQL_USER}
    volumes:
      - gitea-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
