# Converted from an upstream template catalog (see source in template.yaml).
services:
  bento-pdf:
    image: ghcr.io/alam00000/bentopdf:v1.16.1
    ports:
      - "8080"
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:8080
      timeout: 20s
