services:
  app:
    image: onetimesecret/onetimesecret:v0.26.14
    ports: ["3000"]
    environment:
      AUTH_AUTOVERIFY: "true"
      AUTH_SIGNUP: "true"
      COLONEL: ${COLONEL_EMAIL}
      HOST: ${PUBLIC_HOST}
      REDIS_URL: redis://redis:6379/0
      SECRET: ${SECRET}
      SSL: "false"
      RACK_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
