id: evolution-api
name: Evolution Api
description: Multi-platform messaging (whatsapp and more) integration API
icon: code
category: Developer Tools
documentation_url: https://doc.evolution-api.com/v2/en/get-started/introduction
recommended_memory_bytes: 671088640
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/evolution-api.yaml
images:
  - service: api
    image: evoapicloud/evolution-api:v2.3.7
  - service: postgres
    image: postgres:16-alpine
  - service: redis
    image: redis:7-alpine
env:
  - key: POSTGRES_USER
    label: Postgres User
    description: Generated when the app is installed.
    generate: user
  - key: POSTGRES_PASSWORD
    label: Postgres Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: AUTHENTICATIONAPIKEY_PASSWORD
    label: Authenticationapikey Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: api
    port: 8080
    description: Public address of api.
healthcheck:
  service: api
  port: 8080
  path: /
