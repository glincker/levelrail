services:
  tidb:
    image: pingcap/tidb:v7.5.8
    ports: ["4000", "10080"]
    command: ["--store=unistore", "--path=", "--host=0.0.0.0", "--status=10080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:10080/status"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
