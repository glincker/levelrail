services:
  svix:
    image: svix/svix-server:v1.105.0
    ports: ["8071"]
    environment:
      WAIT_FOR: "true"
      SVIX_DB_DSN: postgresql://svix:${DB_PASSWORD}@db:5432/svix
      SVIX_REDIS_DSN: redis://redis:6379
      SVIX_JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "svix-server healthcheck http://localhost:8071"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: svix
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: svix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svix -d svix"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
