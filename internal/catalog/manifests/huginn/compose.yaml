services:
  huginn:
    image: huginn/huginn:v2026.11.01
    ports: ["3000"]
    environment:
      APP_SECRET_TOKEN: $SERVICE_PASSWORD_64_APPSECRET
      DOMAIN: ${SERVICE_FQDN_HUGINN:-localhost}
      FORCE_SSL: "false"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/users/sign_in"]
      interval: 20s
      timeout: 6s
      retries: 15
      start_period: 120s
