id: huginn
name: Huginn
description: A tool that builds agents which watch the web and act for you, such as tracking a page, filtering a feed or sending an email when something changes. This image bundles its own MySQL, so it is one container.
icon: robot
category: Applications
documentation_url: https://github.com/huginn/huginn/wiki
source_repo: https://github.com/huginn/huginn
license: MIT
license_class: permissive
license_url: https://github.com/huginn/huginn/blob/master/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 1073741824
first_run:
  - Sign in with the default admin account and change its password right away (see the Huginn docs for the default user).
domains:
  - service: huginn
    port: 3000
    description: Public address of Huginn.
healthcheck:
  service: huginn
  port: 3000
  path: /users/sign_in
