id: calibre-web-automated-book-downloader
name: Calibre Web Automated Book Downloader
description: An intuitive web interface for searching and requesting book downloads, designed to work seamlessly with Calibre-Web-Automated.
icon: play-circle
category: Media
documentation_url: https://github.com/calibrain/calibre-web-automated-book-downloader
recommended_memory_bytes: 536870912
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/calibre-web-automated-book-downloader.yaml
images:
  - service: calibre-web-automated
    image: crocodilestick/calibre-web-automated:latest
  - service: calibre-web-downloader
    image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
domains:
  - service: calibre-web-automated
    port: 8083
    description: Public address of calibre-web-automated.
  - service: calibre-web-downloader
    port: 8084
    description: Public address of calibre-web-downloader.
healthcheck:
  service: calibre-web-automated
  port: 8083
  path: /
