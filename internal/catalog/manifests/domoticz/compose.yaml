services:
  domoticz:
    image: domoticz/domoticz:2026.4
    ports: ["8080"]
    environment:
      TZ: ${TZ}
    volumes:
      - userdata:/opt/domoticz/userdata
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
