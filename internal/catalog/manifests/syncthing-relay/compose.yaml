services:
  syncthing-relay:
    image: syncthing/relaysrv:2.1.7
    ports: ["22070", "22067"]
    command: ["--listen=:22067", "--status-srv=:22070"]
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /status
      port: 22070
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
