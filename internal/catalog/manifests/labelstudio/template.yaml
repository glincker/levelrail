id: labelstudio
name: Labelstudio
description: Label Studio is a multi-type data labeling and annotation tool with standardized output format
icon: sparkle
category: AI
documentation_url: https://labelstud.io/guide/
recommended_memory_bytes: 536870912
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/labelstudio.yaml
images:
  - service: labelstudio
    image: heartexlabs/label-studio:latest
  - service: postgres
    image: postgres:16-alpine
env:
  - key: POSTGRES_USER
    label: Postgres User
    description: Generated when the app is installed.
    generate: user
  - key: POSTGRES_PASSWORD
    label: Postgres Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: LABELSTUDIO_PASSWORD
    label: Labelstudio Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: labelstudio
    port: 8080
    description: Public address of labelstudio.
healthcheck:
  service: labelstudio
  port: 8080
  path: /
