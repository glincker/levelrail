# Converted from an upstream template catalog (see source in template.yaml).
services:
  labelstudio:
    image: heartexlabs/label-studio:latest
    ports:
      - "8080"
    environment:
      CSRF_TRUSTED_ORIGINS: ${SERVICE_URL_LABELSTUDIO}
      DATA_UPLOAD_MAX_NUMBER_FILES: "10000"
      DJANGO_DB: default
      EXPERIMENTAL_FEATURES: "false"
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
      LABEL_STUDIO_HOST: ${SERVICE_URL_LABELSTUDIO}
      LABEL_STUDIO_PASSWORD: ${LABELSTUDIO_PASSWORD}
      LABEL_STUDIO_USERNAME: admin@example.com
      POSTGRE_HOST: postgres
      POSTGRE_NAME: labelstudio
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRE_PORT: "5432"
      POSTGRE_USER: ${POSTGRES_USER}
      SSRF_PROTECTION_ENABLED: "true"
    volumes:
      - labelstudio-data:/label-studio/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - curl -f http://localhost:8080/health || exit 1
      timeout: 20s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labelstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - pg_isready -h localhost -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
