services:
  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.14.0
    ports: ["6274"]
    environment:
      HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:6274/"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
