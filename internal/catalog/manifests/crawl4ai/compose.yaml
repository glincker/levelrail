services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.5
    ports: ["11235"]
    environment:
      CRAWL4AI_API_TOKEN: ${API_TOKEN}
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
