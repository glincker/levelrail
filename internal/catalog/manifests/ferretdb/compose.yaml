services:
  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    ports: ["27017"]
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://ferretdb:$SERVICE_PASSWORD_FERRETDB@postgres:5432/postgres
      FERRETDB_TELEMETRY: disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    environment:
      POSTGRES_USER: ferretdb
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_FERRETDB
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferretdb -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
