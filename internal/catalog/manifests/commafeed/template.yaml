id: commafeed
name: CommaFeed
description: A fast self-hosted RSS reader with a clean web client and keyboard shortcuts. It uses an embedded database kept on a volume.
icon: rss
category: Productivity
documentation_url: https://github.com/Athou/commafeed
source_repo: https://github.com/Athou/commafeed
license: Apache-2.0
license_class: permissive
license_url: https://github.com/Athou/commafeed/blob/master/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
first_run:
  - Sign in with the default admin account shown in the project docs and change the password right away.
domains:
  - service: commafeed
    port: 8082
    description: Public address of CommaFeed.
healthcheck:
  service: commafeed
  port: 8082
  path: /
