services:
  rss-bridge:
    image: rssbridge/rss-bridge:2025-08-05
    ports: ["80"]
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\") === false ? 1 : 0);'"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s
