services:
  rethinkdb:
    image: rethinkdb:2.4.4-bookworm-slim
    ports: ["8080", "28015"]
    command: ["rethinkdb", "--bind", "all", "--directory", "/data"]
    volumes:
      - rethink_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 20s
