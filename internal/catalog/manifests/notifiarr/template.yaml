id: notifiarr
name: Notifiarr
description: Client for the Notifiarr service that relays notifications and syncs profiles for your media apps. The install form carries notifiarr.conf as an editable file and asks for your API key.
icon: bell
category: Media
documentation_url: https://notifiarr.wiki/
source_repo: https://github.com/Notifiarr/notifiarr
license: MIT
license_class: permissive
license_url: https://github.com/Notifiarr/notifiarr/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Create an account on notifiarr.com, copy your API key into the install form, then open the address to add your apps.
env:
  - key: NOTIFIARR_API_KEY
    label: Notifiarr API key
    description: The key from your notifiarr.com profile.
    required: true
    secret: true
  - key: NOTIFIARR_UI_PASSWORD
    label: Web UI password
    description: Password for the local web UI, user admin.
    generate: password
    length: 24
    secret: true
  - key: NOTIFIARR_CONFIG
    type: file
    service: notifiarr
    path: /etc/notifiarr/notifiarr.conf
    mode: "0400"
    label: notifiarr.conf
    description: The Notifiarr configuration, mounted read-only.
    secret: true
    default: |
      api_key = "${NOTIFIARR_API_KEY}"
      ui_password = "admin:${NOTIFIARR_UI_PASSWORD}"
      bind_addr = "0.0.0.0:5454"
      quiet = true
domains:
  - service: notifiarr
    port: 5454
    description: Public address of the Notifiarr web UI.
healthcheck:
  service: notifiarr
  port: 5454
  path: /
