services:
  gitbucket:
    image: gitbucket/gitbucket:4.38.4
    ports: ["8080"]
    volumes:
      - gitbucket_data:/gitbucket
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
