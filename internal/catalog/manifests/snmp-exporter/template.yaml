id: snmp-exporter
name: SNMP Exporter
description: A Prometheus exporter that polls network devices over SNMP and exposes their metrics, with the standard device modules built in. Apache-2.0 licensed. Point Prometheus at the probe endpoint with a target.
icon: chart
category: Monitoring
documentation_url: https://github.com/prometheus/snmp_exporter
source_repo: https://github.com/prometheus/snmp_exporter
license: Apache-2.0
license_class: permissive
license_url: https://github.com/prometheus/snmp_exporter/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 67108864
first_run:
  - Add a Prometheus scrape job that calls /snmp with target and module parameters.
domains:
  - service: snmp-exporter
    port: 9116
    description: Public address of SNMP Exporter.
healthcheck:
  service: snmp-exporter
  port: 9116
  path: /
