services:
  mafl:
    image: hywax/mafl:v0.15.4
    ports: ["3000"]
    volumes:
      - data:/app/data/icons
    configs:
      - source: mafl_config
        target: /app/data/config.yml
        mode: 0444
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

configs:
  mafl_config:
    content: |
      title: Mafl
      services:
        - title: Links
          items:
            - title: Levelrail
              url: https://levelrail.dev
