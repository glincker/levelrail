id: monica
name: Monica
description: A personal CRM that remembers the people in your life, with notes, reminders, activities and relationships.
icon: users
category: Productivity
documentation_url: https://github.com/monicahq/monica/blob/main/docs/installation/docker.md
recommended_memory_bytes: 536870912
env:
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled MariaDB database.
    generate: password
    length: 32
    secret: true
  - key: DB_ROOT_PASSWORD
    label: Database root password
    description: Root password for the bundled MariaDB server.
    generate: password
    length: 32
    secret: true
  - key: APP_KEY
    label: Application key
    description: Encrypts sessions and stored data. Changing it invalidates both.
    generate: password
    length: 32
    secret: true
domains:
  - service: monica
    port: 80
    description: Public address of Monica.
healthcheck:
  service: monica
  port: 80
  path: /
