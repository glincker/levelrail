services:
  monica:
    image: monica:4.1.2-apache
    ports: ["80"]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${SERVICE_FQDN_MONICA:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: monica
      DB_USERNAME: monica
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || wget -q -O /dev/null http://127.0.0.1:80/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  mariadb:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: monica
      MYSQL_USER: monica
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
