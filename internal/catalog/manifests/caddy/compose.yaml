services:
  caddy:
    image: caddy:2.8.4
    ports: ["80"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s
