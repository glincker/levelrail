services:
  caddy:
    image: caddy:2.11.9-alpine
    ports: ["80"]
    volumes:
      - site:/usr/share/caddy
      - data:/data
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
