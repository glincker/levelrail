services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    ports: ["5055"]
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
      PORT: "5055"
    volumes:
      - config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
