services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.1
    ports: ["8080", "26257"]
    command: ["start-single-node", "--insecure", "--http-addr=0.0.0.0:8080", "--store=/cockroach/cockroach-data"]
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD-SHELL", "/cockroach/cockroach sql --insecure -e 'select 1' > /dev/null"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
