# Converted from an upstream template catalog (see source in template.yaml).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: usesend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - usesend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
  redis:
    image: redis:7
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
    volumes:
      - usesend-redis-data:/data
    healthcheck:
      interval: 5s
      retries: 20
      test:
        - CMD
        - redis-cli
        - PING
      timeout: 10s
  usesend:
    image: usesend/usesend:latest
    ports:
      - "3000"
    environment:
      API_RATE_LIMIT: "1"
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/usesend
      GITHUB_ID: ${GITHUB_ID}
      GITHUB_SECRET: ${GITHUB_SECRET}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_IS_CLOUD: "false"
      NEXTAUTH_SECRET: ${NEXTAUTHSECRET_BASE64}
      NEXTAUTH_URL: ${SERVICE_URL_USESEND}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - wget -qO- http://usesend:3000 || exit 1
      timeout: 2s
