id: traefik
name: Traefik
description: "A cloud native reverse proxy and load balancer with a built-in dashboard, on the official image. The dashboard has no login, so put it behind an access rule before you give it a public address."
icon: network
category: Infrastructure
documentation_url: https://doc.traefik.io/traefik/
source_repo: https://github.com/traefik/traefik
license: MIT
license_class: permissive
license_url: https://github.com/traefik/traefik/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Open the dashboard to see routers and services, and restrict who can reach it before exposing it.
domains:
  - service: traefik
    port: 8080
    description: Public address of the Traefik dashboard.
healthcheck:
  service: traefik
  port: 8080
  path: /dashboard/
