# Converted from an upstream template catalog (see source in template.yaml).
services:
  codimd:
    image: nabo.codimd.dev/hackmdio/hackmd:latest
    ports:
      - "3000"
    environment:
      CMD_ALLOW_EMAIL_REGISTER: "true"
      CMD_DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/codimd-db
      CMD_DOMAIN: ${SERVICE_HOST_CODIMD}
      CMD_EMAIL: "true"
      CMD_PROTOCOL_USESSL: "true"
      CMD_SESSION_SECRET: ${SESSIONSECRET_PASSWORD}
      CMD_USECDN: "false"
    volumes:
      - uploads_data:/home/hackmd/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 5
      test:
        - CMD-SHELL
        - curl -f http://localhost:3000/ || exit 1
      timeout: 20s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codimd-db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - codimd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
