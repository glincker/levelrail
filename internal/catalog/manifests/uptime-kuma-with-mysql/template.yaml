id: uptime-kuma-with-mysql
name: Uptime Kuma With Mysql
description: Uptime Kuma is a monitoring tool for tracking the status and performance of your applications in real-time.
icon: chart-line
category: Monitoring
documentation_url: https://github.com/louislam/uptime-kuma?tab=readme-ov-file
recommended_memory_bytes: 805306368
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/uptime-kuma-with-mysql.yaml
images:
  - service: mysql
    image: mysql:8
  - service: uptime-kuma
    image: louislam/uptime-kuma:2
env:
  - key: MYSQL_USER
    label: Mysql User
    description: Generated when the app is installed.
    generate: user
  - key: MYSQL_PASSWORD
    label: Mysql Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: ROOT_PASSWORD
    label: Root Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: uptime-kuma
    port: 3001
    description: Public address of uptime-kuma.
healthcheck:
  service: uptime-kuma
  port: 3001
  path: /
