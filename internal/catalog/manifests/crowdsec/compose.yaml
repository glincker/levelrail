services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2
    ports: ["8080"]
    environment:
      DISABLE_AGENT: true
      DISABLE_ONLINE_API: true
    volumes:
      - config:/etc/crowdsec
      - data:/var/lib/crowdsec/data
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /health
      port: 8080
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
