services:
  redash:
    image: redash/redash:25.8.0
    command: ["sh", "-c", "until python /app/manage.py database create_tables; do sleep 3; done; exec /app/bin/docker-entrypoint server"]
    ports: ["5000"]
    environment:
      REDASH_DATABASE_URL: postgresql://redash:$SERVICE_PASSWORD_REDASHDB@postgres:5432/redash
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_COOKIE_SECRET: $SERVICE_PASSWORD_64_COOKIE
      REDASH_SECRET_KEY: $SERVICE_PASSWORD_64_SECRET
      REDASH_WEB_WORKERS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/ping').status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
  worker:
    image: redash/redash:25.8.0
    command: ["/app/bin/docker-entrypoint", "worker"]
    environment:
      REDASH_DATABASE_URL: postgresql://redash:$SERVICE_PASSWORD_REDASHDB@postgres:5432/redash
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_COOKIE_SECRET: $SERVICE_PASSWORD_64_COOKIE
      REDASH_SECRET_KEY: $SERVICE_PASSWORD_64_SECRET
      QUEUES: queries,scheduled_queries,celery,schemas,default
      WORKERS_COUNT: "2"
    depends_on:
      redash:
        condition: service_healthy
      redis:
        condition: service_healthy
  scheduler:
    image: redash/redash:25.8.0
    command: ["/app/bin/docker-entrypoint", "scheduler"]
    environment:
      REDASH_DATABASE_URL: postgresql://redash:$SERVICE_PASSWORD_REDASHDB@postgres:5432/redash
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_COOKIE_SECRET: $SERVICE_PASSWORD_64_COOKIE
      REDASH_SECRET_KEY: $SERVICE_PASSWORD_64_SECRET
      QUEUES: celery
      WORKERS_COUNT: "1"
    depends_on:
      redash:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_REDASHDB
      POSTGRES_DB: redash
    volumes:
      - redash_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redash -d redash"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  redis:
    image: redis:7.4.5
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redash_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
