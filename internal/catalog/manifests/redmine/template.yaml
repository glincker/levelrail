id: redmine
name: Redmine
description: A mature project management and issue tracker with Gantt charts, wikis and time tracking, backed by Postgres.
icon: ticket
category: Productivity
documentation_url: https://www.redmine.org/projects/redmine/wiki/Guide
recommended_memory_bytes: 536870912
env:
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled Postgres database.
    generate: password
    length: 32
    secret: true
  - key: SECRET_KEY_BASE
    label: Session signing key
    description: Signs Redmine's session cookies. Changing it signs every user out.
    generate: hex
    length: 64
    secret: true
domains:
  - service: redmine
    port: 3000
    description: Public address of Redmine.
healthcheck:
  service: redmine
  port: 3000
  path: /
