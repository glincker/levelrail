id: superset
name: Apache Superset
description: A business intelligence platform for exploring data and building dashboards, with its metadata kept in SQLite.
icon: chart-bar
category: Analytics
documentation_url: https://superset.apache.org/docs/intro
recommended_memory_bytes: 2147483648
env:
  - key: SUPERSET_SECRET_KEY
    label: Secret key
    description: Signs sessions and encrypts stored database credentials. Changing it breaks saved connections.
    generate: hex
    length: 64
    secret: true
  - key: ADMIN_USERNAME
    label: Admin user
    description: Name of the first admin account.
    default: admin
  - key: ADMIN_PASSWORD
    label: Admin password
    description: Password for the first admin account.
    generate: password
    length: 32
    secret: true
domains:
  - service: superset
    port: 8088
    description: Public address of Superset.
healthcheck:
  service: superset
  port: 8088
  path: /health
