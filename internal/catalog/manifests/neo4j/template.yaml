id: neo4j
name: Neo4j
description: A graph database with the Cypher query language, Community Edition, including the browser console.
icon: graph
category: Database Tools
documentation_url: https://neo4j.com/docs/
recommended_memory_bytes: 1073741824
env:
  - key: NEO4J_PASSWORD
    label: Neo4j password
    description: Password for the neo4j user. Bolt clients connect on port 7687.
    generate: password
    length: 32
    secret: true
domains:
  - service: neo4j
    port: 7474
    description: Public address of the Neo4j browser console.
healthcheck:
  service: neo4j
  port: 7474
  path: /
