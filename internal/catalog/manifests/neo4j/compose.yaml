services:
  neo4j:
    image: neo4j:5.26-community
    ports: ["7474", "7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
