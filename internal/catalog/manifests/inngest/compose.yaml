services:
  inngest:
    image: inngest/inngest:v1.27.0
    command: ["inngest", "start", "--host", "0.0.0.0"]
    ports: ["8288"]
    environment:
      INNGEST_EVENT_KEY: ${EVENT_KEY}
      INNGEST_SIGNING_KEY: ${SIGNING_KEY}
      INNGEST_POSTGRES_URI: postgres://inngest:${DB_PASSWORD}@db:5432/inngest
      INNGEST_REDIS_URI: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inngest
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: inngest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inngest -d inngest"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
