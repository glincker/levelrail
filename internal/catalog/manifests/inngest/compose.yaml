# Converted from an upstream template catalog (see source in template.yaml).
services:
  inngest:
    image: inngest/inngest:v1.27.0
    restart: unless-stopped
    command: inngest start --host 0.0.0.0
    ports:
      - "8288"
    environment:
      INNGEST_EVENT_KEY: ${EVENTKEY_HEX}
      INNGEST_POSTGRES_URI: postgres://inngest:${POSTGRES_PASSWORD}@postgres:5432/inngest
      INNGEST_REDIS_URI: redis://redis:6379
      INNGEST_SIGNING_KEY: ${SIGNINGKEY_HEX}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
        - CMD
        - inngest
        - alpha
        - doctor
        - healthcheck
      timeout: 10s
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: inngest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: inngest
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 5
      test:
        - CMD-SHELL
        - pg_isready -U inngest -d inngest
      timeout: 5s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      interval: 5s
      retries: 5
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
