id: inngest
name: Inngest
description: A durable workflow engine for background jobs, queues, cron and event-driven functions, backed by Postgres and Redis.
icon: workflow
category: Developer Tools
documentation_url: https://www.inngest.com/docs/self-hosting
source_repo: https://github.com/inngest/inngest
license: LicenseRef-SSPL-1.0-DOSP
license_class: source-available
license_url: https://github.com/inngest/inngest/blob/main/LICENSE.md
recommended_memory_bytes: 536870912
env:
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled Postgres database.
    generate: password
    length: 32
    secret: true
  - key: EVENT_KEY
    label: Event key
    description: Authenticates apps that send events. Must be an even-length hex string.
    generate: hex
    length: 32
    secret: true
  - key: SIGNING_KEY
    label: Signing key
    description: Authenticates calls from the server to your functions. Must be an even-length hex string.
    generate: hex
    length: 32
    secret: true
domains:
  - service: inngest
    port: 8288
    description: Public address of Inngest.
healthcheck:
  service: inngest
  port: 8288
  path: /
