services:
  trivy:
    image: aquasec/trivy:0.76.2
    ports: ["4954"]
    command: ["server", "--listen", "0.0.0.0:4954"]
    volumes:
      - cache:/root/.cache/trivy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4954/healthz"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s
