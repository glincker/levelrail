services:
  karma:
    image: ghcr.io/prymitive/karma:v0.134@sha256:479c7bfad3c176b9c35c5a48c2ad8fa72d748f204314daff748fb51488f043da
    ports: ["8080"]
    environment:
      ALERTMANAGER_URI: ${KARMA_ALERTMANAGER}
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /health
      port: 8080
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
