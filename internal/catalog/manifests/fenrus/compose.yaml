services:
  fenrus:
    image: revenz/fenrus:26.10
    ports: ["3000"]
    environment:
      TZ: ${TZ}
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000 || wget -q -O /dev/null http://127.0.0.1:3000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
