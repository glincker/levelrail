id: fenrus
name: Fenrus
description: A personal dashboard for your self hosted apps with search, groups and live widgets.
icon: squares-four
category: Productivity
documentation_url: https://github.com/revenz/Fenrus
source_repo: https://github.com/revenz/Fenrus
license: GPL-3.0-only
license_class: copyleft
license_url: https://github.com/revenz/Fenrus/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Open the address and add your apps as dashboard items.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
domains:
  - service: fenrus
    port: 3000
    description: Public address of Fenrus.
healthcheck:
  service: fenrus
  port: 3000
  path: /
