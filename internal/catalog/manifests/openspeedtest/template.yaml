id: openspeedtest
name: OpenSpeedTest
description: A browser speed test you host yourself. It measures download and upload speed between a visitor and this server, with no account and no stored results.
icon: gauge
category: Monitoring
documentation_url: https://openspeedtest.com/
source_repo: https://github.com/openspeedtest/Speed-Test
license: MIT
license_class: permissive
license_url: https://github.com/openspeedtest/Speed-Test/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 67108864
first_run:
  - Open the address and press Start. Results reflect the path between your browser and this server.
domains:
  - service: openspeedtest
    port: 3000
    description: Public address of the speed test page.
healthcheck:
  service: openspeedtest
  port: 3000
  path: /
