services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.1
    ports: ["3000", "4317", "4318"]
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: $SERVICE_PASSWORD_GRAFANAADMIN
    volumes:
      - otel_lgtm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
