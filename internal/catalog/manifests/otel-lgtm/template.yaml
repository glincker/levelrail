id: otel-lgtm
name: Grafana OTel LGTM
description: "An all-in-one OpenTelemetry backend with an OTLP collector, Loki logs, Tempo traces, Prometheus metrics and Grafana in one container. The Grafana admin password is generated at install. OTLP ports are not published on the host, so send telemetry from other services in this project to otel-lgtm:4317 (gRPC) or otel-lgtm:4318 (HTTP)."
icon: chart-line
category: Monitoring
documentation_url: https://grafana.com/docs/opentelemetry/docker-lgtm/
source_repo: https://github.com/grafana/docker-otel-lgtm
license: Apache-2.0
license_class: permissive
license_url: https://github.com/grafana/docker-otel-lgtm/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 1073741824
first_run:
  - Sign in to Grafana as admin with the generated password from the app secrets.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for dates and logs.
    default: Etc/UTC
domains:
  - service: otel-lgtm
    port: 3000
    description: Public address of Grafana.
healthcheck:
  service: otel-lgtm
  port: 3000
  path: /api/health
