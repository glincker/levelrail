id: sabnzbd
name: SABnzbd
description: A Usenet binary downloader with a web interface, RSS and post-processing. GPL-2.0 licensed. On first open, run the setup wizard to add your Usenet provider; if you serve it on a domain, add that host name under Config, Special, host_whitelist.
icon: cloud
category: Applications
documentation_url: https://sabnzbd.org/wiki/
recommended_memory_bytes: 402653184
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and the scheduler.
    default: Etc/UTC
domains:
  - service: sabnzbd
    port: 8080
    description: Public address of SABnzbd.
healthcheck:
  service: sabnzbd
  port: 8080
  path: /
