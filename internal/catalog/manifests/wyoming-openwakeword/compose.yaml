services:
  wyoming-openwakeword:
    image: rhasspy/wyoming-openwakeword:2.1.0
    ports: ["10400"]
    command: ["--preload-model", "ok_nabu"]
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: tcp
      port: 10400
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
