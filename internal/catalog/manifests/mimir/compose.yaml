services:
  mimir:
    image: grafana/mimir:3.2.4
    ports: ["9009"]
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9009/ready || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
