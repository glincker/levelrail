services:
  smtp4dev:
    image: rnwood/smtp4dev:3.16.1
    ports: ["80", "25"]
    volumes:
      - data:/smtp4dev
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 80
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
