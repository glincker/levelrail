services:
  tasmoadmin:
    image: ghcr.io/tasmoadmin/tasmoadmin:v5.0.0
    ports: ["80"]
    environment:
      TZ: ${TZ}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
