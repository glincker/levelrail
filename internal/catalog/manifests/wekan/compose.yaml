services:
  wekan:
    image: wekanteam/wekan:v12.45
    ports: ["8080"]
    environment:
      MONGO_URL: mongodb://mongo:27017/wekan
      ROOT_URL: ${SERVICE_FQDN_WEKAN:-http://localhost:8080}
      WRITABLE_PATH: /data
    volumes:
      - attachments:/data
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
  mongo:
    image: mongo:7
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
