id: cratedb
name: CrateDB
description: "A distributed SQL database for time series and search, running as a single node with the Admin UI and a data volume. The PostgreSQL port 5432 stays private. The UI has no login."
icon: database
category: Database Tools
documentation_url: https://cratedb.com/docs/crate/reference/en/latest/
source_repo: https://github.com/crate/crate
license: Apache-2.0
license_class: permissive
license_url: https://github.com/crate/crate/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 1073741824
first_run:
  - Open the Admin UI, and connect PostgreSQL clients at cratedb:5432 with the user crate from this project.
domains:
  - service: cratedb
    port: 4200
    description: Public address of the web page.
healthcheck:
  service: cratedb
  port: 4200
  path: /
