id: cleanuparr
name: Cleanuparr
description: A companion for Sonarr, Radarr and your download client that removes stalled, failed and malicious downloads and cleans up leftovers. GPL-3.0 licensed. Open the web UI and add your arr apps and download client under Settings.
icon: broom
category: Applications
documentation_url: https://cleanuparr.github.io/Cleanuparr/
source_repo: https://github.com/Cleanuparr/Cleanuparr
license: GPL-3.0
license_class: copyleft
license_url: https://github.com/Cleanuparr/Cleanuparr/blob/main/LICENSE
recommended_memory_bytes: 268435456
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
domains:
  - service: cleanuparr
    port: 11011
    description: Public address of Cleanuparr.
healthcheck:
  service: cleanuparr
  port: 11011
  path: /health
