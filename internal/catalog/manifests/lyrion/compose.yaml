services:
  lyrion:
    image: lmscommunity/lyrionmusicserver:9.1.2
    ports: ["9000"]
    environment:
      TZ: ${TZ}
      HTTP_PORT: "9000"
    volumes:
      - config:/config
      - playlists:/playlist
      - music:/music
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000 || wget -q -O /dev/null http://127.0.0.1:9000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
