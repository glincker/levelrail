id: lyrion
name: Lyrion Music Server
description: The successor to Logitech Media Server, streaming your music to Squeezebox players and apps.
icon: music-notes
category: Media
documentation_url: https://lyrion.org/
source_repo: https://github.com/LMS-Community/slimserver
license: GPL-2.0-only
license_class: copyleft
license_url: https://github.com/LMS-Community/slimserver/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
first_run:
  - Open the address, set the music folder to /music in the first run wizard.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
domains:
  - service: lyrion
    port: 9000
    description: Public address of Lyrion Music Server.
healthcheck:
  service: lyrion
  port: 9000
  path: /
