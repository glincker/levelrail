services:
  solr:
    image: solr:9.7.0
    ports: ["8983"]
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8983/solr/admin/info/system > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
