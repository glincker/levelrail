id: solr
name: Apache Solr
description: The Apache Solr search platform on the official image, with a persistent volume. The admin interface has no login, so keep it private or put it behind an authenticating proxy before adding a public domain. Other services in this project reach it at solr:8983.
icon: database
category: Database Tools
documentation_url: https://solr.apache.org/guide/solr/latest/
source_repo: https://github.com/apache/solr
license: Apache-2.0
license_class: permissive
license_url: https://github.com/apache/solr/blob/main/LICENSE.txt
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 1073741824
first_run:
  - Open the admin interface and create a core, or run the solr create command in the container's console.
domains:
  - service: solr
    port: 8983
    description: Public address of the Solr admin interface. It has no login, so leave it empty unless a proxy adds one.
healthcheck:
  service: solr
  port: 8983
  path: /solr/admin/info/system
