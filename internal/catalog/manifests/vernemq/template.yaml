id: vernemq
name: VerneMQ
description: "A scalable MQTT broker with a status page and a data volume, with one generated admin user and anonymous access off. MQTT on 1883 stays private."
icon: network
category: Infrastructure
documentation_url: https://docs.vernemq.com/
source_repo: https://github.com/vernemq/vernemq
license: Apache-2.0
license_class: permissive
license_url: https://github.com/vernemq/vernemq/blob/main/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Connect MQTT clients in this project to vernemq:1883 as user admin with the generated password from the app secrets.
domains:
  - service: vernemq
    port: 8888
    description: Public address of the web page.
healthcheck:
  service: vernemq
  port: 8888
  path: /health
