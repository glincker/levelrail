services:
  pairdrop:
    image: lscr.io/linuxserver/pairdrop:1.11.2
    ports: ["3000"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      RATE_LIMIT: ${RATE_LIMIT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 10s
      retries: 5
