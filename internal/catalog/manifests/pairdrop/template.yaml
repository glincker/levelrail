id: pairdrop
name: PairDrop
description: An AirDrop-style app for sending files and messages between devices on the same network, from any browser.
icon: share
category: Productivity
documentation_url: https://github.com/schlagmichdoch/PairDrop
recommended_memory_bytes: 268435456
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for the server's logs.
    default: Etc/UTC
  - key: RATE_LIMIT
    label: Rate limit
    description: Set to true when the app sits behind a proxy that should throttle clients.
    default: "false"
domains:
  - service: pairdrop
    port: 3000
    description: Public address devices open to pair.
healthcheck:
  service: pairdrop
  port: 3000
  path: /
