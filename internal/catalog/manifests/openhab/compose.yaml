services:
  openhab:
    image: openhab/openhab:5.2.4
    ports: ["8080"]
    environment:
      OPENHAB_HTTP_PORT: "8080"
      CRYPTO_POLICY: "unlimited"
    volumes:
      - conf:/openhab/conf
      - userdata:/openhab/userdata
      - addons:/openhab/addons
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
