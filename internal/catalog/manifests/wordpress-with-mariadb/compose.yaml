# Converted from an upstream template catalog (see source in template.yaml).
services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_USER: ${WORDPRESS_USER}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      timeout: 20s
  wordpress:
    image: wordpress:latest
    ports:
      - "80"
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_PASSWORD}
      WORDPRESS_DB_USER: ${WORDPRESS_USER}
    volumes:
      - wordpress-files:/var/www/html
    depends_on:
      - mariadb
    healthcheck:
      interval: 2s
      retries: 10
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1
      timeout: 10s
