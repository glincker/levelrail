services:
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    ports: ["9200"]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: $SERVICE_PASSWORD_OPENSEARCH
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "false"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "s=https; test \"$(curl -sk -u admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD -o /dev/null -w %{http_code} $s://127.0.0.1:9200/_cluster/health)\" = 200"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
