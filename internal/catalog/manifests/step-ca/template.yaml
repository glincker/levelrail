id: step-ca
name: Step CA
description: A private certificate authority that issues and renews TLS and SSH certificates over ACME or a CLI. Apache-2.0 licensed. The CA password is generated for you and shown in the deployment variables.
icon: shield
category: Security
documentation_url: https://github.com/smallstep/certificates
source_repo: https://github.com/smallstep/certificates
license: Apache-2.0
license_class: permissive
license_url: https://github.com/smallstep/certificates/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Read the root certificate fingerprint from the deployment logs, then bootstrap clients with step ca bootstrap.
domains:
  - service: step-ca
    port: 9000
    description: Public address of Step CA.
healthcheck:
  service: step-ca
  port: 9000
  path: /
