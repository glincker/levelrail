id: manyfold
name: Manyfold
description: A self-hosted manager for 3D printing model libraries with tags, previews and sharing, backed by Postgres and Redis. Create the first admin on first open.
icon: cube
category: Media
documentation_url: https://manyfold.app/get-started/docker
source_repo: https://github.com/manyfold3d/manyfold
license: MIT
license_class: permissive
license_url: https://github.com/manyfold3d/manyfold/blob/HEAD/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 805306368
first_run:
  - Open the page and create the first admin account, then add a library path.
env:
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled database. Generated once and reused on every redeploy.
    generate: password
    length: 32
    secret: true
  - key: SECRET_KEY_BASE
    label: Secret key base
    description: Signs sessions. Changing it signs every user out.
    generate: hex
    length: 64
    secret: true
domains:
  - service: manyfold
    port: 3214
    description: Public address of Manyfold.
healthcheck:
  service: manyfold
  port: 3214
  path: /
