services:
  ackee:
    image: electerious/ackee:3.7.1
    ports: ["3000"]
    environment:
      ACKEE_MONGODB: mongodb://mongo:27017/ackee
      ACKEE_USERNAME: ${ACKEE_USERNAME}
      ACKEE_PASSWORD: $SERVICE_PASSWORD_ACKEEADMIN
      ACKEE_TRACKER: tracker
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s
  mongo:
    image: mongo:7.0.45
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
