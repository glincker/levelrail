services:
  evcc:
    image: evcc/evcc:0.319.0
    ports: ["7070"]
    environment:
      TZ: ${TZ}
    volumes:
      - data:/root/.evcc
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7070"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
