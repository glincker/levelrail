services:
  snappymail:
    image: djmaze/snappymail:v3.0.1.1
    ports: ["8888"]
    environment:
      TZ: ${TZ}
    volumes:
      - data:/snappymail/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
