id: snappymail
name: SnappyMail
description: A fast, light webmail client that connects to your IMAP and SMTP servers.
icon: envelope
category: Mail
documentation_url: https://snappymail.eu/
source_repo: https://github.com/the-djmaze/snappymail
license: AGPL-3.0-only
license_class: network-copyleft
license_url: https://github.com/the-djmaze/snappymail/blob/HEAD/LICENSE
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - The admin panel is at /?admin and its generated password is in the data volume under _data_/_default_/admin_password.txt.
env:
  - key: TZ
    label: Time zone
    description: IANA time zone for logs and schedules.
    default: Etc/UTC
domains:
  - service: snappymail
    port: 8888
    description: Public address of SnappyMail.
healthcheck:
  service: snappymail
  port: 8888
  path: /
