services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:0.8.3
    ports: ["8090"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
      - comics:/comics
      - downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8090/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
