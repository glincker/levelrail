# Converted from an upstream template catalog (see source in template.yaml).
services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: uptime-kuma-db
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_USER: ${MARIADB_USER}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      timeout: 20s
  uptime-kuma:
    image: louislam/uptime-kuma:2
    ports:
      - "3001"
    environment:
      TZ: Etc/UTC
    volumes:
      - uptime-kuma-data:/app/data
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - extra/healthcheck
      timeout: 5s
