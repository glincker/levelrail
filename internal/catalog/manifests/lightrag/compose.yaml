services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.5.7
    ports: ["9621"]
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY}
      LLM_BINDING: ${LLM_BINDING}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY}
      EMBEDDING_BINDING: ${LLM_BINDING}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      EMBEDDING_BINDING_HOST: ${LLM_BINDING_HOST}
      EMBEDDING_BINDING_API_KEY: ${LLM_BINDING_API_KEY}
    volumes:
      - rag:/app/data/rag_storage
      - inputs:/app/data/inputs
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /health
      port: 9621
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
