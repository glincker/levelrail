services:
  ocis:
    image: owncloud/ocis:8.2.3
    ports: ["9200"]
    entrypoint: ["sh", "-c", "ocis init || true; exec ocis server"]
    environment:
      OCIS_INSECURE: true
      PROXY_TLS: false
      PROXY_HTTP_ADDR: 0.0.0.0:9200
      OCIS_URL: ${OCIS_PUBLIC_URL}
      IDM_ADMIN_PASSWORD: ${OCIS_ADMIN_PASSWORD}
    volumes:
      - config:/etc/ocis
      - data:/var/lib/ocis
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 9200
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
