services:
  deluge:
    image: lscr.io/linuxserver/deluge:2.2.0
    ports: ["8112"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
      - downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8112/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
