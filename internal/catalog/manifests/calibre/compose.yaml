services:
  calibre:
    image: lscr.io/linuxserver/calibre:9.18.0
    ports: ["8080"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
