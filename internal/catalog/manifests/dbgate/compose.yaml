services:
  dbgate:
    image: dbgate/dbgate:7.3.4-alpine
    ports: ["3000"]
    environment:
      LOGIN: admin
      PASSWORD: $SERVICE_PASSWORD_DBGATE
    volumes:
      - dbgate_data:/root/.dbgate
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
