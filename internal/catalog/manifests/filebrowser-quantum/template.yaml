id: filebrowser-quantum
name: FileBrowser Quantum
description: A web file manager with a fast index, search, sharing links and per-user access. Apache-2.0 fork of FileBrowser. Runs in one container; the admin password is generated and shown in the service environment settings.
icon: file
category: Storage
documentation_url: https://github.com/gtsteffaniak/filebrowser/wiki
source_repo: https://github.com/gtsteffaniak/filebrowser
license: Apache-2.0
license_class: permissive
license_url: https://github.com/gtsteffaniak/filebrowser/blob/main/LICENSE
hosted_use: unknown
listing:
  by: community
status: active
recommended_memory_bytes: 134217728
first_run:
  - Sign in as admin with the generated password from the service environment settings.
domains:
  - service: filebrowser
    port: 80
    description: Public address of FileBrowser Quantum.
healthcheck:
  service: filebrowser
  port: 80
  path: /
