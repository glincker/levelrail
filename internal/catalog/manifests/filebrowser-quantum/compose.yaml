services:
  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0.2-stable
    ports: ["80"]
    environment:
      FILEBROWSER_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
    volumes:
      - data:/home/filebrowser/data
      - files:/srv
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
