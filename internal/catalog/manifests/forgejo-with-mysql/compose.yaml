# Converted from an upstream template catalog (see source in template.yaml).
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    ports:
      - "3000"
    environment:
      FORGEJO__database__DB_TYPE: mysql
      FORGEJO__database__HOST: mysql
      FORGEJO__database__NAME: ${MYSQL_DATABASE}
      FORGEJO__database__PASSWD: ${MYSQL_PASSWORD}
      FORGEJO__database__USER: ${MYSQL_USER}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "false"
      FORGEJO__migrations__ALLOWED_DOMAINS: ${FORGEJO__MIGRATIONS__ALLOWED_DOMAINS}
      FORGEJO__server__ROOT_URL: ${SERVICE_URL_FORGEJO}
      USER_GID: "1000"
      USER_UID: "1000"
    volumes:
      - forgejo-data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      interval: 2s
      retries: 15
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000
      timeout: 10s
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQLROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - forgejo-mysql-data:/var/lib/mysql
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
      timeout: 20s
