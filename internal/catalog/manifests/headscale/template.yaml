id: headscale
name: Headscale
description: "Self-hosted Tailscale control server, configured entirely through environment variables. Embedded DERP and STUN are off (the platform has no UDP), so clients relay through the public Tailscale DERP map over HTTPS. Create users and pre-auth keys with the CLI in the container (headscale users create, headscale preauthkeys create)."
icon: network
category: Infrastructure
documentation_url: https://headscale.net/stable/
recommended_memory_bytes: 268435456
domains:
  - service: headscale
    port: 8080
    description: Public address clients use as their login server (server_url).
healthcheck:
  service: headscale
  port: 8080
  path: /health
