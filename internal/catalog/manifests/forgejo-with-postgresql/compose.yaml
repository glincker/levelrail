# Converted from an upstream template catalog (see source in template.yaml).
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15
    ports:
      - "3000"
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgresql
      FORGEJO__database__NAME: ${POSTGRESQL_DATABASE}
      FORGEJO__database__PASSWD: ${POSTGRESQL_PASSWORD}
      FORGEJO__database__USER: ${POSTGRESQL_USER}
      FORGEJO__migrations__ALLOW_LOCALNETWORKS: "false"
      FORGEJO__migrations__ALLOWED_DOMAINS: ${FORGEJO__MIGRATIONS__ALLOWED_DOMAINS}
      FORGEJO__server__ROOT_URL: ${SERVICE_URL_FORGEJO}
      USER_GID: "1000"
      USER_UID: "1000"
    volumes:
      - forgejo-data:/data
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      interval: 2s
      retries: 15
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:3000
      timeout: 10s
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_USER: ${POSTGRESQL_USER}
    volumes:
      - forgejo-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
      timeout: 20s
