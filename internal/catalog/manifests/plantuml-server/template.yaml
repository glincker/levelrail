id: plantuml-server
name: PlantUML Server
description: Turns PlantUML text into UML diagrams as images over HTTP. It has no database and no login, so restrict who can reach it.
icon: tree-structure
category: Developer Tools
documentation_url: https://github.com/plantuml/plantuml-server
source_repo: https://github.com/plantuml/plantuml-server
license: GPL-3.0
license_class: copyleft
license_url: https://github.com/plantuml/plantuml-server/blob/master/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 536870912
domains:
  - service: plantuml-server
    port: 8080
    description: Public address of PlantUML Server.
healthcheck:
  service: plantuml-server
  port: 8080
  path: /
