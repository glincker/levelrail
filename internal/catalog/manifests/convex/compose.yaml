# Converted from an upstream template catalog (see source in template.yaml).
services:
  backend:
    image: ghcr.io/get-convex/convex-backend:a9a760ca10399ed42e1b4bb87c78539a235488c7
    ports:
      - "3210"
    environment:
      ACTIONS_USER_TIMEOUT_SECS: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_REGION: ""
      AWS_S3_DISABLE_CHECKSUMS: ""
      AWS_S3_DISABLE_SSE: ""
      AWS_S3_FORCE_PATH_STYLE: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      CONVEX_CLOUD_ORIGIN: ${SERVICE_URL_BACKEND}
      CONVEX_RELEASE_VERSION_DEV: ""
      CONVEX_SITE_ORIGIN: ${SERVICE_URL_BACKEND}
      DATABASE_URL: ""
      DISABLE_BEACON: ${DISABLE_BEACON}
      DO_NOT_REQUIRE_SSL: ${DO_NOT_REQUIRE_SSL}
      INSTANCE_NAME: self-hosted-convex
      INSTANCE_SECRET: ${SECRET_HEX}
      MYSQL_URL: ""
      POSTGRES_URL: ""
      REDACT_LOGS_TO_CLIENT: ${REDACT_LOGS_TO_CLIENT}
      RUST_BACKTRACE: ""
      RUST_LOG: info
      S3_ENDPOINT_URL: ""
      S3_STORAGE_EXPORTS_BUCKET: ""
      S3_STORAGE_FILES_BUCKET: ""
      S3_STORAGE_MODULES_BUCKET: ""
      S3_STORAGE_SEARCH_BUCKET: ""
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ""
    volumes:
      - data:/convex/data
    healthcheck:
      interval: 5s
      start_period: 10s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:3210/version
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:a9a760ca10399ed42e1b4bb87c78539a235488c7
    ports:
      - "6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${SERVICE_URL_BACKEND}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      interval: 5s
      start_period: 5s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:6791/
