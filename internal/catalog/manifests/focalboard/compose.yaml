services:
  focalboard:
    image: mattermost/focalboard:7.11.4
    ports: ["8000"]
    volumes:
      - data:/opt/focalboard/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/ || wget -q -O /dev/null http://127.0.0.1:8000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
