services:
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports: ["8080"]
    volumes:
      - mappings:/home/wiremock
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
