id: openclaw
name: OpenClaw
description: A self-hosted personal AI agent gateway that connects chat apps and tools to the model provider you choose. Recommended container limit is 2 GiB. Measured use is 0.9 to 1.3 GiB, so a Levelrail VM needs at least 4096 MiB. The gateway trusts the ingress proxy through gateway.trustedProxies, written once to openclaw.json in the data volume.
icon: plug
category: AI
documentation_url: https://docs.openclaw.ai/install
source_repo: https://github.com/openclaw/openclaw
license: MIT
license_class: permissive
license_url: https://github.com/openclaw/openclaw/blob/main/LICENSE
recommended_memory_bytes: 2147483648
first_run:
  - Open the app address, then paste the generated gateway token (OPENCLAW_GATEWAY_TOKEN in the deployment variables) to sign in.
env:
  - key: TRUSTED_PROXY_CIDR
    label: Trusted proxy network
    description: Network the ingress proxy connects from, written to gateway.trustedProxies on first start. Keep it equal to APP_NETWORK_POOL (172.30.0.0/15 in the desktop VM, 10.88.0.0/14 on a default server). Never use 0.0.0.0/0.
    default: 172.30.0.0/15
domains:
  - service: openclaw-gateway
    port: 18789
    description: Public address of the OpenClaw gateway.
healthcheck:
  service: openclaw-gateway
  port: 18789
  kind: tcp
status: active
listing:
  by: community
