id: freshrss-with-postgresql
name: Freshrss With Postgresql
description: A free, self-hostable feed aggregator.
icon: check-square
category: Productivity
documentation_url: https://freshrss.org/index.html
recommended_memory_bytes: 536870912
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/freshrss-with-postgresql.yaml
images:
  - service: freshrss
    image: freshrss/freshrss:latest
  - service: freshrss-db
    image: postgres:16
env:
  - key: POSTGRESQL_USER
    label: Postgresql User
    description: Generated when the app is installed.
    generate: user
  - key: POSTGRESQL_PASSWORD
    label: Postgresql Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: freshrss
    port: 80
    description: Public address of freshrss.
healthcheck:
  service: freshrss
  port: 80
  path: /
