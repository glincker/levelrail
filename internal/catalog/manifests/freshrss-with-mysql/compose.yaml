# Converted from an upstream template catalog (see source in template.yaml).
services:
  freshrss:
    image: freshrss/freshrss:latest
    ports:
      - "80"
    environment:
      CRON_MIN: 1,31
      MYSQL_DB: freshrss
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - freshrss-data:/var/www/FreshRSS/data
      - freshrss-extensions:/var/www/FreshRSS/extensions
    depends_on:
      freshrss-db:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:80/
      timeout: 20s
  freshrss-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: freshrss
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
      timeout: 20s
