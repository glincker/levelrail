services:
  pushgateway:
    image: prom/pushgateway:v1.11.4
    command: ["--persistence.file=/data/metrics.db"]
    ports: ["9091"]
    volumes:
      - pushgateway_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
