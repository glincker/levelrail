id: owncloud
name: ownCloud
description: The classic self-hosted file sync and share platform, with MariaDB and Redis for metadata and locking.
icon: cloud
category: Storage
documentation_url: https://doc.owncloud.com/server/
recommended_memory_bytes: 1073741824
env:
  - key: OWNCLOUD_DOMAIN
    label: Public host
    description: Host name ownCloud accepts requests for, without a scheme.
    default: localhost
  - key: ADMIN_USERNAME
    label: Admin user
    description: Name of the first admin account.
    default: admin
  - key: ADMIN_PASSWORD
    label: Admin password
    description: Password for the first admin account.
    generate: password
    length: 32
    secret: true
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled MariaDB user.
    generate: password
    length: 32
    secret: true
  - key: DB_ROOT_PASSWORD
    label: Database root password
    description: Root password for the bundled MariaDB.
    generate: password
    length: 32
    secret: true
domains:
  - service: owncloud
    port: 8080
    description: Public address of ownCloud.
healthcheck:
  service: owncloud
  port: 8080
  path: /status.php
