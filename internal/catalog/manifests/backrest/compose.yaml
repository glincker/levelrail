services:
  backrest:
    image: garethgeorge/backrest:v1.14.1
    ports: ["9898"]
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
    volumes:
      - data:/data
      - config:/config
      - cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9898/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
