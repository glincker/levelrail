services:
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.3.1
    ports: ["4430"]
    environment:
      DYNAMIC_CONFIG: "true"
      HOSTNAME: ${MESH_HOSTNAME}
      PORT: "4430"
      TLS_OFFLOAD: "true"
      REVERSE_PROXY: ${MESH_HOSTNAME}
      REVERSE_PROXY_TLS_PORT: "443"
      ALLOW_NEW_ACCOUNTS: "true"
    volumes:
      - data:/opt/meshcentral/meshcentral-data
      - files:/opt/meshcentral/meshcentral-files
      - web:/opt/meshcentral/meshcentral-web
      - backups:/opt/meshcentral/meshcentral-backups
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:4430/ || wget -q -O /dev/null http://127.0.0.1:4430/"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 60s
