id: sqlpad
name: SQLPad
description: Web based SQL editor for running queries against many databases, with saved queries, charts and sharing. The admin account is created from the install form.
icon: database
category: Database Tools
documentation_url: https://getsqlpad.com/
source_repo: https://github.com/sqlpad/sqlpad
license: MIT
license_class: permissive
license_url: https://github.com/sqlpad/sqlpad/blob/HEAD/LICENSE
hosted_use: allowed
listing:
  by: community
status: active
recommended_memory_bytes: 268435456
first_run:
  - Sign in with the admin email and the generated password shown in the deployment variables, then add a connection to your database.
env:
  - key: SQLPAD_ADMIN_EMAIL
    label: Admin email
    description: Email address for the first admin account.
    default: admin@example.com
  - key: SQLPAD_ADMIN_PASSWORD
    label: Admin password
    description: Password for the first admin account.
    generate: password
    length: 24
    secret: true
domains:
  - service: sqlpad
    port: 3000
    description: Public address of the SQL editor.
healthcheck:
  service: sqlpad
  port: 3000
  path: /
