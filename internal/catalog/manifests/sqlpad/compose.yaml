services:
  sqlpad:
    image: sqlpad/sqlpad:7.5.7
    ports: ["3000"]
    environment:
      SQLPAD_ADMIN: ${SQLPAD_ADMIN_EMAIL}
      SQLPAD_ADMIN_PASSWORD: ${SQLPAD_ADMIN_PASSWORD}
      SQLPAD_DB_PATH: /var/lib/sqlpad
      SQLPAD_APP_LOG_LEVEL: warn
    volumes:
      - data:/var/lib/sqlpad
    healthcheck:
      test: ["NONE"]
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 3000
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 20s
