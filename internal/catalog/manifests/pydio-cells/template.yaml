id: pydio-cells
name: Pydio Cells
description: High-performance large file sharing, native no-code automation, and a collaboration-centric architecture that simplifies access control without compromising security or compliance.
icon: hard-drives
category: Storage
documentation_url: https://docs.pydio.com/
recommended_memory_bytes: 536870912
source:
  name: coolify
  url: https://github.com/coollabsio/coolify
  license: Apache-2.0
  path: templates/compose/pydio-cells.yml
images:
  - service: cells
    image: pydio/cells:4.4
  - service: mariadb
    image: mariadb:11
env:
  - key: MYSQLROOT_PASSWORD
    label: Mysqlroot Password
    description: Generated when the app is installed.
    generate: password
    secret: true
  - key: MYSQL_USER
    label: Mysql User
    description: Generated when the app is installed.
    generate: user
  - key: MYSQL_PASSWORD
    label: Mysql Password
    description: Generated when the app is installed.
    generate: password
    secret: true
domains:
  - service: cells
    port: 8080
    description: Public address of cells.
healthcheck:
  service: cells
  port: 8080
  path: /
