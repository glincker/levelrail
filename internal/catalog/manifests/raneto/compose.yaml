services:
  raneto:
    image: lscr.io/linuxserver/raneto:0.18.1
    ports: ["3000"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
    volumes:
      - config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s
