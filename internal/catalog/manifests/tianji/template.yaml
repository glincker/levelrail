id: tianji
name: Tianji
description: An all-in-one insight hub that combines website analytics, uptime monitoring and server status in one dashboard.
icon: chart
category: Analytics
documentation_url: https://tianji.dev/docs/intro
source_repo: https://github.com/msgbyte/tianji
license: Apache-2.0
license_class: permissive
license_url: https://github.com/msgbyte/tianji/blob/master/LICENSE
recommended_memory_bytes: 536870912
env:
  - key: DB_PASSWORD
    label: Database password
    description: Password for the bundled Postgres database.
    generate: password
    length: 32
    secret: true
  - key: JWT_SECRET
    label: JWT secret
    description: Signs login tokens. Changing it signs every user out.
    generate: hex
    length: 64
    secret: true
domains:
  - service: tianji
    port: 12345
    description: Public address of Tianji.
healthcheck:
  service: tianji
  port: 12345
  path: /
