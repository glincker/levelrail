services:
  nginx-ui:
    image: uozi/nginx-ui:v3.0.1
    ports: ["80"]
    volumes:
      - nginx_config:/etc/nginx
      - ui_config:/etc/nginx-ui
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
