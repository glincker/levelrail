id: heyform
name: HeyForm
description: A form builder for surveys, quizzes and lead capture, with conversational forms and a MongoDB backend.
icon: clipboard
category: Productivity
documentation_url: https://docs.heyform.net/open-source/installation
source_repo: https://github.com/heyform/heyform
license: AGPL-3.0-only
license_class: network-copyleft
license_url: https://github.com/heyform/heyform/blob/next/LICENSE
recommended_memory_bytes: 805306368
env:
  - key: SESSION_KEY
    label: Session key
    description: Signs login sessions. Changing it signs every user out.
    generate: hex
    length: 64
    secret: true
  - key: FORM_ENCRYPTION_KEY
    label: Form encryption key
    description: Encrypts stored form data. Keep it stable or existing submissions become unreadable.
    generate: hex
    length: 64
    secret: true
  - key: REDIS_PASSWORD
    label: Redis password
    description: Password for the bundled Redis cache.
    generate: password
    length: 32
    secret: true
domains:
  - service: heyform
    port: 9157
    description: Public address of HeyForm.
healthcheck:
  service: heyform
  port: 9157
  path: /
