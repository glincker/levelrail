id: openclaw
name: OpenClaw
slogan: A self-hosted personal AI agent gateway that connects chat apps and tools to the model provider you choose.
category: AI
documentation_url: https://docs.openclaw.ai/install
recommended_memory_bytes: 2147483648
compose: |
  services:
    openclaw-gateway:
      image: ghcr.io/openclaw/openclaw:2026.10.5
      x-levelrail-strategy: recreate
      x-levelrail-strategy-reason: The gateway locks its state volume, so the old container must stop before the new one starts (brief downtime on each deploy).
      command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789", "--allow-unconfigured"]
      ports: ["18789:18789"]
      environment:
        OPENCLAW_GATEWAY_TOKEN: $SERVICE_HEX_32_GATEWAYTOKEN
        OPENCLAW_GATEWAY_PORT: "18789"
        OPENCLAW_STATE_DIR: /home/node/.openclaw
        OPENCLAW_CONFIG_DIR: /home/node/.openclaw
        OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
        TZ: UTC
      volumes:
        - openclaw_data:/home/node/.openclaw
      healthcheck:
        test: ["CMD", "node", "dist/docker-healthcheck.js"]
        interval: 30s
        timeout: 5s
        retries: 5
        start_period: 20s
