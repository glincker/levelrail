version: 1
kind: Project
metadata: {name: shop}
spec:
  env:
    REGION: eu
---
version: 1
kind: App
metadata: {name: web}
spec:
  project: shop
  service:
    build: {type: image, image: "ghcr.io/acme/web:1.2.3"}
    port: 3000
    domains: [app.example.com]
    resources: {memory: 512Mi, cpu: 0.5}
    replicas: 2
    env:
      LOG_LEVEL: info
      API_KEY: {secretRef: API_KEY}
