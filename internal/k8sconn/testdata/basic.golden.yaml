apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        app.kubernetes.io/managed-by: levelrail
        levelrail.dev/app: whoami
    name: whoami
    namespace: apps
spec:
    replicas: 2
    selector:
        matchLabels:
            levelrail.dev/app: whoami
    template:
        metadata:
            labels:
                app.kubernetes.io/managed-by: levelrail
                levelrail.dev/app: whoami
        spec:
            automountServiceAccountToken: false
            containers:
                - env:
                    - name: A
                      value: "1"
                    - name: B
                      value: "2"
                  image: traefik/whoami:v1.10
                  name: whoami
                  ports:
                    - containerPort: 80
                      name: http
                  resources:
                    limits:
                        cpu: 500m
                        memory: 256Mi
                    requests:
                        cpu: 50m
                        memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                            - ALL
                    privileged: false
                    runAsNonRoot: true
                    runAsUser: 10001
                    seccompProfile:
                        type: RuntimeDefault
            hostNetwork: false
---
apiVersion: v1
kind: Service
metadata:
    labels:
        app.kubernetes.io/managed-by: levelrail
        levelrail.dev/app: whoami
    name: whoami
    namespace: apps
spec:
    ports:
        - name: http
          port: 80
          protocol: TCP
          targetPort: http
    selector:
        levelrail.dev/app: whoami
    type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    labels:
        app.kubernetes.io/managed-by: levelrail
        levelrail.dev/app: whoami
    name: whoami
    namespace: apps
spec:
    ingressClassName: traefik
    rules:
        - host: whoami.example.com
          http:
            paths:
                - backend:
                    service:
                        name: whoami
                        port:
                            name: http
                  path: /
                  pathType: Prefix
