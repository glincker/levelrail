apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      selector:
        matchLabels:
          app: api
      template:
        metadata:
          labels:
            app: api
        spec:
          initContainers:
            - name: wait
              image: busybox
          containers:
            - name: api
              image: example/api:3
              ports:
                - containerPort: 8080
            - name: proxy
              image: example/proxy:1
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: api
    spec: {}
