version: 1
services:
  web:
    build:
      type: railpack
    port: 3000
    resources:
      memory: 1024Mi
    jobs:
      - name: api-cron-daily
        schedule: 0 5 * * *
        command:
          - curl
          - -fsS
          - http://127.0.0.1:3000/api/cron/daily
        timezone: UTC
        mode: exec
      - name: api-cron-daily-2
        schedule: 0 6 * * *
        command:
          - curl
          - -fsS
          - http://127.0.0.1:3000/api/cron/daily?full=1
        timezone: UTC
        mode: exec
