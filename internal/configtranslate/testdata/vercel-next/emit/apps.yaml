version: 1
kind: App
metadata:
  name: web
spec:
  project: shop
  environment: production
  service:
    build:
      type: image
      image: registry.example.com/acme/web:latest
    port: 3000
    resources:
      memory: 1024Mi
    jobs:
      - name: api-cron-daily
        schedule: 0 5 * * *
        command: [sh, -c, "u=\"$1\"\nif command -v curl >/dev/null 2>&1; then\n  if [ -n \"$CRON_SECRET\" ]; then exec curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" \"$u\"; fi\n  exec curl -fsS \"$u\"\nfi\nif command -v wget >/dev/null 2>&1; then\n  if [ -n \"$CRON_SECRET\" ]; then exec wget -q -O- --header=\"Authorization: Bearer $CRON_SECRET\" \"$u\"; fi\n  exec wget -q -O- \"$u\"\nfi\nif command -v node >/dev/null 2>&1; then\n  exec node -e 'const h={};if(process.env.CRON_SECRET)h.authorization=\"Bearer \"+process.env.CRON_SECRET;fetch(process.argv[1],{headers:h}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))' \"$u\"\nfi\necho \"cron call needs curl, wget or node in the image\" >&2\nexit 127", cron, 'http://127.0.0.1:3000/api/cron/daily']
        mode: exec
        timezone: UTC
      - name: api-cron-daily-2
        schedule: 0 6 * * *
        command: [sh, -c, "u=\"$1\"\nif command -v curl >/dev/null 2>&1; then\n  if [ -n \"$CRON_SECRET\" ]; then exec curl -fsS -H \"Authorization: Bearer $CRON_SECRET\" \"$u\"; fi\n  exec curl -fsS \"$u\"\nfi\nif command -v wget >/dev/null 2>&1; then\n  if [ -n \"$CRON_SECRET\" ]; then exec wget -q -O- --header=\"Authorization: Bearer $CRON_SECRET\" \"$u\"; fi\n  exec wget -q -O- \"$u\"\nfi\nif command -v node >/dev/null 2>&1; then\n  exec node -e 'const h={};if(process.env.CRON_SECRET)h.authorization=\"Bearer \"+process.env.CRON_SECRET;fetch(process.argv[1],{headers:h}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))' \"$u\"\nfi\necho \"cron call needs curl, wget or node in the image\" >&2\nexit 127", cron, 'http://127.0.0.1:3000/api/cron/daily?full=1']
        mode: exec
        timezone: UTC
