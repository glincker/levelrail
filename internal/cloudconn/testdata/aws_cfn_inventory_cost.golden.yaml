AWSTemplateFormatVersion: "2010-09-09"
Description: "Levelrail access role (inventory, cost)"
Parameters:
  TrustedPrincipalArn:
    Type: String
    Default: "arn:aws:iam::210987654321:role/levelrail-control"
    Description: The Levelrail identity allowed to assume the role.
  ExternalId:
    Type: String
    Default: "ext-123456"
    Description: Per account value Levelrail must present when assuming the role.
Resources:
  BoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: "LevelrailAccess-boundary"
      PolicyDocument:
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "Verify1",
              "Effect": "Allow",
              "Action": [
                "iam:SimulatePrincipalPolicy",
                "iam:ListAttachedRolePolicies"
              ],
              "Resource": [
                "arn:*:iam::*:role/LevelrailAccess"
              ]
            },
            {
              "Sid": "Inventory1",
              "Effect": "Allow",
              "Action": [
                "ec2:DescribeInstances",
                "ec2:DescribeInstanceTypes",
                "ec2:DescribeImages",
                "ec2:DescribeVpcs",
                "ec2:DescribeSubnets",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeVolumes",
                "ec2:DescribeSnapshots",
                "ec2:DescribeAddresses",
                "ec2:DescribeKeyPairs",
                "ec2:DescribeAvailabilityZones"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ]
                }
              }
            },
            {
              "Sid": "Inventory2",
              "Effect": "Allow",
              "Action": [
                "ec2:DescribeRegions",
                "tag:GetResources"
              ],
              "Resource": [
                "*"
              ]
            },
            {
              "Sid": "Deploy1",
              "Effect": "Allow",
              "Action": [
                "ec2:RunInstances",
                "ec2:CreateVolume",
                "ec2:CreateSecurityGroup",
                "ec2:CreateKeyPair",
                "ec2:AllocateAddress"
              ],
              "Resource": [
                "arn:*:ec2:*:*:instance/*",
                "arn:*:ec2:*:*:volume/*",
                "arn:*:ec2:*:*:security-group/*",
                "arn:*:ec2:*:*:key-pair/*",
                "arn:*:ec2:*:*:elastic-ip/*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/levelrail:managed": [
                    "true"
                  ],
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ]
                }
              }
            },
            {
              "Sid": "Deploy2",
              "Effect": "Allow",
              "Action": [
                "ec2:RunInstances"
              ],
              "Resource": [
                "arn:*:ec2:*::image/*",
                "arn:*:ec2:*:*:subnet/*",
                "arn:*:ec2:*:*:network-interface/*",
                "arn:*:ec2:*:*:security-group/*",
                "arn:*:ec2:*:*:key-pair/*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ]
                }
              }
            },
            {
              "Sid": "Deploy3",
              "Effect": "Allow",
              "Action": [
                "ec2:StartInstances",
                "ec2:StopInstances",
                "ec2:RebootInstances",
                "ec2:ModifyInstanceAttribute",
                "ec2:AttachVolume",
                "ec2:AssociateAddress",
                "ec2:AuthorizeSecurityGroupIngress",
                "ec2:AuthorizeSecurityGroupEgress",
                "ec2:RevokeSecurityGroupIngress",
                "ec2:RevokeSecurityGroupEgress"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ],
                  "aws:ResourceTag/levelrail:managed": [
                    "true"
                  ]
                }
              }
            },
            {
              "Sid": "Deploy4",
              "Effect": "Allow",
              "Action": [
                "ec2:CreateTags"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ],
                  "ec2:CreateAction": [
                    "RunInstances",
                    "CreateVolume",
                    "CreateSecurityGroup",
                    "CreateKeyPair",
                    "AllocateAddress",
                    "CreateSnapshot",
                    "CreateSnapshots"
                  ]
                }
              }
            },
            {
              "Sid": "Deploy5",
              "Effect": "Allow",
              "Action": [
                "ec2:CreateSnapshot",
                "ec2:CreateSnapshots"
              ],
              "Resource": [
                "arn:*:ec2:*::snapshot/*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/levelrail:managed": [
                    "true"
                  ],
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ]
                }
              }
            },
            {
              "Sid": "Deploy6",
              "Effect": "Allow",
              "Action": [
                "ec2:CreateSnapshot",
                "ec2:CreateSnapshots"
              ],
              "Resource": [
                "arn:*:ec2:*:*:volume/*",
                "arn:*:ec2:*:*:instance/*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ],
                  "aws:ResourceTag/levelrail:managed": [
                    "true"
                  ]
                }
              }
            },
            {
              "Sid": "Deploy20",
              "Effect": "Allow",
              "Action": [
                "kms:DescribeKey"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ]
                }
              }
            },
            {
              "Sid": "Cost1",
              "Effect": "Allow",
              "Action": [
                "ce:GetCostAndUsage",
                "ce:GetCostForecast",
                "ce:GetDimensionValues",
                "ce:GetTags",
                "budgets:ViewBudget"
              ],
              "Resource": [
                "*"
              ]
            },
            {
              "Sid": "S31",
              "Effect": "Allow",
              "Action": [
                "s3:ListAllMyBuckets"
              ],
              "Resource": [
                "*"
              ]
            },
            {
              "Sid": "S32",
              "Effect": "Allow",
              "Action": [
                "s3:CreateBucket",
                "s3:TagResource"
              ],
              "Resource": [
                "arn:*:s3:::levelrail-*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestTag/levelrail:managed": [
                    "true"
                  ]
                }
              }
            },
            {
              "Sid": "S33",
              "Effect": "Allow",
              "Action": [
                "s3:ListBucket",
                "s3:GetBucketLocation",
                "s3:GetBucketTagging"
              ],
              "Resource": [
                "arn:*:s3:::levelrail-*"
              ]
            },
            {
              "Sid": "S34",
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:PutObject",
                "s3:AbortMultipartUpload",
                "s3:ListMultipartUploadParts"
              ],
              "Resource": [
                "arn:*:s3:::levelrail-*/*"
              ]
            },
            {
              "Sid": "S35",
              "Effect": "Allow",
              "Action": [
                "s3:UntagResource"
              ],
              "Resource": [
                "arn:*:s3:::levelrail-*"
              ]
            },
            {
              "Sid": "Dns1",
              "Effect": "Allow",
              "Action": [
                "route53:ListHostedZones",
                "route53:ListHostedZonesByName",
                "route53:GetChange"
              ],
              "Resource": [
                "*"
              ]
            },
            {
              "Sid": "Dns2",
              "Effect": "Allow",
              "Action": [
                "route53:GetHostedZone",
                "route53:ListResourceRecordSets",
                "route53:ChangeResourceRecordSets"
              ],
              "Resource": [
                "arn:*:route53:::hostedzone/*"
              ]
            },
            {
              "Sid": "Destructive1",
              "Effect": "Allow",
              "Action": [
                "ec2:TerminateInstances",
                "ec2:DeleteVolume",
                "ec2:DeleteSecurityGroup",
                "ec2:DeleteKeyPair",
                "ec2:ReleaseAddress",
                "ec2:DetachVolume"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ],
                  "aws:ResourceTag/levelrail:managed": [
                    "true"
                  ]
                }
              }
            },
            {
              "Sid": "Destructive2",
              "Effect": "Allow",
              "Action": [
                "s3:DeleteBucket"
              ],
              "Resource": [
                "arn:*:s3:::levelrail-*"
              ]
            },
            {
              "Sid": "Destructive3",
              "Effect": "Allow",
              "Action": [
                "s3:DeleteObject"
              ],
              "Resource": [
                "arn:*:s3:::levelrail-*/*"
              ]
            },
            {
              "Sid": "Destructive4",
              "Effect": "Allow",
              "Action": [
                "route53:DeleteHostedZone"
              ],
              "Resource": [
                "arn:*:route53:::hostedzone/*"
              ]
            },
            {
              "Sid": "Destructive5",
              "Effect": "Allow",
              "Action": [
                "ec2:DeleteSnapshot"
              ],
              "Resource": [
                "arn:*:ec2:*::snapshot/*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ],
                  "aws:ResourceTag/levelrail:managed": [
                    "true"
                  ]
                }
              }
            },
            {
              "Sid": "ManagedServices",
              "Effect": "Allow",
              "Action": [
                "acm:*",
                "cloudtrail:*",
                "cloudwatch:*",
                "ecr:*",
                "elasticache:*",
                "logs:*",
                "rds:*",
                "secretsmanager:*",
                "ssm:*"
              ],
              "Resource": [
                "*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:RequestedRegion": [
                    "eu-west-1",
                    "us-east-1"
                  ]
                }
              }
            },
            {
              "Sid": "ManagedGlobalServices",
              "Effect": "Allow",
              "Action": [
                "cloudfront:*"
              ],
              "Resource": [
                "*"
              ]
            },
            {
              "Sid": "DenyIdentityChanges",
              "Effect": "Deny",
              "Action": [
                "iam:Create*",
                "iam:Delete*",
                "iam:Put*",
                "iam:Attach*",
                "iam:Detach*",
                "iam:Update*",
                "iam:Add*",
                "iam:Remove*",
                "iam:Set*",
                "iam:Tag*",
                "iam:Untag*",
                "iam:Upload*",
                "iam:Enable*",
                "iam:Disable*",
                "organizations:*",
                "account:*"
              ],
              "Resource": [
                "*"
              ]
            },
            {
              "Sid": "DenyExposureChanges",
              "Effect": "Deny",
              "Action": [
                "rds:ModifyDBSnapshotAttribute",
                "rds:ModifyDBClusterSnapshotAttribute",
                "secretsmanager:PutResourcePolicy",
                "ecr:SetRepositoryPolicy",
                "ssm:CreateDocument",
                "ssm:UpdateDocument",
                "ssm:CreateAssociation",
                "cloudtrail:StopLogging",
                "cloudtrail:DeleteTrail",
                "cloudtrail:UpdateTrail",
                "cloudtrail:PutEventSelectors",
                "logs:DeleteLogGroup",
                "logs:PutSubscriptionFilter",
                "cloudfront:UpdateDistribution"
              ],
              "Resource": [
                "*"
              ]
            }
          ]
        }
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "LevelrailAccess"
      MaxSessionDuration: 3600
      PermissionsBoundary: !Ref BoundaryPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
              StringLike:
                sts:RoleSessionName: "levelrail*"
      Policies:
        - PolicyName: levelrail-access
          PolicyDocument:
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "Verify1",
                  "Effect": "Allow",
                  "Action": [
                    "iam:SimulatePrincipalPolicy",
                    "iam:ListAttachedRolePolicies"
                  ],
                  "Resource": [
                    "arn:*:iam::*:role/LevelrailAccess"
                  ]
                },
                {
                  "Sid": "Inventory1",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:DescribeInstances",
                    "ec2:DescribeInstanceTypes",
                    "ec2:DescribeImages",
                    "ec2:DescribeVpcs",
                    "ec2:DescribeSubnets",
                    "ec2:DescribeSecurityGroups",
                    "ec2:DescribeVolumes",
                    "ec2:DescribeSnapshots",
                    "ec2:DescribeAddresses",
                    "ec2:DescribeKeyPairs",
                    "ec2:DescribeAvailabilityZones"
                  ],
                  "Resource": [
                    "*"
                  ],
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": [
                        "eu-west-1",
                        "us-east-1"
                      ]
                    }
                  }
                },
                {
                  "Sid": "Inventory2",
                  "Effect": "Allow",
                  "Action": [
                    "ec2:DescribeRegions",
                    "tag:GetResources"
                  ],
                  "Resource": [
                    "*"
                  ]
                },
                {
                  "Sid": "Inventory3",
                  "Effect": "Allow",
                  "Action": [
                    "rds:DescribeDBInstances",
                    "rds:DescribeDBClusters",
                    "rds:DescribeDBSnapshots",
                    "rds:DescribeDBClusterSnapshots",
                    "rds:DescribeDBParameterGroups",
                    "rds:ListTagsForResource",
                    "elasticache:DescribeCacheClusters",
                    "elasticache:DescribeReplicationGroups",
                    "elasticache:DescribeSnapshots",
                    "elasticache:ListTagsForResource",
                    "ecr:DescribeRepositories",
                    "ecr:ListImages",
                    "acm:ListCertificates",
                    "acm:DescribeCertificate",
                    "ssm:DescribeInstanceInformation",
                    "cloudtrail:LookupEvents",
                    "cloudwatch:GetMetricData",
                    "cloudwatch:ListMetrics",
                    "logs:DescribeLogGroups",
                    "logs:FilterLogEvents"
                  ],
                  "Resource": [
                    "*"
                  ],
                  "Condition": {
                    "StringEquals": {
                      "aws:RequestedRegion": [
                        "eu-west-1",
                        "us-east-1"
                      ]
                    }
                  }
                },
                {
                  "Sid": "Inventory4",
                  "Effect": "Allow",
                  "Action": [
                    "cloudfront:ListDistributions",
                    "cloudfront:GetDistribution",
                    "cloudfront:ListInvalidations"
                  ],
                  "Resource": [
                    "*"
                  ]
                },
                {
                  "Sid": "Cost1",
                  "Effect": "Allow",
                  "Action": [
                    "ce:GetCostAndUsage",
                    "ce:GetCostForecast",
                    "ce:GetDimensionValues",
                    "ce:GetTags",
                    "budgets:ViewBudget"
                  ],
                  "Resource": [
                    "*"
                  ]
                }
              ]
            }
      Tags:
        - Key: "levelrail:managed"
          Value: "true"
Outputs:
  RoleArn:
    Description: Paste this into Levelrail.
    Value: !GetAtt AccessRole.Arn
