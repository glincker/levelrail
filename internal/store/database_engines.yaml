# Registry of managed database engines this control plane can create.
# This is display/identity metadata only (id, label, a sensible default
# version to suggest): what an engine's container actually needs to run
# safely (env vars, data path, whether it requires generated credentials
# at all) is real behavior, not data, and stays Go code in
# internal/reconcile/database/controller.go's own per-engine switch
# case. Adding a row here without a matching reconciler case would
# advertise an engine this control plane cannot actually run, so
# database_engines_test.go's own TestSupportedEngines_MatchReconcilerCases
# cross-checks the two never drift apart.
engines:
  - id: postgres
    label: Postgres
    default_version: "16"
    # Alternate images for common AI/geo/time-series workloads (the gap
    # docs-local/competitor-clones/coolify/bootstrap/helpers/constants.php's
    # DATABASE_DOCKER_IMAGES list covers for Postgres). tag_template's
    # "{version}" is replaced with the requested Postgres version; each
    # image tags itself differently from vanilla postgres, hence a
    # template per variant rather than one shared rule.
    variants:
      - id: pgvector
        label: pgvector
        image: pgvector/pgvector
        tag_template: "pg{version}"
      - id: postgis
        label: PostGIS
        image: postgis/postgis
        tag_template: "{version}-3.4"
      - id: timescaledb
        label: TimescaleDB
        image: timescale/timescaledb
        tag_template: "latest-pg{version}"
  - id: redis
    label: Redis
    default_version: "7"
  - id: mysql
    label: MySQL
    default_version: "8"
  - id: mongodb
    label: MongoDB
    default_version: "7"
  - id: mariadb
    label: MariaDB
    default_version: "11"
  - id: keydb
    label: KeyDB
    default_version: "latest"
  - id: dragonfly
    label: Dragonfly
    default_version: "v1.27.1"
  - id: clickhouse
    label: ClickHouse
    default_version: "24.8"
