version: 1
kind: App
metadata:
  name: {{name}}
spec:
  project: {{name}}
  service:
    build:
      type: image
      image: {{image}}
    port: 3000
    replicas: 1
    health:
      readiness: {path: /healthz}
    env:
      REDIS_URL: {from: {database: queue, field: url}}
      API_TOKEN: {secretRef: API_TOKEN}
---
version: 1
kind: App
metadata:
  name: {{name}}-worker
spec:
  project: {{name}}
  service:
    build:
      type: image
      image: {{image}}
    port: 3001
    replicas: 2
    env:
      WORKER: "1"
      REDIS_URL: {from: {database: queue, field: url}}
      API_TOKEN: {secretRef: API_TOKEN}
