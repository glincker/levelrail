title = "levelrail gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Intentionally public dev-mode fixture tokens and test fixtures"
paths = [
  '''^dev-fixtures\.yml$''',
  '''^scripts/smoke\.sh$''',
  '''_test\.go$''',
  '''^test/fixtures/''',
]

[[allowlists]]
description = "Docs gallery data lists environment variable names only, never values"
paths = [
  '''^docs/\.vitepress/data/templates\.json$''',
]
