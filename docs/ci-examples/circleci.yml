# .circleci/config.yml
# Build, push and deploy by digest with no stored Levelrail token: the job's
# CircleCI OIDC token is swapped for a deploy token that expires after 15 minutes.
# One-time setup on the control plane (IDs are under Organization Settings,
# Project Settings and the context's page):
#   levelrail-cli apps ci trust add my-app --provider circleci \
#     --org-id <ORG_ID> --repo <PROJECT_ID> --ref refs/heads/main --environment <CONTEXT_ID>
# The context named levelrail holds LEVELRAIL_API_URL (the dashboard URL set
# in Settings, not a secret) and is the context the trust requires.
version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:stable
    environment:
      APP: my-app
      IMAGE: ghcr.io/example/my-app
      LEVELRAIL_CLI_INSTALL_DIR: /home/circleci/bin
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push
          command: |
            echo "$REGISTRY_PASSWORD" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker build -t "$IMAGE:$CIRCLE_SHA1" .
            docker push "$IMAGE:$CIRCLE_SHA1"
            docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$CIRCLE_SHA1" > /tmp/pinned-image
      - run:
          name: Deploy and wait for healthy
          command: |
            curl -fsSL https://levelrail.com/install-cli.sh | sh
            export PATH="$LEVELRAIL_CLI_INSTALL_DIR:$PATH"
            LEVELRAIL_ID_TOKEN=$(circleci run oidc get --claims "{\"aud\":\"$LEVELRAIL_API_URL\"}")
            export LEVELRAIL_ID_TOKEN
            LEVELRAIL_TOKEN=$(levelrail-cli apps ci token "$APP" --provider circleci)
            export LEVELRAIL_TOKEN
            levelrail-cli apps deploy "$APP" \
              --image "$(cat /tmp/pinned-image)" \
              --idempotency-key "circle-$CIRCLE_WORKFLOW_ID-$CIRCLE_BUILD_NUM"
            levelrail-cli apps wait "$APP" --timeout 5m

workflows:
  main:
    jobs:
      - deploy:
          context: levelrail
          filters:
            branches:
              only: main
