<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Deploy with Levelrail</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #52525b;
        --border: #d4d4d8;
        --accent: #b45309;
        --btn-bg: #18181b;
        --btn-fg: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #3f3f46;
          --accent: #f59e0b;
          --btn-bg: #fafafa;
          --btn-fg: #18181b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      main {
        width: min(32rem, calc(100vw - 2rem));
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.5rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
      p { margin: 0 0 1rem; color: var(--muted); }
      label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--btn-bg);
        border-radius: 6px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border-color: var(--border);
        margin-left: 0.5rem;
      }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #dl-error { color: #b91c1c; margin: 0.5rem 0 0; }
      @media (prefers-color-scheme: dark) { #dl-error { color: #fca5a5; } }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Deploy with Levelrail</h1>
      <p id="dl-summary"></p>
      <p>
        Enter the address of your own Levelrail server. It is remembered in this
        browser only, and nothing is sent anywhere else. You review everything
        on your server before anything is deployed.
      </p>
      <form id="dl-form" novalidate>
        <label for="dl-server">Your server address</label>
        <input id="dl-server" type="text" inputmode="url" autocomplete="url" placeholder="levelrail.example.com" />
        <p id="dl-error" role="alert" hidden>Enter an http or https address without a username or password.</p>
        <button type="submit">Continue</button>
      </form>
      <div id="dl-saved" hidden>
        <p>Your server: <code id="dl-saved-host"></code></p>
        <button id="dl-go" type="button">Continue</button>
        <button id="dl-change" type="button" class="secondary">Use a different server</button>
      </div>
    </main>
    <script src="/deploy.js"></script>
  </body>
</html>
