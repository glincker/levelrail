name: Levelrail Pages deploy
description: Deploy a folder to a Levelrail Pages site with a site-scoped deploy token.
inputs:
  site:
    description: Name of the Pages site.
    required: true
  dir:
    description: Folder (or .zip) to publish.
    required: false
    default: "."
  server:
    description: Base URL of your Levelrail server, for example https://levelrail.example.com.
    required: true
  token:
    description: Site deploy token from "levelrail pages token create". Store it as a secret.
    required: true
  version:
    description: CLI release tag to install, empty for the latest stable release.
    required: false
    default: ""
outputs:
  url:
    description: Live URL of the deployed site.
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: composite
  steps:
    - name: Install the CLI
      shell: bash
      env:
        LEVELRAIL_VERSION: ${{ inputs.version }}
        LEVELRAIL_CLI_INSTALL_DIR: ${{ runner.temp }}/levelrail-bin
        LEVELRAIL_MODIFY_PATH: "0"
      run: |
        set -euo pipefail
        curl -fsSL https://github.com/glincker/levelrail/releases/latest/download/install-cli.sh | sh
        echo "${LEVELRAIL_CLI_INSTALL_DIR}" >> "$GITHUB_PATH"
    - name: Deploy
      id: deploy
      shell: bash
      env:
        APP_API_URL: ${{ inputs.server }}
        APP_API_TOKEN: ${{ inputs.token }}
        SITE: ${{ inputs.site }}
        DIR: ${{ inputs.dir }}
      run: |
        set -euo pipefail
        echo "::add-mask::${APP_API_TOKEN}"
        out="$(levelrail-cli pages deploy "${DIR}" --name "${SITE}" --json)"
        url="$(printf '%s' "${out}" | sed -n 's/.*"url"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)"
        echo "url=${url}" >> "$GITHUB_OUTPUT"
        echo "Deployed ${SITE}: ${url}"
