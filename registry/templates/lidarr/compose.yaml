services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:2.9.6
    ports: ["8686:8686"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - lidarr_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8686/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
