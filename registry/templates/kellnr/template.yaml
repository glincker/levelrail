id: kellnr
name: Kellnr
slogan: Self-hosted registry for private Rust crates with a web UI and docs hosting. Runs a single container with data on a volume.
description: Self-hosted registry for private Rust crates with a web UI and docs hosting. Runs a single container with data on a volume.
category: Developer Tools
documentation_url: https://kellnr.io/documentation
recommended_memory_bytes: 268435456
requires_gpu: false
manifest:
    id: kellnr
    name: Kellnr
    description: Self-hosted registry for private Rust crates with a web UI and docs hosting. Runs a single container with data on a volume.
    icon: package
    category: Developer Tools
    documentation_url: https://kellnr.io/documentation
    source_repo: https://github.com/kellnr/kellnr
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/kellnr/kellnr/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Sign in as admin with the password admin and change it at once, because it is public knowledge. Set the hostname setting to the address you serve it on.
    compose_file: compose.yaml
    recommended_memory_bytes: 268435456
    env:
        - key: KELLNR_HOSTNAME
          label: Hostname
          description: Host name clients use to reach this registry.
          default: localhost
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: kellnr
          port: 8000
          description: Public address of the registry and its UI.
    healthcheck:
        service: kellnr
        port: 8000
        path: /
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 600
    console_command: []
    capabilities: []
    requires_kernel_modules: []
