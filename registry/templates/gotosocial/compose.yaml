services:
  gotosocial:
    image: superseriousbusiness/gotosocial:0.22.3
    ports: ["8080"]
    environment:
      GTS_HOST: ${SERVICE_FQDN_GOTOSOCIAL:-localhost}
      GTS_DB_TYPE: sqlite
      GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
      GTS_STORAGE_LOCAL_BASE_PATH: /gotosocial/storage/media
      GTS_TRUSTED_PROXIES: 0.0.0.0/0
      GTS_LETSENCRYPT_ENABLED: "false"
    volumes:
      - gotosocial_data:/gotosocial/storage
    healthcheck:
      test: ["CMD-SHELL", 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  gotosocial_data:
