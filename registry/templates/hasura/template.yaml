id: hasura
name: Hasura
slogan: An instant GraphQL and REST API on top of Postgres with permissions, subscriptions and an admin console.
description: An instant GraphQL and REST API on top of Postgres with permissions, subscriptions and an admin console.
category: Developer Tools
documentation_url: https://hasura.io/docs/2.0/deployment/docker/
recommended_memory_bytes: 536870912
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: hasura
    name: Hasura
    description: An instant GraphQL and REST API on top of Postgres with permissions, subscriptions and an admin console.
    icon: database
    category: Developer Tools
    documentation_url: https://hasura.io/docs/2.0/deployment/docker/
    source_repo: https://github.com/hasura/graphql-engine
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/hasura/graphql-engine/blob/master/LICENSE
    hosted_use: ""
    listing: null
    status: ""
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run: []
    compose_file: compose.yaml
    recommended_memory_bytes: 536870912
    env:
        - key: DB_PASSWORD
          label: Database password
          description: Password for the bundled Postgres database.
          default: ""
          generate: password
          length: 32
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: ADMIN_SECRET
          label: Admin secret
          description: Required to open the console and to call the API as admin.
          default: ""
          generate: password
          length: 48
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: hasura
          port: 8080
          description: Public address of Hasura.
    healthcheck:
        service: hasura
        port: 8080
        path: /healthz
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
