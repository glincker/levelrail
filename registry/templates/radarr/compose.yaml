services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    ports: ["7878:7878"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - radarr_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:7878/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
