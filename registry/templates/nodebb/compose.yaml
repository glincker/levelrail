services:
  nodebb:
    image: ghcr.io/nodebb/nodebb:latest
    ports: ["4567:4567"]
    environment:
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
    volumes:
      - nodebb_build:/usr/src/app/build
      - nodebb_uploads:/usr/src/app/public/uploads
      - nodebb_config:/opt/config
    command:
      - /bin/sh
      - -c
      - |
        cat > /usr/src/app/setup.json <<EOF
        {
            "defaults": {
                "postgres": {
                    "host": "postgres",
                    "port": 5432,
                    "database": "nodebb",
                    "username": "nodebb",
                    "password": "$POSTGRES_PASSWORD"
                }
            }
        }
        EOF
        exec tini -- entrypoint.sh
    depends_on: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/4567' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nodebb
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      POSTGRES_DB: nodebb
    volumes:
      - nodebb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodebb -d nodebb"]
      interval: 5s
      timeout: 5s
      retries: 10
