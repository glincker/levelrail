services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.1
    ports: ["6767:6767"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - bazarr_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:6767/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
