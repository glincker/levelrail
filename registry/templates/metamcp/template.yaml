id: metamcp
name: MetaMCP
slogan: An MCP aggregator and gateway that groups many MCP servers behind one endpoint with auth, namespaces and middleware.
description: An MCP aggregator and gateway that groups many MCP servers behind one endpoint with auth, namespaces and middleware.
category: AI
documentation_url: https://docs.metamcp.com
recommended_memory_bytes: 1073741824
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: metamcp
    name: MetaMCP
    description: An MCP aggregator and gateway that groups many MCP servers behind one endpoint with auth, namespaces and middleware.
    icon: plug
    category: AI
    documentation_url: https://docs.metamcp.com
    source_repo: https://github.com/metatool-ai/metamcp
    license: MIT
    license_class: permissive
    license_url: https://github.com/metatool-ai/metamcp/blob/ai-dev/LICENSE
    hosted_use: ""
    listing: null
    status: ""
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run: []
    compose_file: compose.yaml
    recommended_memory_bytes: 1073741824
    env:
        - key: DB_PASSWORD
          label: Database password
          description: Password for the bundled Postgres database.
          default: ""
          generate: password
          length: 32
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: AUTH_SECRET
          label: Auth secret
          description: Signs login sessions. Changing it signs every user out.
          default: ""
          generate: hex
          length: 64
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: metamcp
          port: 12008
          description: Public address of MetaMCP.
    healthcheck:
        service: metamcp
        port: 12008
        path: /health
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
