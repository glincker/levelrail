services:
  casdoor:
    image: casbin/casdoor:v4.32.0
    ports: ["8000"]
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: user=casdoor password=$SERVICE_PASSWORD_DB host=db port=5432 sslmode=disable dbname=casdoor
      dbName: casdoor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casdoor
      POSTGRES_USER: casdoor
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
    volumes:
      - casdoor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor -d casdoor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  casdoor_data:
