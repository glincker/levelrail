x-argilla-env: &argilla-env
  ARGILLA_HOME_PATH: /var/lib/argilla
  ARGILLA_ELASTICSEARCH: http://elasticsearch:9200
  ARGILLA_DATABASE_URL: postgresql+asyncpg://argilla:$SERVICE_PASSWORD_DB@db:5432/argilla
  ARGILLA_REDIS_URL: redis://:$SERVICE_PASSWORD_REDIS@redis:6379/0
services:
  argilla:
    image: argilla/argilla-server:v2.8.0
    ports: ["6900"]
    environment:
      <<: *argilla-env
      USERNAME: argilla
      PASSWORD: $SERVICE_PASSWORD_ARGILLA
      API_KEY: $SERVICE_PASSWORD_APIKEY
      WORKSPACE: default
    volumes:
      - argilla_data:/var/lib/argilla
    depends_on:
      elasticsearch:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:6900/api/v1/settings', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
  worker:
    image: argilla/argilla-server:v2.8.0
    command: python -m argilla_server worker --num-workers 2
    environment:
      <<: *argilla-env
    volumes:
      - argilla_data:/var/lib/argilla
    depends_on:
      argilla:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    environment:
      node.name: elasticsearch
      cluster.name: es-argilla-local
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.enabled: "false"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argilla
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
      POSTGRES_DB: argilla
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argilla -d argilla"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: $SERVICE_PASSWORD_REDIS
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
volumes:
  argilla_data:
  elastic_data:
  db_data:
  redis_data:
