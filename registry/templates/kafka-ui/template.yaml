id: kafka-ui
name: Kafka UI
slogan: A web UI for inspecting topics, consumers and messages in Apache Kafka clusters.
description: Apache 2.0 licensed. Add clusters in the settings page after sign-in. Dynamic configuration is on, and the generated admin password is in the deployment variables.
category: Monitoring
documentation_url: https://docs.kafka-ui.provectus.io
recommended_memory_bytes: 536870912
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
source_repo: https://github.com/provectus/kafka-ui
license: Apache-2.0
license_class: permissive
license_url: https://github.com/provectus/kafka-ui/blob/master/LICENSE
