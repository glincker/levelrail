services:
    matterbridge:
        image: 42wim/matterbridge:1.26.0
        ports: ["4242"]
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: tcp
            port: 4242
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        secrets:
            - source: lr_file_matterbridge_config
              target: /etc/matterbridge/matterbridge.toml
              mode: "0444"
secrets:
    lr_file_matterbridge_config:
        content: |
            [api.local]
            BindAddress = "0.0.0.0:4242"
            Token = "${SERVICE_PASSWORD_32_MATTERBRIDGE_TOKEN}"
            Buffer = 1000

            [[gateway]]
            name = "local"
            enable = true

            [[gateway.inout]]
            account = "api.local"
            channel = "api"
