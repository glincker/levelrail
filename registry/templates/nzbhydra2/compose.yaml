services:
  nzbhydra2:
    image: linuxserver/nzbhydra2:9.3.4
    ports: ["5076"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
    volumes:
      - nzbhydra2_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5076/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  nzbhydra2_config:
