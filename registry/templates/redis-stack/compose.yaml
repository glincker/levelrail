services:
  redis-stack:
    image: redis/redis-stack-server:7.4.0-v8
    ports: ["6379"]
    environment:
      REDIS_ARGS: --requirepass $SERVICE_PASSWORD_REDIS --appendonly yes
      REDISCLI_AUTH: $SERVICE_PASSWORD_REDIS
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  redis_stack_data:
