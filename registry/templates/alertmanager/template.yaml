id: alertmanager
name: Alertmanager
slogan: 'Prometheus Alertmanager: groups, deduplicates and routes alerts to email, Slack, webhooks and on-call tools.'
description: 'Prometheus Alertmanager: groups, deduplicates and routes alerts to email, Slack, webhooks and on-call tools.'
category: Monitoring
documentation_url: https://prometheus.io/docs/alerting/latest/alertmanager/
recommended_memory_bytes: 134217728
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm
    - linux/arm64
    - linux/ppc64le
    - linux/s390x
manifest:
    id: alertmanager
    name: Alertmanager
    description: 'Prometheus Alertmanager: groups, deduplicates and routes alerts to email, Slack, webhooks and on-call tools.'
    icon: bell
    category: Monitoring
    documentation_url: https://prometheus.io/docs/alerting/latest/alertmanager/
    source_repo: https://github.com/prometheus/alertmanager
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/prometheus/alertmanager/blob/main/LICENSE
    hosted_use: ""
    listing: null
    status: ""
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run: []
    compose_file: compose.yaml
    recommended_memory_bytes: 134217728
    env: []
    domains:
        - service: alertmanager
          port: 9093
          description: Public address of the Alertmanager UI. It has no login, so restrict access.
    healthcheck:
        service: alertmanager
        port: 9093
        path: /-/healthy
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
