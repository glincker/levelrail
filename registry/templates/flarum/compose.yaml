services:
  flarum:
    image: crazymax/flarum:1.8.20
    ports: ["8000"]
    environment:
      FLARUM_BASE_URL: ${SERVICE_URL_FLARUM:-http://localhost:8000}
      DB_HOST: db
      DB_NAME: flarum
      DB_USER: flarum
      DB_PASSWORD: $SERVICE_PASSWORD_DB
      FLARUM_ADMIN_PASS: $SERVICE_PASSWORD_ADMIN
    volumes:
      - flarum_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8000/ -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
  db:
    image: mariadb:11.4
    environment:
      MYSQL_ROOT_PASSWORD: $SERVICE_PASSWORD_ROOT
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: $SERVICE_PASSWORD_DB
    volumes:
      - flarum_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  flarum_data:
  flarum_db_data:
