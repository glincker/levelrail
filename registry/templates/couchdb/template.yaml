id: couchdb
name: CouchDB
slogan: A document database with an HTTP API, built-in replication and the Fauxton admin console.
description: A document database with an HTTP API, built-in replication and the Fauxton admin console.
category: Database Tools
documentation_url: https://docs.couchdb.org/
recommended_memory_bytes: 536870912
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
    - linux/s390x
manifest:
    id: couchdb
    name: CouchDB
    description: A document database with an HTTP API, built-in replication and the Fauxton admin console.
    icon: database
    category: Database Tools
    documentation_url: https://docs.couchdb.org/
    source_repo: ""
    license: ""
    license_class: ""
    license_url: ""
    hosted_use: ""
    listing: null
    status: ""
    status_reason: ""
    replaced_by: ""
