services:
  navidrome:
    image: deluan/navidrome:0.54.1
    ports: ["4533:4533"]
    environment:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
    volumes:
      - navidrome_data:/data
      - navidrome_music:/music
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:4533/ping || wget -q -O /dev/null http://127.0.0.1:4533/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
