services:
    sonic:
        image: valeriansaliou/sonic:v1.10.2
        ports: ["1491"]
        command: ["sonic", "-c", "/etc/sonic.cfg"]
        volumes:
            - store:/var/lib/sonic/store
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: tcp
            port: 1491
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        secrets:
            - source: lr_file_sonic_config
              target: /etc/sonic.cfg
              mode: "0444"
secrets:
    lr_file_sonic_config:
        content: |
            [server]
            log_level = "error"

            [channel]
            inet = "0.0.0.0:1491"
            tcp_timeout = 300
            auth_password = "${SERVICE_PASSWORD_24_SONIC_PASSWORD}"

            [channel.search]
            query_limit_default = 10
            query_limit_maximum = 100
            query_alternates_try = 4
            suggest_limit_default = 5
            suggest_limit_maximum = 20
            list_limit_default = 100
            list_limit_maximum = 500

            [store]

            [store.kv]
            path = "/var/lib/sonic/store/kv/"
            retain_word_objects = 1000

            [store.kv.pool]
            inactive_after = 1800

            [store.kv.database]
            flush_after = 900
            compress = true
            parallelism = 2
            max_files = 100
            max_compactions = 1
            max_flushes = 1
            write_buffer = 16384
            write_ahead_log = true

            [store.fst]
            path = "/var/lib/sonic/store/fst/"

            [store.fst.pool]
            inactive_after = 300

            [store.fst.graph]
            consolidate_after = 180
            max_size = 2048
            max_words = 250000
