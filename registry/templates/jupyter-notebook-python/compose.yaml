services:
  jupyter:
    image: quay.io/jupyter/base-notebook:2026-09-29
    ports: ["8888:8888"]
    command: ["start-notebook.sh"]
    environment:
      JUPYTER_TOKEN: $SERVICE_PASSWORD_JUPYTER
    volumes:
      - jupyter_work:/home/jovyan/work
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
