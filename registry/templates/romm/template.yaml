id: romm
name: RomM
slogan: A self-hosted retro game library manager. It scans your ROM collection, matches metadata and cover art, and lets you browse, search and play games in the browser. Runs with a bundled MariaDB database. On first open, the setup page asks you to create the admin login.
description: A self-hosted retro game library manager. It scans your ROM collection, matches metadata and cover art, and lets you browse, search and play games in the browser. Runs with a bundled MariaDB database. On first open, the setup page asks you to create the admin login.
category: Media
documentation_url: https://docs.romm.app/latest/
recommended_memory_bytes: 1073741824
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: romm
    name: RomM
    description: A self-hosted retro game library manager. It scans your ROM collection, matches metadata and cover art, and lets you browse, search and play games in the browser. Runs with a bundled MariaDB database. On first open, the setup page asks you to create the admin login.
    icon: gamepad
    category: Media
    documentation_url: https://docs.romm.app/latest/
    source_repo: https://github.com/rommapp/romm
    license: AGPL-3.0
    license_class: network-copyleft
    license_url: https://github.com/rommapp/romm/blob/master/LICENSE
    hosted_use: unknown
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Open the app and create the admin account on the setup page.
        - Copy your ROM files into the library volume, one folder per platform, then run a scan from the app.
    compose_file: compose.yaml
    recommended_memory_bytes: 1073741824
    env:
        - key: TZ
          label: Time zone
          description: IANA time zone for dates and logs.
          default: Etc/UTC
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: romm
          port: 8080
          description: Public address of RomM.
    healthcheck:
        service: romm
        port: 8080
        path: /api/heartbeat
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
