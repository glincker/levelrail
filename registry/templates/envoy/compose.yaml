services:
    envoy:
        image: envoyproxy/envoy:v1.40.2
        ports: ["10000", "9901"]
        command: ["-c", "/etc/envoy/envoy.yaml"]
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: http
            path: /
            port: 10000
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        configs:
            - source: lr_file_envoy_config
              target: /etc/envoy/envoy.yaml
              mode: "0444"
configs:
    lr_file_envoy_config:
        content: |
            admin:
              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 9901
            static_resources:
              listeners:
                - name: main
                  address:
                    socket_address:
                      address: 0.0.0.0
                      port_value: 10000
                  filter_chains:
                    - filters:
                        - name: envoy.filters.network.http_connection_manager
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                            stat_prefix: ingress
                            route_config:
                              name: local
                              virtual_hosts:
                                - name: all
                                  domains: ["*"]
                                  routes:
                                    - match:
                                        prefix: "/"
                                      direct_response:
                                        status: 200
                                        body:
                                          inline_string: "envoy is up"
                            http_filters:
                              - name: envoy.filters.http.router
                                typed_config:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
