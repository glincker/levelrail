services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    ports: ["2379"]
    command: ["/usr/local/bin/etcd", "--name", "etcd0", "--data-dir", "/etcd-data", "--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://etcd:2379"]
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
