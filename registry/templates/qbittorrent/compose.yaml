services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    ports: ["8080:8080", "6881:6881"]
    volumes:
      - qbittorrent_config:/config
      - qbittorrent_downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # From outside the container the WebUI answers 401 (the localhost auth bypass only covers the in-container check), so 401 counts as serving.
    x-levelrail-healthcheck:
      kind: http
      path: /
      port: 8080
      expect_status: "200-299,401"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
