services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    ports: ["8081:8081"]
    volumes:
      - metube_downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8081/ || wget -q -O /dev/null http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
