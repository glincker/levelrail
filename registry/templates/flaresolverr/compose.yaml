services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    ports: ["8191:8191"]
    environment:
      LOG_LEVEL: info
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8191/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
