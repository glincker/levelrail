services:
    mysql:
        image: mysql:8.4.13
        ports: ["3306"]
        environment:
            MYSQL_ROOT_PASSWORD: $SERVICE_PASSWORD_MYSQLROOT
            MYSQL_DATABASE: app
            MYSQL_USER: app
            MYSQL_PASSWORD: $SERVICE_PASSWORD_MYSQL
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 40s
