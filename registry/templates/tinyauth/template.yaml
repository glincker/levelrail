id: tinyauth
name: Tinyauth
slogan: A small login screen and forward-auth server that protects other apps behind your reverse proxy with username and password or OAuth. Runs on SQLite in one container. Users are set with a bcrypt hash in the install form.
description: A small login screen and forward-auth server that protects other apps behind your reverse proxy with username and password or OAuth. Runs on SQLite in one container. Users are set with a bcrypt hash in the install form.
category: Security
documentation_url: https://tinyauth.app/docs/getting-started
recommended_memory_bytes: 67108864
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: tinyauth
    name: Tinyauth
    description: A small login screen and forward-auth server that protects other apps behind your reverse proxy with username and password or OAuth. Runs on SQLite in one container. Users are set with a bcrypt hash in the install form.
    icon: lock
    category: Security
    documentation_url: https://tinyauth.app/docs/getting-started
    source_repo: https://github.com/tinyauthapp/tinyauth
    license: AGPL-3.0
    license_class: network-copyleft
    license_url: https://github.com/tinyauthapp/tinyauth/blob/main/LICENSE
    hosted_use: unknown
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Open the app address and sign in with the user you set in the install form.
    compose_file: compose.yaml
    recommended_memory_bytes: 67108864
    env:
        - key: TINYAUTH_USERS
          label: Users
          description: Comma-separated list of username:bcrypt-hash pairs. Create a hash with the tinyauth user create command.
          default: ""
          generate: ""
          length: 0
          required: true
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: tinyauth
          port: 3000
          description: Public address of the Tinyauth login screen.
    healthcheck:
        service: tinyauth
        port: 3000
        path: /api/healthz
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
