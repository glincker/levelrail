          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: SECRET
          label: Application secret
          description: Signs sessions and tokens. Changing it signs every user out.
          default: ""
          generate: hex
          length: 32
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: wallabag
          port: 80
          description: Public address of Wallabag.
    healthcheck:
        service: wallabag
        port: 80
        path: /
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
