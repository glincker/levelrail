id: dockge
name: Dockge
slogan: A web manager for Docker Compose stacks.
description: Needs the Docker socket to create and control stacks, which gives it full control of the host Docker daemon. Create the admin account on first visit. MIT licence.
category: Developer Tools
documentation_url: https://github.com/louislam/dockge#readme
recommended_memory_bytes: 268435456
requires_gpu: false
requires_docker_socket: true
platforms:
    - linux/amd64
    - linux/arm64
