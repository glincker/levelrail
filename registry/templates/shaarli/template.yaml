id: shaarli
name: Shaarli
slogan: A minimalist personal bookmark manager, link sharer and microblog with no database. zlib licensed. On first open, the install page asks you to create the admin login.
description: A minimalist personal bookmark manager, link sharer and microblog with no database. zlib licensed. On first open, the install page asks you to create the admin login.
category: Productivity
documentation_url: https://shaarli.readthedocs.io/
recommended_memory_bytes: 134217728
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm
    - linux/arm64
manifest:
