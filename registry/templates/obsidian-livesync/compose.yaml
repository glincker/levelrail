services:
  couchdb:
    image: couchdb:3.5.2
    ports: ["5984:5984"]
    environment:
      COUCHDB_USER: $SERVICE_USER_COUCHDB
      COUCHDB_PASSWORD: $SERVICE_PASSWORD_64_COUCHDB
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5984/_up"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
