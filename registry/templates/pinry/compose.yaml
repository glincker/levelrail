services:
  pinry:
    image: getpinry/pinry:2.1.15
    ports: ["80"]
    volumes:
      - pinry_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  pinry_data:
