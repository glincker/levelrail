services:
  embystat:
    image: lscr.io/linuxserver/embystat:latest
    ports: ["6555:6555"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - embystat_config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6555"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
