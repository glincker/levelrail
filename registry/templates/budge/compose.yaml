services:
  budge:
    image: lscr.io/linuxserver/budge:latest
    ports: ["80:80"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - budge_config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
