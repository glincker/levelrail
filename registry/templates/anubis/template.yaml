id: anubis
name: Anubis
slogan: A reverse proxy that makes clients pass a small proof of work before reaching your site, which blocks most scraper bots. Sits in front of one upstream you choose. The signing key is generated for you.
description: A reverse proxy that makes clients pass a small proof of work before reaching your site, which blocks most scraper bots. Sits in front of one upstream you choose. The signing key is generated for you.
category: Security
documentation_url: https://anubis.techaro.lol/
recommended_memory_bytes: 67108864
requires_gpu: false
manifest:
    id: anubis
    name: Anubis
    description: A reverse proxy that makes clients pass a small proof of work before reaching your site, which blocks most scraper bots. Sits in front of one upstream you choose. The signing key is generated for you.
    icon: shield
    category: Security
    documentation_url: https://anubis.techaro.lol/
    source_repo: https://github.com/TecharoHQ/anubis
    license: MIT
    license_class: permissive
    license_url: https://github.com/TecharoHQ/anubis/blob/main/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Point a domain at this address. Requests that pass the challenge are forwarded to the upstream URL you entered.
    compose_file: compose.yaml
    recommended_memory_bytes: 67108864
    env:
        - key: ANUBIS_TARGET
          label: Upstream URL
          description: The site to protect, reachable from this container, for example http://my-app:8080.
          default: ""
          generate: ""
          length: 0
          required: true
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: ANUBIS_DIFFICULTY
          label: Difficulty
          description: Leading zero hex digits the client must find. Higher is slower for scrapers and for visitors.
          default: "4"
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: ANUBIS_KEY
          label: Signing key
          description: Signs the pass cookie. Keep it stable or every visitor must solve the challenge again.
          default: ""
          generate: hex
          length: 64
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: anubis
          port: 8923
          description: Public address of the protected site.
    healthcheck:
        service: anubis
        port: 9090
        path: /metrics
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
