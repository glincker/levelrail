services:
    postgres:
        image: postgres:17.11-alpine
        ports: ["5432"]
        environment:
            POSTGRES_USER: postgres
            POSTGRES_DB: app
            POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
