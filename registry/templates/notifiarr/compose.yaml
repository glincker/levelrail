services:
    notifiarr:
        image: ghcr.io/notifiarr/notifiarr:v0.10.0
        ports: ["5454"]
        command: ["--config", "/etc/notifiarr/notifiarr.conf"]
        volumes:
            - config:/config
        healthcheck:
            test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:5454/ 2>&1 | grep -q HTTP/"]
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 15s
        secrets:
            - source: lr_file_notifiarr_config
              target: /etc/notifiarr/notifiarr.conf
              mode: "0400"
secrets:
    lr_file_notifiarr_config:
        content: |
            api_key = "${SERVICE_PROMPT_NOTIFIARR_API_KEY}"
            ui_password = "admin:${SERVICE_PASSWORD_24_NOTIFIARR_UI_PASSWORD}"
            bind_addr = "0.0.0.0:5454"
            quiet = true
