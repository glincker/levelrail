services:
    timescaledb:
        image: timescale/timescaledb:2.30.2-pg17
        ports: ["5432"]
        environment:
            POSTGRES_USER: postgres
            POSTGRES_DB: app
            POSTGRES_PASSWORD: $SERVICE_PASSWORD_TIMESCALE
        volumes:
            - tsdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
