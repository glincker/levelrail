services:
    telegraf:
        image: telegraf:1.40.3
        ports: ["9273"]
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: http
            path: /metrics
            port: 9273
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        configs:
            - source: lr_file_telegraf_config
              target: /etc/telegraf/telegraf.conf
              mode: "0444"
configs:
    lr_file_telegraf_config:
        content: |
            [agent]
              interval = "10s"
              flush_interval = "10s"
              omit_hostname = false

            [[inputs.cpu]]
              percpu = false
              totalcpu = true
            [[inputs.mem]]
            [[inputs.system]]

            [[outputs.prometheus_client]]
              listen = ":9273"
