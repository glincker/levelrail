services:
  redisinsight:
    image: redis/redisinsight:2.70
    ports: ["5540:5540"]
    environment:
      RI_APP_HOST: 0.0.0.0
      RI_APP_PORT: "5540"
    volumes:
      - redisinsight_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5540/api/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
