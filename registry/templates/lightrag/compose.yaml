services:
    lightrag:
        image: ghcr.io/hkuds/lightrag:v1.5.7
        ports: ["9621"]
        environment:
            HOST: 0.0.0.0
            PORT: 9621
            LIGHTRAG_API_KEY: ${SERVICE_PASSWORD_32_LIGHTRAG_API_KEY}
            LLM_BINDING: ollama
            LLM_MODEL: qwen2.5:7b
            LLM_BINDING_HOST: http://host.docker.internal:11434
            LLM_BINDING_API_KEY: not-needed
            EMBEDDING_BINDING: ollama
            EMBEDDING_MODEL: bge-m3:latest
            EMBEDDING_DIM: "1024"
            EMBEDDING_BINDING_HOST: http://host.docker.internal:11434
            EMBEDDING_BINDING_API_KEY: not-needed
        volumes:
            - rag:/app/data/rag_storage
            - inputs:/app/data/inputs
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: http
            path: /health
            port: 9621
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
