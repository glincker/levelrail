id: tika
name: Apache Tika Server
slogan: Detects and extracts text and metadata from over a thousand file types over a simple HTTP API. Single container, no storage.
description: Detects and extracts text and metadata from over a thousand file types over a simple HTTP API. Single container, no storage.
category: Developer Tools
documentation_url: https://tika.apache.org/
recommended_memory_bytes: 536870912
requires_gpu: false
manifest:
    id: tika
    name: Apache Tika Server
    description: Detects and extracts text and metadata from over a thousand file types over a simple HTTP API. Single container, no storage.
    icon: file-text
    category: Developer Tools
    documentation_url: https://tika.apache.org/
    source_repo: https://github.com/apache/tika
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/apache/tika/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Send a file with PUT to /tika for plain text or /meta for metadata. The server has no login, so keep it private.
    compose_file: compose.yaml
    recommended_memory_bytes: 536870912
    env: []
    domains:
        - service: tika
          port: 9998
          description: Public address of the Tika API. Keep it private.
    healthcheck:
        service: tika
        port: 9998
        path: /tika
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
