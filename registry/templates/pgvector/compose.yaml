services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
      POSTGRES_DB: vector
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 10s
      timeout: 5s
      retries: 5
