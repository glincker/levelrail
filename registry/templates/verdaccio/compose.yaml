services:
  verdaccio:
    image: verdaccio/verdaccio:5.31.1
    ports: ["4873:4873"]
    environment:
      VERDACCIO_PORT: "4873"
    volumes:
      - verdaccio_storage:/verdaccio/storage
      - verdaccio_conf:/verdaccio/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4873/-/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
