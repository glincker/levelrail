id: meshcentral
name: MeshCentral
slogan: A remote device management server with web-based desktop, terminal and file access, plus agents for Windows, Linux and macOS. Apache-2.0 licensed. The first account you register becomes the server admin, so register it before sharing the address. Set the host name to your public domain so agents can find the server.
description: A remote device management server with web-based desktop, terminal and file access, plus agents for Windows, Linux and macOS. Apache-2.0 licensed. The first account you register becomes the server admin, so register it before sharing the address. Set the host name to your public domain so agents can find the server.
category: Infrastructure
documentation_url: https://meshcentral.com/docs/
recommended_memory_bytes: 402653184
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm
    - linux/arm64
