id: superset
name: Apache Superset
slogan: A business intelligence platform for exploring data and building dashboards, with its metadata kept in SQLite.
description: A business intelligence platform for exploring data and building dashboards, with its metadata kept in SQLite.
category: Analytics
documentation_url: https://superset.apache.org/docs/intro
recommended_memory_bytes: 2147483648
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: superset
    name: Apache Superset
    description: A business intelligence platform for exploring data and building dashboards, with its metadata kept in SQLite.
    icon: chart-bar
    category: Analytics
    documentation_url: https://superset.apache.org/docs/intro
    source_repo: https://github.com/apache/superset
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/apache/superset/blob/master/LICENSE.txt
    hosted_use: ""
    listing: null
    status: ""
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run: []
    compose_file: compose.yaml
    recommended_memory_bytes: 2147483648
    env:
        - key: SUPERSET_SECRET_KEY
          label: Secret key
          description: Signs sessions and encrypts stored database credentials. Changing it breaks saved connections.
          default: ""
          generate: hex
          length: 64
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: ADMIN_USERNAME
          label: Admin user
          description: Name of the first admin account.
          default: admin
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: ADMIN_PASSWORD
          label: Admin password
          description: Password for the first admin account.
          default: ""
          generate: password
          length: 32
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: superset
          port: 8088
          description: Public address of Superset.
    healthcheck:
        service: superset
        port: 8088
        path: /health
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
