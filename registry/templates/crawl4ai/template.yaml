          port: 11235
          description: Address of the Crawl4AI API and playground.
    healthcheck:
        service: crawl4ai
        port: 11235
        path: /health
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
