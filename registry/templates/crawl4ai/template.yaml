id: crawl4ai
name: Crawl4AI
slogan: An open source web crawler API that turns pages into clean Markdown and structured data for LLM pipelines, with a built-in playground and MCP endpoint. API calls need the generated token as a Bearer header.
description: An open source web crawler API that turns pages into clean Markdown and structured data for LLM pipelines, with a built-in playground and MCP endpoint. API calls need the generated token as a Bearer header.
category: AI
documentation_url: https://docs.crawl4ai.com/core/docker-deployment/
recommended_memory_bytes: 2147483648
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: crawl4ai
    name: Crawl4AI
    description: An open source web crawler API that turns pages into clean Markdown and structured data for LLM pipelines, with a built-in playground and MCP endpoint. API calls need the generated token as a Bearer header.
    icon: spider
    category: AI
    documentation_url: https://docs.crawl4ai.com/core/docker-deployment/
    source_repo: https://github.com/unclecode/crawl4ai
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/unclecode/crawl4ai/blob/main/LICENSE
    hosted_use: ""
    listing: null
    status: ""
    status_reason: ""
    replaced_by: ""
    aliases: []
