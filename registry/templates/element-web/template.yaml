          default: matrix.org
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: BRAND
          label: Brand
          description: Name shown in the client.
          default: Element
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: element
          port: 80
          description: Public address of Element Web.
    healthcheck:
        service: element
        port: 80
        path: /
