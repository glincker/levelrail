services:
  ezbookkeeping:
    image: mayswind/ezbookkeeping:2.1.1
    ports: ["8080"]
    environment:
      EBK_SERVER_ENABLE_GZIP: "true"
      EBK_DATABASE_TYPE: sqlite3
      EBK_SECURITY_SECRET_KEY: $SERVICE_PASSWORD_SECRET
    volumes:
      - storage:/ezbookkeeping/storage
      - logs:/ezbookkeeping/log
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  storage:
  logs:
