services:
    webdav:
        image: hacdias/webdav:v5.17.3
        ports: ["6060"]
        command: ["-c", "/config.yml"]
        volumes:
            - data:/data
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: http
            path: /
            expect_status: 401
            port: 6060
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        secrets:
            - source: lr_file_webdav_config
              target: /config.yml
              mode: "0444"
secrets:
    lr_file_webdav_config:
        content: |
            address: 0.0.0.0
            port: 6060
            directory: /data
            permissions: CRUD
            users:
              - username: admin
                password: "${SERVICE_PASSWORD_24_WEBDAV_PASSWORD}"
