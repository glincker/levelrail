id: tempo
name: Grafana Tempo
slogan: Distributed tracing backend that stores traces on local disk and accepts OTLP over gRPC and HTTP. The install form carries tempo.yaml as an editable file.
description: Distributed tracing backend that stores traces on local disk and accepts OTLP over gRPC and HTTP. The install form carries tempo.yaml as an editable file.
category: Monitoring
documentation_url: https://grafana.com/docs/tempo/latest/
recommended_memory_bytes: 268435456
requires_gpu: false
manifest:
    id: tempo
    name: Grafana Tempo
    description: Distributed tracing backend that stores traces on local disk and accepts OTLP over gRPC and HTTP. The install form carries tempo.yaml as an editable file.
    icon: tree-structure
    category: Monitoring
    documentation_url: https://grafana.com/docs/tempo/latest/
    source_repo: https://github.com/grafana/tempo
    license: AGPL-3.0-only
    license_class: network-copyleft
    license_url: https://github.com/grafana/tempo/blob/main/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Send OTLP traces to port 4317 (gRPC) or 4318 (HTTP) and add this address as a Tempo data source in Grafana.
    compose_file: compose.yaml
    recommended_memory_bytes: 268435456
    env:
        - key: TEMPO_CONFIG
          label: tempo.yaml
          description: The full Tempo configuration, mounted read-only.
          default: |
            server:
              http_listen_port: 3200
            distributor:
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: 0.0.0.0:4317
                    http:
                      endpoint: 0.0.0.0:4318
            storage:
              trace:
                backend: local
                wal:
                  path: /var/tempo/wal
                local:
                  path: /var/tempo/blocks
          generate: ""
          length: 0
          required: false
          secret: false
          type: file
          service: tempo
          path: /etc/tempo.yaml
          mode: "0444"
    domains:
        - service: tempo
          port: 3200
          description: Public address of the Tempo query API.
    healthcheck:
        service: tempo
        port: 3200
        path: /ready
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
