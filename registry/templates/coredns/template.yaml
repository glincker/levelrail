id: coredns
name: CoreDNS
slogan: Plugin based DNS server on the official image. The install form carries the Corefile as an editable file, so it starts as a caching forwarder with health and readiness endpoints.
description: Plugin based DNS server on the official image. The install form carries the Corefile as an editable file, so it starts as a caching forwarder with health and readiness endpoints.
category: Networking
documentation_url: https://coredns.io/manual/toc/
recommended_memory_bytes: 67108864
requires_gpu: false
manifest:
    id: coredns
    name: CoreDNS
    description: Plugin based DNS server on the official image. The install form carries the Corefile as an editable file, so it starts as a caching forwarder with health and readiness endpoints.
    icon: globe
    category: Networking
    documentation_url: https://coredns.io/manual/toc/
    source_repo: https://github.com/coredns/coredns
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/coredns/coredns/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Point a client at the DNS port to resolve through the cache, then edit the Corefile setting to add zones, rewrites or other plugins.
    compose_file: compose.yaml
    recommended_memory_bytes: 67108864
    env:
        - key: COREDNS_UPSTREAM
          label: Upstream resolvers
          description: Space separated resolvers the forwarder asks.
          default: 1.1.1.1 9.9.9.9
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: COREDNS_COREFILE
          label: Corefile
          description: The full CoreDNS configuration, mounted read-only.
          default: |
            .:1053 {
                errors
                health :8080
                ready :8181
                cache 30
                forward . ${COREDNS_UPSTREAM}
            }
          generate: ""
          length: 0
          required: false
          secret: false
          type: file
          service: coredns
          path: /etc/coredns/Corefile
          mode: "0444"
    domains:
        - service: coredns
          port: 8080
          description: Public address of the health endpoint.
    healthcheck:
        service: coredns
        port: 8080
        path: /health
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
