services:
  mumble:
    image: mumblevoip/mumble-server:v1.6.1001
    ports: ["64738"]
    environment:
      MUMBLE_SUPERUSER_PASSWORD: $SERVICE_PASSWORD_SUPERUSER
    volumes:
      - mumble_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/64738' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  mumble_data:
