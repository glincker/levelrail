services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports: ["8188:8188"]
    environment:
      WEB_ENABLE_AUTH: "true"
      WEB_USER: admin
      WEB_PASSWORD: $SERVICE_PASSWORD_ADMIN
    volumes:
      - comfyui_workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8188/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
