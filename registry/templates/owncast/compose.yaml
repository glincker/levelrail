services:
  owncast:
    image: owncast/owncast:0.3.0
    ports: ["8080:8080", "1935:1935"]
    volumes:
      - owncast_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/status || wget -q -O /dev/null http://127.0.0.1:8080/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
