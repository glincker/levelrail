id: rustfs
name: RustFS
slogan: An S3-compatible object storage server written in Rust, with a web console. One container serves the S3 API on port 9000 and the console on port 9001. Access and secret keys are generated at install time.
description: An S3-compatible object storage server written in Rust, with a web console. One container serves the S3 API on port 9000 and the console on port 9001. Access and secret keys are generated at install time.
category: Storage
documentation_url: https://docs.rustfs.com/
recommended_memory_bytes: 268435456
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
manifest:
    id: rustfs
    name: RustFS
    description: An S3-compatible object storage server written in Rust, with a web console. One container serves the S3 API on port 9000 and the console on port 9001. Access and secret keys are generated at install time.
    icon: hard-drives
    category: Storage
    documentation_url: https://docs.rustfs.com/
    source_repo: https://github.com/rustfs/rustfs
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/rustfs/rustfs/blob/main/LICENSE
    hosted_use: unknown
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Sign in to the console with the access key and secret key from the service environment settings.
    compose_file: compose.yaml
    recommended_memory_bytes: 268435456
    env: []
    domains:
        - service: rustfs
          port: 9001
          description: Public address of the RustFS console.
    healthcheck:
        service: rustfs
        port: 9001
        path: /rustfs/console/index.html
