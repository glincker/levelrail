services:
    krakend:
        image: krakend:3.0.3
        ports: ["8080"]
        command: ["run", "-c", "/etc/krakend/krakend.json"]
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: http
            path: /__health
            port: 8080
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        configs:
            - source: lr_file_krakend_config
              target: /etc/krakend/krakend.json
              mode: "0444"
configs:
    lr_file_krakend_config:
        content: |
            {
              "version": 4,
              "port": 8080,
              "timeout": "3s",
              "endpoints": [
                {
                  "endpoint": "/hello",
                  "backend": [
                    {
                      "host": ["http://127.0.0.1:8080"],
                      "url_pattern": "/__health"
                    }
                  ]
                }
              ]
            }
