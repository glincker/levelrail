id: pgweb
name: Pgweb
slogan: A small web client for browsing and querying PostgreSQL databases, with a table browser, query editor and export. Runs as one container with no storage of its own. Sign in with the username and password from the install form, then enter the connection details of your database.
description: A small web client for browsing and querying PostgreSQL databases, with a table browser, query editor and export. Runs as one container with no storage of its own. Sign in with the username and password from the install form, then enter the connection details of your database.
category: Developer Tools
documentation_url: https://github.com/sosedoff/pgweb/wiki
recommended_memory_bytes: 67108864
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm
    - linux/arm64
manifest:
    id: pgweb
    name: Pgweb
    description: A small web client for browsing and querying PostgreSQL databases, with a table browser, query editor and export. Runs as one container with no storage of its own. Sign in with the username and password from the install form, then enter the connection details of your database.
    icon: database
    category: Developer Tools
    documentation_url: https://github.com/sosedoff/pgweb/wiki
    source_repo: https://github.com/sosedoff/pgweb
    license: MIT
    license_class: permissive
    license_url: https://github.com/sosedoff/pgweb/blob/main/LICENSE
    hosted_use: unknown
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Sign in with the username and password from the install form.
        - Enter the host, user, password and database of the Postgres server you want to browse.
    compose_file: compose.yaml
    recommended_memory_bytes: 67108864
    env:
        - key: PGWEB_AUTH_USER
          label: Username
          description: Login name for the Pgweb page. Pgweb can reach your databases, so keep the login on.
          default: admin
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: PGWEB_AUTH_PASS
          label: Password
          description: Login password for the Pgweb page.
          default: ""
          generate: password
          length: 24
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: pgweb
          port: 8081
          description: Public address of Pgweb.
    healthcheck:
        service: pgweb
        port: 8081
        path: /
        expect: 401
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
