services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:v1.15.0-ls174
    ports: ["8765:80"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      APP_KEY: $SERVICE_PASSWORD_32_APPKEY
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 * * * *"
    volumes:
      - speedtest_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
