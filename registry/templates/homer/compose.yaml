services:
  homer:
    image: b4bz/homer:v24.05.1
    ports: ["8080:8080"]
    environment:
      INIT_ASSETS: "1"
    volumes:
      - homer_assets:/www/assets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
