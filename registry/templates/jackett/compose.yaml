services:
  jackett:
    image: lscr.io/linuxserver/jackett:0.24.2663
    ports: ["9117:9117"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - jackett_config:/config
      - jackett_downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9117/UI/Dashboard"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
