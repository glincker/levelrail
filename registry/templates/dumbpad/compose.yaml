services:
  dumbpad:
    image: dumbwareio/dumbpad:1.0.5
    ports: ["3000"]
    volumes:
      - dumbpad_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
volumes:
  dumbpad_data:
