services:
  registry:
    image: registry:3
    ports: ["5000:5000"]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 10s
      retries: 5
