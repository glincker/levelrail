category: Communication
documentation_url: https://www.xmox.nl/
recommended_memory_bytes: 268435456
requires_gpu: false
platforms:
    - linux/386
    - linux/amd64
    - linux/arm
    - linux/arm64
    - linux/ppc64le
    - linux/s390x
