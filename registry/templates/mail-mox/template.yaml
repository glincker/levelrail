          default: ""
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: MAIL_SMARTHOST_PORT
          label: Relay port
          description: Leave empty for 587. Use 465 for implicit TLS.
          default: ""
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: MAIL_SMARTHOST_USER
