          default: ""
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: MAIL_TLS_CERT_FILE
          label: Certificate file
          description: Optional path under the config volume, for example certs/cur.pem. Leave empty and the first start makes a self-signed certificate for testing, valid for localhost only.
          default: ""
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: MAIL_TLS_KEY_FILE
          label: Certificate key file
