          generate: ""
          length: 0
          required: true
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: MAIL_HOSTNAME
          label: Mail server host name
          description: The name other mail servers connect to. Leave empty to use mail. plus your domain (mail.example.com). It needs a DNS record and matching reverse DNS.
          default: ""
          generate: ""
          length: 0
          required: false
          secret: false
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: MAIL_ADMIN_EMAIL
