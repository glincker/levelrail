services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.28.0
    ports: ["9925:9000"]
    environment:
      BASE_URL: ${SERVICE_URL_MEALIE:-http://localhost:9925}
    volumes:
      - mealie_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000/api/app/about"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
