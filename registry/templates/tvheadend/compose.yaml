services:
  tvheadend:
    image: linuxserver/tvheadend:8837853a-ls288
    ports: ["9981"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
    volumes:
      - tvheadend_config:/config
      - tvheadend_recordings:/recordings
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9981/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
volumes:
  tvheadend_config:
  tvheadend_recordings:
