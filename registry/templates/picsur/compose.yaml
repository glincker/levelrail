services:
  picsur:
    image: ghcr.io/caramelfur/picsur:0.5.6
    ports: ["8080"]
    environment:
      PICSUR_DB_HOST: db
      PICSUR_DB_PORT: "5432"
      PICSUR_DB_USERNAME: picsur
      PICSUR_DB_PASSWORD: $SERVICE_PASSWORD_DB
      PICSUR_DB_DATABASE: picsur
      PICSUR_ADMIN_PASSWORD: $SERVICE_PASSWORD_ADMIN
      PICSUR_JWT_SECRET: $SERVICE_PASSWORD_JWT
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: picsur
      POSTGRES_USER: picsur
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picsur -d picsur"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  db_data:
