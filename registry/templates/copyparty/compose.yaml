services:
  copyparty:
    image: copyparty/ac:1.20.24
    environment:
      ADMIN_PASSWORD: $SERVICE_PASSWORD_ADMIN
    entrypoint: ["/bin/sh", "-c", "exec python3 -m copyparty -a \"admin:$ADMIN_PASSWORD\" -v /w::rw,admin"]
    ports: ["3923:3923"]
    volumes:
      - copyparty_files:/w
      - copyparty_config:/cfg
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3923/?reset"]
      interval: 30s
      timeout: 5s
      retries: 3
