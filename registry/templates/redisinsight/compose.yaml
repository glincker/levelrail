services:
  redisinsight:
    image: redis/redisinsight:2.70
    ports: ["5540:5540"]
    environment:
      RI_APP_HOST: "0.0.0.0"
      RI_APP_PORT: "5540"
      RI_ENCRYPTION_KEY: $SERVICE_HEX_64_ENCRYPTIONKEY
    volumes:
      - redisinsight_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5540/"]
      interval: 10s
      timeout: 5s
      retries: 3
