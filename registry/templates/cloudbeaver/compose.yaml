services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.1.0
    ports: ["8978:8978"]
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8978/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
