services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: ["serve"]
    environment:
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
    ports: ["80:80"]
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/etc/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
