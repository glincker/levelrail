services:
  cryptgeon:
    image: cupcakearmy/cryptgeon:2.9.3
    ports: ["8000:8000"]
    environment:
      SIZE_LIMIT: "4 MiB"
      MAX_VIEWS: "100"
      MAX_EXPIRATION: "360"
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/live/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
