services:
  dagu:
    image: ghcr.io/dagucloud/dagu:2.25.4
    command: dagu start-all
    ports: ["8080"]
    volumes:
      - dagu_data:/var/lib/dagu
    environment:
      DAGU_HOST: 0.0.0.0
      DAGU_PORT: "8080"
      DAGU_AUTH_MODE: basic
      DAGU_AUTH_BASIC_USERNAME: admin
      DAGU_AUTH_BASIC_PASSWORD: $SERVICE_PASSWORD_ADMIN
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  dagu_data:
