services:
  appsmith:
    image: appsmith/appsmith-ce:v2.4.2
    ports: ["8080:80"]
    volumes:
      - appsmith_data:/appsmith-stacks
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
