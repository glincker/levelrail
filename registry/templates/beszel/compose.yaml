services:
  beszel:
    image: henrygd/beszel:0.19.0
    ports: ["8090:8090"]
    environment:
      APP_URL: ${SERVICE_URL_BESZEL:-http://localhost:8090}
    volumes:
      - beszel_data:/beszel_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
