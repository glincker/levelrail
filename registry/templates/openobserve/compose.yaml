services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.90.0
    ports: ["5080:5080"]
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: $SERVICE_PASSWORD_OPENOBSERVE
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve_data:/data
    healthcheck:
      test: ["CMD", "/openobserve", "node", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
