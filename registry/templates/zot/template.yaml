id: zot
name: Zot Registry
slogan: OCI native container image registry with a web UI, search and optional sync. The install form carries config.json as an editable file and images are stored on a volume.
description: OCI native container image registry with a web UI, search and optional sync. The install form carries config.json as an editable file and images are stored on a volume.
category: Developer Tools
documentation_url: https://zotregistry.dev/latest/
recommended_memory_bytes: 134217728
requires_gpu: false
manifest:
    id: zot
    name: Zot Registry
    description: OCI native container image registry with a web UI, search and optional sync. The install form carries config.json as an editable file and images are stored on a volume.
    icon: package
    category: Developer Tools
    documentation_url: https://zotregistry.dev/latest/
    source_repo: https://github.com/project-zot/zot
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/project-zot/zot/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Push an image with docker push to this address, then open the address to browse it. The starter config has no login, so keep it private or add authentication in the config file.
    compose_file: compose.yaml
    recommended_memory_bytes: 134217728
    env:
        - key: ZOT_CONFIG
          label: config.json
          description: The full zot configuration, mounted read-only.
          default: |
            {
              "distSpecVersion": "1.1.0",
              "storage": {
                "rootDirectory": "/var/lib/registry"
              },
              "http": {
                "address": "0.0.0.0",
                "port": "5000"
              },
              "log": {
                "level": "info"
              },
              "extensions": {
                "search": {
                  "enable": true
                },
                "ui": {
                  "enable": true
                }
              }
            }
          generate: ""
          length: 0
          required: false
          secret: false
          type: file
          service: zot
          path: /etc/zot/config.json
          mode: "0444"
    domains:
        - service: zot
          port: 5000
          description: Public address of the registry and its UI.
    healthcheck:
        service: zot
        port: 5000
        path: /v2/
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
