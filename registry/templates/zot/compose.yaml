services:
    zot:
        image: ghcr.io/project-zot/zot:v2.1.23
        ports: ["5000"]
        volumes:
            - data:/var/lib/registry
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: http
            path: /v2/
            port: 5000
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        configs:
            - source: lr_file_zot_config
              target: /etc/zot/config.json
              mode: "0444"
configs:
    lr_file_zot_config:
        content: |
            {
              "distSpecVersion": "1.1.0",
              "storage": {
                "rootDirectory": "/var/lib/registry"
              },
              "http": {
                "address": "0.0.0.0",
                "port": "5000"
              },
              "log": {
                "level": "info"
              },
              "extensions": {
                "search": {
                  "enable": true
                },
                "ui": {
                  "enable": true
                }
              }
            }
