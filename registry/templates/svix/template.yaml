id: svix
name: Svix
slogan: A webhooks sending service with retries, signatures, a message log and an HTTP API, backed by Postgres and Redis. Create applications and send events through the API with a token signed by your JWT secret.
description: A webhooks sending service with retries, signatures, a message log and an HTTP API, backed by Postgres and Redis. Create applications and send events through the API with a token signed by your JWT secret.
category: Developer Tools
documentation_url: https://docs.svix.com/
recommended_memory_bytes: 402653184
requires_gpu: false
manifest:
    id: svix
    name: Svix
    description: A webhooks sending service with retries, signatures, a message log and an HTTP API, backed by Postgres and Redis. Create applications and send events through the API with a token signed by your JWT secret.
    icon: webhook
    category: Developer Tools
    documentation_url: https://docs.svix.com/
    source_repo: https://github.com/svix/svix-webhooks
    license: MIT
    license_class: permissive
    license_url: https://github.com/svix/svix-webhooks/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Create an API token with the svix-server jwt generate command inside the container, then call the API at the published port.
    compose_file: compose.yaml
    recommended_memory_bytes: 402653184
    env:
        - key: DB_PASSWORD
          label: Database password
          description: Password for the bundled Postgres database. Generated once and reused on every redeploy.
          default: ""
          generate: password
          length: 32
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
        - key: JWT_SECRET
          label: JWT secret
          description: Signs the API tokens. Changing it invalidates every issued token.
          default: ""
          generate: hex
          length: 64
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: svix
          port: 8071
          description: Public address of the Svix HTTP API. Every call needs a bearer token.
    healthcheck:
        service: svix
        port: 8071
        path: /api/v1/health/
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
