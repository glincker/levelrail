services:
  unleash:
    image: unleashorg/unleash-server:latest
    ports: ["4242:4242"]
    environment:
      UNLEASH_URL: ${SERVICE_URL_UNLEASH:-http://localhost:4242}
      UNLEASH_DEFAULT_ADMIN_PASSWORD: $SERVICE_PASSWORD_ADMIN
      DATABASE_URL: postgres://unleash:$SERVICE_PASSWORD_DB@postgres/unleash
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
    depends_on: [postgres]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4242/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
      POSTGRES_DB: unleash
    volumes:
      - unleash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 5s
      timeout: 5s
      retries: 10
