id: wg-easy
name: WireGuard Easy
slogan: A WireGuard VPN server with a web UI for managing clients.
description: A WireGuard VPN server with a web UI for managing clients.
category: Networking
documentation_url: https://wg-easy.github.io/wg-easy/latest/
recommended_memory_bytes: 134217728
requires_gpu: false
platforms:
    - linux/amd64
    - linux/arm64
icon: wireguard
source_repo: https://github.com/wg-easy/wg-easy
license: AGPL-3.0
license_class: network-copyleft
license_url: https://github.com/wg-easy/wg-easy/blob/master/LICENSE
manifest:
    id: wg-easy
    name: WireGuard Easy
    description: A WireGuard VPN server with a web UI for managing clients.
    icon: wireguard
    category: Networking
    documentation_url: https://wg-easy.github.io/wg-easy/latest/
    source_repo: https://github.com/wg-easy/wg-easy
    license: AGPL-3.0
    license_class: network-copyleft
    license_url: https://github.com/wg-easy/wg-easy/blob/master/LICENSE
    hosted_use: unknown
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Needs NET_ADMIN and NET_RAW under a reviewed grant, and the WireGuard kernel module loaded on the host (modprobe wireguard).
        - Open the web UI through your domain and create the admin account.
        - Open UDP 51820 in the firewall and forward it to this host.
    compose_file: compose.yaml
    recommended_memory_bytes: 134217728
    env: []
    domains:
        - service: wg-easy
          port: 51821
          description: Public address of the wg-easy web UI.
    healthcheck:
        service: wg-easy
        port: 51821
        path: /
        expect: 200
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities:
        - class: net_admin
          service: wg-easy
          reason: Creates the wg0 interface and its firewall rules for the VPN.
          caps:
            - NET_ADMIN
            - NET_RAW
    requires_kernel_modules:
        - wireguard
