services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    ports: ["9696:9696"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - prowlarr_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9696/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
