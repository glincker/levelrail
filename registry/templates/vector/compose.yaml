services:
    vector:
        image: timberio/vector:0.61.0-alpine
        ports: ["8686", "8080"]
        command: ["--config", "/etc/vector/vector.yaml"]
        volumes:
            - data:/var/lib/vector
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8686/health || exit 1"]
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        configs:
            - source: lr_file_vector_config
              target: /etc/vector/vector.yaml
              mode: "0444"
configs:
    lr_file_vector_config:
        content: |
            data_dir: /var/lib/vector
            api:
              enabled: true
              address: 0.0.0.0:8686
            sources:
              http_in:
                type: http_server
                address: 0.0.0.0:8080
                decoding:
                  codec: json
            sinks:
              console_out:
                type: console
                inputs: [http_in]
                encoding:
                  codec: json
