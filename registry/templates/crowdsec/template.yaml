id: crowdsec
name: CrowdSec Local API
slogan: Collaborative security engine run here as the local API that other agents and bouncers register with. The log reading agent and the online API are switched off.
description: Collaborative security engine run here as the local API that other agents and bouncers register with. The log reading agent and the online API are switched off.
category: Security
documentation_url: https://docs.crowdsec.net/
recommended_memory_bytes: 268435456
requires_gpu: false
manifest:
    id: crowdsec
    name: CrowdSec Local API
    description: Collaborative security engine run here as the local API that other agents and bouncers register with. The log reading agent and the online API are switched off.
    icon: shield
    category: Security
    documentation_url: https://docs.crowdsec.net/
    source_repo: https://github.com/crowdsecurity/crowdsec
    license: MIT
    license_class: permissive
    license_url: https://github.com/crowdsecurity/crowdsec/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Register an agent or bouncer with cscli machines add or cscli bouncers add inside the container, then point it at this address.
    compose_file: compose.yaml
    recommended_memory_bytes: 268435456
    env: []
    domains:
        - service: crowdsec
          port: 8080
          description: Public address of the local API. Keep it private.
    healthcheck:
        service: crowdsec
        port: 8080
        path: /health
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
    requires_kernel_modules: []
