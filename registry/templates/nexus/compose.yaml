services:
  nexus:
    image: sonatype/nexus3:3.96.3
    ports: ["8081:8081"]
    volumes:
      - nexus_data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8081/service/rest/v1/status || wget -q -O /dev/null http://127.0.0.1:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
