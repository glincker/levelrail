services:
  gotify:
    image: gotify/server:2.6.1
    ports: ["8080:80"]
    environment:
      TZ: "Etc/UTC"
      GOTIFY_DEFAULTUSER_NAME: admin
      GOTIFY_DEFAULTUSER_PASS: $SERVICE_PASSWORD_ADMIN
    volumes:
      - gotify_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
