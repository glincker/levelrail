services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.4.10903-e5521bd8c-ls327
    ports: ["32400:32400"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      VERSION: docker
    volumes:
      - plex_config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:32400/identity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
