services:
  sshwifty:
    image: niruix/sshwifty:0.4.13-beta-release
    ports: ["8182"]
    environment:
      SSHWIFTY_SHAREDKEY: $SERVICE_PASSWORD_SHAREDKEY
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8182/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
