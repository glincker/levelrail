services:
  2fauth:
    image: 2fauth/2fauth:8.0.2
    ports: ["8000:8000"]
    environment:
      APP_KEY: $SERVICE_PASSWORD_32_APPKEY
      APP_URL: ${SERVICE_URL_2FAUTH:-http://localhost:8000}
      SITE_OWNER: admin@example.com
      DB_CONNECTION: sqlite
    volumes:
      - twofauth_data:/2fauth
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8000/ || wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
