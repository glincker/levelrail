services:
    blocky:
        image: ghcr.io/0xerr0r/blocky:v0.36.0
        ports: ["4000", "5353"]
        command: ["--config", "/app/config.yml"]
        healthcheck:
            test: ["NONE"]
        x-levelrail-healthcheck:
            kind: tcp
            port: 4000
            interval: 15s
            timeout: 8s
            retries: 10
            start_period: 20s
        configs:
            - source: lr_file_blocky_config
              target: /app/config.yml
              mode: "0444"
configs:
    lr_file_blocky_config:
        content: |
            upstreams:
              groups:
                default:
                  - 1.1.1.1
                  - 9.9.9.9
            blocking:
              denylists:
                ads:
                  - |
                    ads.example.com
              clientGroupsBlock:
                default:
                  - ads
            ports:
              dns: 5353
              http: 4000
