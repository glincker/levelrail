services:
  synapse:
    image: matrixdotorg/synapse:v1.145.0
    ports: ["8008:8008"]
    environment:
      SYNAPSE_SERVER_NAME: ${SERVICE_FQDN_SYNAPSE:-localhost}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - synapse_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8008/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
