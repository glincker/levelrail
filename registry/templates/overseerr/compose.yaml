services:
  overseerr:
    image: sctx/overseerr:1.34.0
    ports: ["5055:5055"]
    environment:
      TZ: "Etc/UTC"
    volumes:
      - overseerr_config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
