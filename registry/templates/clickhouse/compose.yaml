services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_PASSWORD: $SERVICE_PASSWORD_ADMIN
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
