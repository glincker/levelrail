    recommended_memory_bytes: 1073741824
    env:
        - key: ADMIN_PASSWORD
          label: Dashboard password
          description: Password for the admin user of the dashboard.
          default: ""
          generate: password
          length: 24
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: emqx
          port: 18083
          description: Public address of EMQX.
    healthcheck:
        service: emqx
        port: 18083
        path: /
        expect: 0
        kind: ""
        reason: ""
