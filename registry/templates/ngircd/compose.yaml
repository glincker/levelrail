services:
  ngircd:
    image: linuxserver/ngircd:27-r1-ls170
    ports: ["6667"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
    volumes:
      - ngircd_config:/config
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6667"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
volumes:
  ngircd_config:
