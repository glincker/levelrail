services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.12
    ports: ["8989:8989"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    volumes:
      - sonarr_config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8989/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
