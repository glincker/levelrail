services:
  postgrest:
    image: postgrest/postgrest:v16.6
    ports: ["3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:$SERVICE_PASSWORD_DB@db:5432/app
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: $SERVICE_PASSWORD_64_JWT
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_SERVER_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
    command:
      - sh
      - -c
      - |
        printf '%s\n' "CREATE ROLE anon NOLOGIN;" "CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD '$$POSTGRES_PASSWORD';" "GRANT anon TO authenticator;" "GRANT USAGE ON SCHEMA public TO anon;" > /docker-entrypoint-initdb.d/roles.sql
        exec docker-entrypoint.sh postgres
    volumes:
      - postgrest_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  postgrest_db:
