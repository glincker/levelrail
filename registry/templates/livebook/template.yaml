id: livebook
name: Livebook
slogan: Interactive and collaborative code notebooks for Elixir with a built in package manager and visualizations. A generated password protects the editor.
description: Interactive and collaborative code notebooks for Elixir with a built in package manager and visualizations. A generated password protects the editor.
category: Developer Tools
documentation_url: https://livebook.dev/
recommended_memory_bytes: 536870912
requires_gpu: false
manifest:
    id: livebook
    name: Livebook
    description: Interactive and collaborative code notebooks for Elixir with a built in package manager and visualizations. A generated password protects the editor.
    icon: notebook
    category: Developer Tools
    documentation_url: https://livebook.dev/
    source_repo: https://github.com/livebook-dev/livebook
    license: Apache-2.0
    license_class: permissive
    license_url: https://github.com/livebook-dev/livebook/blob/HEAD/LICENSE
    hosted_use: allowed
    listing:
        by: community
        vendor_org: ""
        proof: ""
    status: active
    status_reason: ""
    replaced_by: ""
    aliases: []
    first_run:
        - Sign in with the generated password shown in the deployment variables. Notebooks run code in this container, so keep the address private.
    compose_file: compose.yaml
    recommended_memory_bytes: 536870912
    env:
        - key: LIVEBOOK_PASSWORD
          label: Password
          description: Password for the Livebook editor.
          default: ""
          generate: password
          length: 24
          required: false
          secret: true
          type: ""
          service: ""
          path: ""
          mode: ""
    domains:
        - service: livebook
          port: 8080
          description: Public address of the notebook editor. Keep it private.
    healthcheck:
        service: livebook
        port: 8080
        path: /public/health
        expect: 0
        kind: ""
        reason: ""
    first_boot_seconds: 0
    console_command: []
    capabilities: []
