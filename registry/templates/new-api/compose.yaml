services:
  new-api:
    image: calciumion/new-api:v0.9.2.0
    ports: ["3000:3000"]
    environment:
      SQL_DSN: postgres://app:$SERVICE_PASSWORD_POSTGRES@postgres:5432/newapi?sslmode=disable
      REDIS_CONN_STRING: redis://redis:6379
      TZ: Etc/UTC
      SESSION_SECRET: $SERVICE_PASSWORD_64_SESSION
      ERROR_LOG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      POSTGRES_DB: newapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d newapi"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
