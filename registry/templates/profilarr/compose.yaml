services:
  profilarr:
    image: santiagosayshey/profilarr:v1.1.5
    ports: ["6868"]
    volumes:
      - profilarr_config:/config
    healthcheck:
      test: ["CMD-SHELL", 'wget --no-verbose --tries=1 --spider http://127.0.0.1:6868/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  profilarr_config:
