services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_DB
      POSTGRES_DB: docuseal
    volumes:
      - docuseal_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 5s
      timeout: 5s
      retries: 10
  docuseal:
    image: docuseal/docuseal:latest
    ports: ["3000:3000"]
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      HOST: ${SERVICE_URL_DOCUSEAL:-http://localhost:3000}
      DATABASE_URL: postgresql://docuseal:$SERVICE_PASSWORD_DB@postgresql:5432/docuseal
    volumes:
      - docuseal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
