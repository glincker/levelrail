services:
  dockge:
    image: louislam/dockge:1.5.0
    ports: ["5001"]
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
      - dockge_stacks:/opt/stacks
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:5001/ -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  dockge_data:
  dockge_stacks:
