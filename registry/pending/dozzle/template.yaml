id: dozzle
name: Dozzle
slogan: A small web viewer for live container logs on this host.
description: Needs read access to the Docker socket to list containers and stream their logs, so it can see every container on the host. Dozzle has no login by default, put it behind an authenticated proxy or add a users file. MIT licence.
category: Monitoring
documentation_url: https://dozzle.dev/guide/getting-started
recommended_memory_bytes: 67108864
requires_gpu: false
requires_docker_socket: true
platforms:
    - linux/amd64
    - linux/arm64
